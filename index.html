<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>英数逆算プランナー</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
/* ===========================================================
   黒板とチョーク — 教室の道具立てで組んだ配色
   =========================================================== */
:root{
  --board:      #000000;   /* 画面の地 */
  --board-deep: #000000;   /* 入力欄・ナビ */
  --panel:      #16171A;   /* カード面 */
  --rule:       #2A2C31;   /* 罫線 */
  --rule-soft:  transparent;
  --chalk:      #FFFFFF;   /* 主要テキスト */
  --chalk-dim:  #9DA1A8;   /* 副次テキスト */
  --chalk-far:  #6B7078;   /* さらに薄い */
  --yellow:     #2E8BF0;   /* プライマリ（青） */
  --red:        #E8384F;
  --green:      #22C1A6;
  --amber:      #F0B429;
  --tap: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  color:var(--chalk);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
#app{
  min-height:100vh;
  background:var(--board);
  padding:calc(env(safe-area-inset-top) + 16px) 16px 28px;
  max-width:560px;margin:0 auto;
}
h1,h2,h3{margin:0;font-weight:700}

/* セクション見出し */
.eyebrow{
  font-size:17px;letter-spacing:.01em;
  color:var(--chalk);font-weight:700;margin:0 0 12px;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- カウントダウン帯（画面の主題） ---------- */
.countdown{padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.cd-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd-big{font-size:56px;font-weight:800;line-height:.95;color:var(--chalk)}
.cd-unit{font-size:15px;color:var(--chalk-dim);font-weight:600}
.cd-label{font-size:13px;color:var(--chalk-dim);margin-top:8px}
.cd-none{color:var(--chalk-dim);font-size:14px}
.gaps{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.gap{
  flex:1 1 150px;border:none;border-radius:12px;
  padding:12px 14px;background:var(--panel);
}
.gap b{display:block;font-size:12px;color:var(--chalk-dim);font-weight:600}
.gap .v{font-size:22px;font-weight:800;margin-top:3px;white-space:nowrap}
.gap .v small{font-size:12px;color:var(--chalk-dim);font-weight:600;margin-left:3px;white-space:nowrap}
.gap-d{font-size:12px;color:var(--chalk-dim);font-weight:600;margin-top:5px;padding-top:5px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.gap-d small{font-size:11px;margin-left:2px}

/* ---------- カード・タスク ---------- */
section{margin-bottom:30px}
.card{border:none;border-radius:12px;background:var(--panel);padding:16px;margin-bottom:10px}

.task{
  display:flex;gap:13px;align-items:flex-start;
  border:none;border-left:4px solid var(--rule);
  border-radius:10px;background:var(--panel);
  padding:14px 15px;margin-bottom:10px;
  transition:opacity .16s;
}
.task[data-w="5"],.task[data-w="4"]{border-left-color:var(--red)}
.task[data-w="3"]{border-left-color:var(--amber)}
.task[data-w="2"],.task[data-w="1"]{border-left-color:var(--chalk-far)}
.task.done{opacity:.4;border-left-color:var(--green)}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:1px}
.check{
  flex:0 0 26px;height:26px;margin-top:1px;border:2px solid var(--chalk-far);
  border-radius:50%;background:none;cursor:pointer;position:relative;padding:0;
}
.check[aria-pressed="true"]{border-color:var(--green);background:var(--green)}
.check[aria-pressed="true"]::after{
  content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
  border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.t-body{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:700;line-height:1.4}
.t-meta{font-size:12.5px;color:var(--chalk-dim);margin-top:4px}
.t-range{color:var(--chalk);font-weight:700}
.t-sub{font-size:11px;color:var(--chalk-far);font-weight:600}

/* ---------- ストリーク（正の字） ---------- */
.streak{border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:18px;align-items:center}
.streak-n{font-size:38px;font-weight:800;line-height:1;color:var(--chalk)}
.streak-n small{font-size:13px;color:var(--chalk-dim);font-weight:600;margin-left:4px}
#tally{display:block;max-width:100%;height:auto}

/* ---------- 逆算メーター ---------- */
#meter{display:block;width:100%;height:auto;border:none;border-radius:12px;background:var(--panel)}

/* ---------- フォーム ---------- */
label{display:block;font-size:12px;color:var(--chalk-dim);font-weight:600;margin:14px 0 6px}
input,select,textarea{
  width:100%;background:#0E0F11;color:var(--chalk);
  border:1px solid var(--rule);border-radius:8px;padding:11px 12px;
  font-size:16px;font-family:inherit;min-height:var(--tap);
}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
button{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;padding:0 18px;border-radius:24px;
  border:1px solid var(--rule);background:none;color:var(--chalk);
  font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:16px;
}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--chalk-dim);font-weight:600}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:active{opacity:.75}
.btn-sm{width:auto;min-height:36px;padding:0 14px;font-size:13px;margin-top:0;border-radius:18px}

/* ---------- 一覧項目 ---------- */
.item{border:none;border-radius:12px;background:var(--panel);padding:14px 15px;margin-bottom:10px}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-title{font-weight:700;font-size:15.5px}
.item-sub{font-size:12.5px;color:var(--chalk-dim);margin-top:3px}
.unit-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.unit-line .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt{font-size:11px;color:var(--amber);letter-spacing:.06em;flex:0 0 auto}
.pg{font-size:12px;color:var(--chalk-dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0E0F11;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.x{background:none;border:none;color:var(--chalk-far);font-size:20px;line-height:1;padding:6px 4px;cursor:pointer;flex:0 0 auto}
.fold{margin-top:12px;border-top:1px solid var(--rule)}
.fold>summary{
  list-style:none;cursor:pointer;padding:12px 2px 4px;
  font-size:13px;font-weight:700;color:var(--yellow);
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"＋ "}
.fold[open]>summary::before{content:"− "}

/* ---------- 告知・空状態 ---------- */
.notice{
  border:none;border-radius:12px;background:rgba(46,139,240,.14);
  padding:14px 15px;margin-bottom:18px;font-size:13.5px;
}
.notice .btn{margin-top:12px}
.empty{border:none;border-radius:12px;background:var(--panel);padding:26px 16px;text-align:center;color:var(--chalk-dim);font-size:13.5px}
.empty b{display:block;color:var(--chalk);font-size:15px;margin-bottom:6px}

/* ---------- 週プラン ---------- */
.wk{border-top:1px solid var(--rule);padding:14px 0}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--chalk-dim)}
.wk-h b{color:var(--chalk);font-size:15px}
.wk-list{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--chalk-dim)}
.wk-list li{padding:4px 0}
.wk-list .d{color:var(--yellow);margin-right:9px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 分析 ---------- */
.chart{display:block;width:100%;height:auto;border:none;border-radius:12px;background:var(--panel)}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ax{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:#0E0F11}
.ax span{flex:1;min-width:0;font-size:11.5px;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ax input{width:58px;flex:0 0 auto;padding:6px 8px;min-height:36px;font-size:15px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--chalk-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- AIアドバイス ---------- */
.advice{border:none;border-radius:12px;background:var(--panel);padding:15px 16px}
.advice-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--chalk-far);font-weight:600;margin-bottom:10px}
.advice-b{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- 演習 ---------- */
.q{border:none;border-left:4px solid var(--rule);border-radius:10px;background:var(--panel);padding:15px 16px;margin-bottom:12px}
.q.ok{border-left-color:var(--green)}
.q.half{border-left-color:var(--amber)}
.q.ng{border-left-color:var(--red)}
.q-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.q-no{font-size:13px;font-weight:800;color:var(--chalk-dim)}
.q-type{font-size:11px;font-weight:700;color:var(--chalk-far);border:1px solid var(--rule);border-radius:10px;padding:1px 9px}
.q-score{margin-left:auto;font-size:15px;font-weight:800}
.q.ok .q-score{color:var(--green)} .q.half .q-score{color:var(--amber)} .q.ng .q-score{color:var(--red)}
.q-p{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--rule);border-radius:10px;background:#0E0F11;
  color:var(--chalk);padding:12px;font-size:14px;line-height:1.6;cursor:pointer;min-height:48px;
}
.opt-i{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--chalk-far);margin-top:2px}
.opt.picked{border-color:var(--yellow);background:rgba(46,139,240,.12)}
.opt.right{border-color:var(--green);background:rgba(34,193,166,.12)}
.opt.right .opt-i{color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(232,56,79,.1)}
.opt.wrong .opt-i{color:var(--red)}
.opt[disabled]{cursor:default}
.ansin{margin-top:12px;line-height:1.7;resize:vertical}
.ansbox{margin-top:12px;border:1px solid var(--rule);border-radius:10px;background:#0E0F11;padding:12px;font-size:14px;white-space:pre-wrap}
.ansbox b{display:block;font-size:11px;color:var(--chalk-far);margin-bottom:5px;font-weight:600}
.q-c{margin-top:12px;font-size:13px;color:var(--chalk-dim);border-top:1px solid var(--rule);padding-top:10px}
.q-e{font-size:13.5px;line-height:1.8;color:var(--chalk-dim);white-space:pre-wrap;padding:2px 0 8px}
.score{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:18px}
.score-n{font-size:52px;font-weight:800;line-height:1;color:var(--chalk)}
.score-n small{font-size:17px;color:var(--chalk-dim);margin-left:3px}
.score-s{font-size:13px;color:var(--chalk-dim);margin-top:7px}
.pick-auto{border:none;border-radius:10px;background:rgba(46,139,240,.14);padding:13px 14px;font-size:15px;font-weight:700}
.pick-auto .num{color:var(--yellow);margin-left:6px}

/* ---------- 学習時間 ---------- */
.timer{border-radius:12px;background:var(--panel);padding:16px}
.timer.running{background:rgba(46,139,240,.14);text-align:center}
.timer-today{font-size:14px;color:var(--chalk-dim)}
.timer-today b{color:var(--chalk);font-size:20px;font-weight:800;margin-left:6px}
.timer-m{font-size:13px;color:var(--chalk-dim);margin-bottom:6px}
.timer-c{font-size:46px;font-weight:800;line-height:1.1;color:var(--yellow)}
.play{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--rule);background:#0E0F11;color:var(--yellow);
  font-size:12px;cursor:pointer;padding:0;
}
.stats{display:flex;gap:9px;margin-bottom:14px}
.stats>div{flex:1;min-width:0;background:var(--panel);border-radius:12px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:12px;color:var(--chalk-dim);font-weight:600}
.stats span{display:block;font-size:16px;font-weight:800;margin-top:4px;white-space:nowrap}
.dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%}

/* ---------- 手入力の記録 ---------- */
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.seg button{
  background:none;border:none;color:var(--chalk-dim);font-family:inherit;
  font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;min-height:32px;
}
.seg button.on{background:var(--yellow);color:#fff}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qbtn{
  border:1px solid var(--rule);background:#0E0F11;color:var(--chalk);
  border-radius:10px;min-height:46px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.qbtn:active{background:rgba(46,139,240,.2);border-color:var(--yellow)}
.today-log{margin-top:14px;border-top:1px solid var(--rule)}

/* ---------- ポモドーロ ---------- */
.timer.running.rest{background:rgba(34,193,166,.14)}
.pomo-ph{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;
  color:var(--yellow);border:1px solid var(--yellow);border-radius:10px;padding:2px 10px;margin-bottom:8px;
}
.pomo-ph.rest{color:var(--green);border-color:var(--green)}
.notice.quiet{background:var(--panel);color:var(--chalk-dim);font-size:13px}
.notice.quiet .btn{margin-top:10px}

/* ---------- 実測ペース ---------- */
.mpp{border-radius:10px;background:rgba(46,139,240,.12);padding:13px 14px;margin-top:14px}
.mpp-h{font-size:14px;font-weight:700;color:var(--yellow)}
.mpp-s{font-size:13.5px;color:var(--chalk-dim);margin-top:10px;line-height:1.7}
.mpp-s b{color:var(--chalk)}

/* ---------- 着地予測 ---------- */
.fc{border-radius:12px;background:var(--panel);border-left:4px solid var(--chalk-far);padding:15px 16px;margin-bottom:11px}
.fc-h{font-size:16px;font-weight:700}
.fc-sub{font-size:12.5px;color:var(--chalk-dim);margin-top:4px}
.fc-bar{position:relative;height:8px;background:#0E0F11;border-radius:4px;margin-top:14px;overflow:visible}
.fc-bar i{display:block;height:100%;border-radius:4px}
.fc-dl{position:absolute;right:0;top:-4px;width:2px;height:16px;background:var(--chalk);border-radius:1px}
.fc-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--chalk-far);margin-top:6px;font-weight:600}
.fc-note{font-size:13px;color:var(--chalk-dim);margin-top:11px;line-height:1.7}
.fc-note b{color:var(--chalk)}
.notice.warn{background:rgba(232,56,79,.14)}

/* ---------- 設問別の入力 ---------- */
.secs{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sec{background:#0E0F11;border:1px solid var(--rule);border-radius:10px;padding:10px 11px}
.sec-h{display:flex;align-items:center;gap:6px}
.sec-h input{flex:1;min-width:0;min-height:38px;padding:8px 10px;font-size:14px}
.sec label{font-size:10.5px;margin:8px 0 3px}
.sec input[type=number]{min-height:38px;padding:7px 8px;font-size:15px}

/* ---------- 編集 ---------- */
.pen{
  flex:0 0 auto;background:none;border:none;color:var(--far, var(--chalk-far));
  font-size:16px;line-height:1;padding:7px 5px;cursor:pointer;
}
.item.edit,.card.edit{border-left:4px solid var(--yellow)}
.unit-line .pen{color:var(--chalk-far)}

/* ---------- 周回 ---------- */
.round-card{border-radius:12px;background:rgba(46,139,240,.14);padding:16px;margin-bottom:14px}
.rc-h{font-size:12px;color:var(--yellow);font-weight:700}
.rc-t{font-size:16px;font-weight:700;margin-top:4px;line-height:1.4}
.rc-q{font-size:13px;color:var(--chalk-dim);margin-top:12px}
.rc-b{display:flex;gap:8px;margin-top:8px}
.m-btn{
  flex:1;min-height:56px;border-radius:10px;border:1.5px solid var(--rule);
  background:#0E0F11;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.m-btn b{font-size:19px;line-height:1}
.m-btn:active{opacity:.7}
.rd{
  display:inline-block;font-size:10px;font-weight:700;vertical-align:1px;
  border:1px solid var(--chalk-far);color:var(--chalk-far);border-radius:8px;padding:0 6px;margin-left:5px;
}
.rd.done{border-color:var(--green);color:var(--green)}

/* ---------- 本棚 ---------- */
.shelf{border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.shelf>summary{
  list-style:none;cursor:pointer;display:flex;align-items:stretch;gap:0;
}
.shelf>summary::-webkit-details-marker{display:none}
.spine{flex:0 0 6px}
.sh-body{flex:1;min-width:0;padding:14px 15px}
.sh-title{display:block;font-size:15.5px;font-weight:700;line-height:1.35}
.sh-sub{display:block;font-size:12.5px;color:var(--chalk-dim);margin-top:4px}
.sh-open{padding:0 15px 15px 21px}
.shelf[open]>summary{border-bottom:1px solid var(--rule)}

/* ---------- 科目チップ ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--rule);border-radius:16px;padding:6px 10px 6px 12px;
  font-size:13px;font-weight:600;color:var(--chalk);background:#0E0F11;
}
.chip.core{border-color:var(--yellow);color:var(--yellow);padding-right:12px}
.chip.tap{cursor:pointer;padding:8px 13px;min-height:40px;font-family:inherit;text-align:left}
.chip.tap:active{opacity:.7}
.chip .x{font-size:16px;padding:0 2px}

/* ---------- タブ ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;background:#0B0C0E;border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;color:var(--chalk-far);
  padding:9px 0 10px;font-size:10px;font-weight:600;letter-spacing:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
}
nav button .g{
  font-size:14px;line-height:26px;font-weight:800;
  width:30px;height:26px;border-radius:13px;
}
nav button[aria-current="page"]{color:var(--yellow)}
nav button[aria-current="page"] .g{background:rgba(46,139,240,.18);color:var(--yellow)}

:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<nav>
  <button data-tab="today"  aria-current="page"><span class="g">今</span>今日</button>
  <button data-tab="plan"><span class="g">逆</span>逆算</button>
  <button data-tab="practice"><span class="g">演</span>演習</button>
  <button data-tab="analysis"><span class="g">析</span>分析</button>
  <button data-tab="books"><span class="g">材</span>教材</button>
  <button data-tab="config"><span class="g">設</span>設定</button>
</nav>

<script>
"use strict";
/* =========================================================

/* 模試の設問別。回ごとに構成が変わるので、固定の軸ではなく
   「設問名・得点・配点・全国平均」をそのまま持つ。 */
function sectionsOf(r){
  if(Array.isArray(r.sections) && r.sections.length) return r.sections;
  // 旧データ（分野別の得点率だけ）は、その場で設問形式に読み替える
  const ax = AXES[r.subject] || [];
  const bd = r.breakdown || {};
  return ax.filter(([k]) => bd[k] != null)
           .map(([k, label]) => ({ name: label, score: Math.round(bd[k] * 100), max: 100, nat: null }));
}
function secRate(x){
  const m = Number(x.max) || 0;
  return m > 0 ? Math.max(0, Math.min(1, Number(x.score) / m)) : 0;
}
function secNatRate(x){
  const m = Number(x.max) || 0;
  return (m > 0 && x.nat != null) ? Math.max(0, Math.min(1, Number(x.nat) / m)) : null;
}

/* =========================================================
   日付ユーティリティ（すべてローカル時間の YYYY-MM-DD 文字列で扱う）
   ========================================================= */
const WD = ["日","月","火","水","木","金","土"];
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function today(){ return ymd(new Date()); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function dow(s){ return parse(s).getDay(); }
function fmtMD(s){ const d = parse(s); return (d.getMonth()+1) + "/" + d.getDate(); }
function fmtFull(s){ const d = parse(s); return (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; }
/* 週の始まり＝月曜 */
function weekStart(s){ const d = parse(s); const off = (d.getDay() + 6) % 7; return addDays(s, -off); }

/* =========================================================
   周回（1周目・2周目・3周目）
   1周終わるごとに手応えを聞き、次の周でどれだけ回すかを決める
   ========================================================= */
function unitRound(u){ return Math.max(1, Number(u.round) || 1); }

/* 手応えから、次の周で回す割合を出す */
function masteryFactor(m, def){
  if(m === "ok") return 0.25;   // 定着 → 確認だけ
  if(m === "half") return 0.6;  // あやふや → 半分強
  if(m === "ng") return 1;      // 全然 → やり直し
  return def;
}
const MASTERY = { ok: ["◯", "定着", "var(--green)"], half: ["△", "あやふや", "var(--amber)"], ng: ["×", "全然", "var(--red)"] };

/* その単元の残り作業量。今の周の残り＋これから回る周の見込み */
function unitRemaining(u){
  const total = Number(u.totalPages) || 0;
  const cur = Math.min(Number(u.currentPage) || 0, total);
  const R = Math.max(1, Number(db.settings.targetRounds) || 1);
  const r = unitRound(u);
  const f = masteryFactor(u.mastery, Number(db.settings.roundFactor) || 0.6);
  let rest = total - cur;
  for(let k = r + 1; k <= R; k++) rest += Math.round(total * f);
  return rest;
}

/* 1周終わったのに手応えが未入力の単元 */
function pendingMastery(){
  const out = [];
  db.books.forEach(b => (b.units || []).forEach(u => {
    const total = Number(u.totalPages) || 0;
    if(u.status === "done" || total <= 0) return;
    if((Number(u.currentPage) || 0) >= total) out.push({ book: b, unit: u });
  }));
  return out;
}

/* 手応えを記録して次の周へ進める */
function setMastery(bookId, unitId, m){
  const u = findUnit(bookId, unitId);
  if(!u) return;
  u.mastery = m;
  const R = Math.max(1, Number(db.settings.targetRounds) || 1);
  const r = unitRound(u);
  if(m === "ok" && r >= 2){
    u.status = "done";                 // 2周目以降で定着したら卒業
  }else if(r >= R){
    u.status = "done";                 // 目標周回まで到達
  }else{
    u.round = r + 1;
    u.currentPage = 0;
    u.status = "in_progress";
  }
  save();
  generatePlan();
  render();
}

/* =========================================================
   逆算プランの生成
   優先度 = 重み × (残ページ ÷ 目標日までの残日数)
   重要度と締切の切迫度をどちらも効かせる
   ========================================================= */
/* 目標の種別。kind が無い古いデータは模試として扱う */
function goalKind(g){ return g.kind === "test" ? "test" : "exam"; }
function goalsOf(kind){ return db.goals.filter(g => goalKind(g) === kind); }

/* 締切は試験日そのものではなく「仕上げ日」＝ bufferDays 日前。
   模試も定期テストも、その科目で直近に来るものを締切にする。 */
function deadlineFor(subject, from){
  const buf = Math.max(0, Number(db.settings.bufferDays) || 0);
  const future = db.goals
    .filter(g => g.subject === subject && diffDays(from, g.examDate) >= 0)
    .sort((a,b) => a.examDate.localeCompare(b.examDate));
  if(!future.length) return null;
  // 定期テストは直前まで詰めるのが普通なので、仕上げ日の前倒しを短くする
  const b = goalKind(future[0]) === "test" ? Math.min(buf, 2) : buf;
  const fin = addDays(future[0].examDate, -b);
  return fin > from ? fin : future[0].examDate;
}

function dailyCap(dateStr){
  const s = db.settings;
  if(s.restDays && s.restDays.includes(dow(dateStr))) return 0;
  const weekend = dow(dateStr) === 0 || dow(dateStr) === 6;
  return Math.max(0, weekend ? s.holidayPages : s.weekdayPages);
}

function generatePlan(){
  const t0 = today();

  // 完了済みタスクだけ履歴として残す。未消化はここで消え、以下で組み直される
  db.tasks = db.tasks.filter(t => t.done);

  // 仮想の進捗カーソルを立てて日ごとに配っていく
  const sim = [];
  const R = Math.max(1, Number(db.settings.targetRounds) || 1);
  const defF = Number(db.settings.roundFactor) || 0.6;
  for(const b of db.books){
    if(b.logOnly) continue;               // 記録だけの教材は逆算に入れない
    const seq = b.order !== "weight";
    let idx = -1;
    for(const u of (b.units||[])){
      idx += 1;
      if(u.status === "done") continue;
      const total = Number(u.totalPages)||0;
      const cur = Math.min(Number(u.currentPage)||0, total);
      if(total - cur <= 0) continue;   // 1周終わって手応え待ちの単元は対象外
      sim.push({
        bookId: b.id, bookTitle: b.title, subject: b.subject, unitType: unitTypeOf(b.id),
        minPer: itemMinutes(b.id), seq, idx,
        unitId: u.id, unitName: u.name, weight: Number(u.weight)||3,
        cursor: cur, total: total,
        round: unitRound(u), maxRound: R,
        factor: masteryFactor(u.mastery, defF),
        deadline: deadlineFor(b.subject, t0) || addDays(t0, 56)
      });
    }
  }
  if(!sim.length){ db.lastPlan = t0; save(); return 0; }

  const HORIZON = 220;
  const maxTasks = Math.max(1, Number(db.settings.maxTasksPerDay)||3);
  const minChunk = Math.max(1, Number(db.settings.minChunk)||3);
  const maxPerBook = Math.max(1, Number(db.settings.maxPerBook)||2);
  const out = [];
  sim.forEach(u => u.debt = 0);

  /* 今の周の残り＋これから回る周の見込み */
  const remainAll = u => {
    let rest = u.total - u.cursor;
    let t = u.total;
    for(let k = u.round + 1; k <= u.maxRound; k++){
      t = Math.max(1, Math.round(t * u.factor));
      rest += t;
    }
    return rest;
  };

  const bdebt = {};   // 教材ごとの「まだ出していない量」

  for(let i = 0; i < HORIZON; i++){
    const date = addDays(t0, i);

    const live = sim.filter(u => remainAll(u) > 0);
    if(!live.length) break;

    // 各単元の必要ペース（仕上げ日までに全周終わらせるための1日あたり）
    live.forEach(u => {
      const left = Math.max(1, diffDays(date, u.deadline));
      u.need = remainAll(u) / left;
      u.score = u.weight * u.need;
    });

    // 教材ごとにまとめる。配分は教材単位で決め、その中を単元に割る
    const byBook = {};
    live.forEach(u => { (byBook[u.bookId] = byBook[u.bookId] || []).push(u); });
    const books = Object.keys(byBook).map(id => {
      // 順番モードは「周が若い順 → 章の順」。1周目を通してから2周目に入る
      const us = byBook[id].sort((x, y) =>
        x.seq ? ((x.round - y.round) || (x.idx - y.idx)) : (y.score - x.score));
      const need = us.reduce((a, u) => a + u.need, 0);
      bdebt[id] = (bdebt[id] || 0) + need;          // 休養日でも借りは溜まる
      return { id, us, need, minPer: us[0].minPer,
               score: Math.max.apply(null, us.map(u => u.score)),
               room: us.reduce((a, u) => a + (u.total - u.cursor), 0) };
    }).sort((x, y) => y.score - x.score);

    const capMin = dailyCapMinutes(date);
    if(capMin <= 0) continue;

    let spentMin = 0, picked = 0;
    for(const bk of books){
      if(picked >= maxTasks) break;
      const leftMin = capMin - spentMin;
      if(leftMin < bk.minPer * 0.6) continue;

      let quota = Math.floor(bdebt[bk.id] || 0);
      // 細切れを避ける。ただし残りわずかなら出し切る
      if(quota < minChunk && bk.room > minChunk) continue;
      quota = Math.min(quota, bk.room, Math.max(1, Math.floor(leftMin / bk.minPer)));
      if(quota < 1) continue;

      const slots = Math.min(maxPerBook, maxTasks - picked, bk.us.length);
      const per = Math.max(1, Math.ceil(quota / slots));
      for(let k = 0; k < slots && quota > 0; k++){
        const u = bk.us[k];
        const room = u.total - u.cursor;
        if(room <= 0) continue;
        const n = Math.min(per, quota, room);
        if(n < 1) continue;
        const from = u.cursor + 1, to = u.cursor + n;
        const rlabel = u.round > 1 ? u.round + "周目 " : "";
        out.push({
          id: uid(), date, bookId: u.bookId, unitId: u.unitId,
          bookTitle: u.bookTitle, unitName: u.unitName, subject: u.subject,
          weight: u.weight, fromPage: from, toPage: to, pages: n, round: u.round,
          unitType: u.unitType, range: rlabel + uRange(u.unitType, from, to), done: false
        });
        u.cursor += n;
        quota -= n;
        bdebt[bk.id] -= n;
        spentMin += n * bk.minPer;
        picked += 1;
        // その周を走り切ったら次の周へ
        if(u.cursor >= u.total && u.round < u.maxRound){
          u.round += 1;
          u.cursor = 0;
          u.total = Math.max(1, Math.round(u.total * u.factor));
        }
      }
    }
  }

  db.tasks = db.tasks.concat(out);
  db.tasks.sort((a,b) => a.date.localeCompare(b.date));
  db.lastPlan = t0;
  save();
  return out.length;
}

/* =========================================================
   タスク完了 / 取り消し（単元の現在ページを動かす唯一の経路）
   ========================================================= */
function toggleTask(id){
  const t = db.tasks.find(x => x.id === id);
  if(!t) return;
  const u = findUnit(t.bookId, t.unitId);
  // 周が進んだあとの古いタスクは進捗を動かさない
  if(u && t.round && unitRound(u) !== t.round){
    t.done = !t.done; save(); render(); return;
  }
  t.done = !t.done;
  if(u){
    if(t.done){
      u.currentPage = Math.min(Number(u.totalPages)||0, Math.max(Number(u.currentPage)||0, t.toPage));
      u.status = "in_progress";   // 走り切っても done にはせず、手応えの入力を待つ
    }else{
      u.currentPage = Math.max(0, Math.min(Number(u.currentPage)||0, t.fromPage - 1));
      u.status = u.currentPage > 0 ? "in_progress" : "todo";
    }
  }
  save();
  render();
}

function findUnit(bookId, unitId){
  const b = db.books.find(x => x.id === bookId);
  return b ? (b.units||[]).find(u => u.id === unitId) : null;
}

/* その科目の直近の模試結果。なければ null */
function latestResult(subject){
  const rs = db.examResults.filter(r => r.subject === subject)
                           .sort((a,b) => a.date.localeCompare(b.date));
  return rs.length ? rs[rs.length - 1] : null;
}
/* 直近の偏差値。まだ結果がなければ null */
function currentDevOf(goal){
  const r = latestResult(goal.subject);
  return (r && r.deviation != null) ? r.deviation : null;
}
/* 偏差値の行。目標偏差値が入っているときだけ出す */
function devLine(g){
  if(g.targetDev == null) return "";
  const cd = currentDevOf(g);
  const gap = cd != null ? (g.targetDev - cd) : null;
  return '<div class="gap-d">偏差値 ' + (cd != null ? cd : '—') + ' <small>→</small> ' + g.targetDev
    + (gap != null ? ' <small style="color:' + (gap > 0 ? 'var(--red)' : 'var(--green)') + '">'
        + (gap > 0 ? 'あと' + gap.toFixed(1) : '到達') + '</small>' : '')
    + '</div>';
}

/* 現在点は、模試結果があればそれを優先する（二重入力を避ける） */
function currentScoreOf(goal){
  const r = latestResult(goal.subject);
  return r ? r.score : goal.currentScore;
}
/* 結果待ちの模試＝日程は過ぎたのに、その日以降の結果が入っていないもの */
function pendingResults(){
  const t0 = today();
  return goalsOf("exam").filter(g => g.examDate < t0 &&
    !db.examResults.some(r => r.subject === g.subject && r.date >= g.examDate));
}

/* =========================================================
   ストリーク
   タスクのある日をすべて消化したら達成。タスクのない日は素通り
   ========================================================= */
function streakDays(){
  const byDate = {};
  for(const t of db.tasks){
    (byDate[t.date] = byDate[t.date] || []).push(t);
  }
  let n = 0, cur = today();
  // 今日がまだ途中なら、昨日から数え始める
  const todayTasks = byDate[cur] || [];
  if(!(todayTasks.length && todayTasks.every(t => t.done))) cur = addDays(cur, -1);
  for(let i = 0; i < 400; i++){
    const list = byDate[cur];
    if(list && list.length){
      if(list.every(t => t.done)) n++;
      else break;
    }
    cur = addDays(cur, -1);
  }
  return n;
}

function overdueCount(){
  const t0 = today();
  return db.tasks.filter(t => !t.done && t.date < t0).length;
}

/* =========================================================
   Canvas — 正の字のタリー
   ========================================================= */
function drawTally(cv, n){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cols = Math.min(6, Math.max(1, Math.ceil(n / 5) || 1));
  const cw = 34, gap = 13, pad = 4;
  const w = n ? cols * cw + (cols - 1) * gap + pad * 2 : 92;
  const h = 46;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  c.clearRect(0,0,w,h);
  c.lineCap = "round";
  c.lineWidth = 2.4;

  const full = Math.floor(n / 5), rest = n % 5;
  const shown = Math.min(cols, full + (rest ? 1 : 0));
  const skipped = Math.max(0, Math.ceil(n/5) - cols);

  for(let i = 0; i < shown; i++){
    const idx = i + skipped;
    const strokes = (idx < full) ? 5 : rest;
    drawSei(c, pad + i * (cw + gap), 7, cw, h - 16, strokes,
            idx < full ? "#FFFFFF" : "#2E8BF0");
  }
  if(!n){
    c.font = "600 12px system-ui, sans-serif";
    c.fillStyle = "#6B7078";
    c.fillText("まだ0日", pad, 26);
  }
}
// 正 = 一 丨 一 丨 一（筆順どおり5画）
function drawSei(c, x, y, w, h, strokes, color){
  const cx = x + w * 0.52, my = y + h * 0.50;
  const seg = [
    [[x + w*0.18, y], [x + w*0.86, y]],                 // ① 上の横
    [[cx, y], [cx, y + h]],                             // ② 中央の縦
    [[x + w*0.10, my], [cx, my]],                       // ③ 中ほどの短い横
    [[x + w*0.10, my], [x + w*0.10, y + h]],            // ④ 左の縦
    [[x - w*0.04, y + h], [x + w*1.04, y + h]]          // ⑤ 下の横
  ];
  c.strokeStyle = color;
  for(let i = 0; i < strokes; i++){
    const [a, b] = seg[i];
    c.globalAlpha = 0.92;
    c.beginPath();
    c.moveTo(a[0], a[1]);
    c.lineTo(b[0] + (Math.random()-0.5), b[1] + (Math.random()-0.5));
    c.stroke();
  }
  c.globalAlpha = 1;
}

/* =========================================================
   Canvas — 逆算メーター（週ごとの計画量と消化量）
   ========================================================= */
function drawMeter(cv){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 320, h = 150;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  c.clearRect(0,0,w,h);

  const t0 = today(), w0 = weekStart(t0);
  const weeks = [];
  for(let i = 0; i < 14; i++){
    const ws = addDays(w0, i * 7), we = addDays(ws, 6);
    const list = db.tasks.filter(t => t.date >= ws && t.date <= we);
    weeks.push({
      ws, we,
      plan: list.reduce((s,t) => s + t.pages, 0),
      done: list.filter(t => t.done).reduce((s,t) => s + t.pages, 0),
      exams: db.goals.filter(g => g.examDate >= ws && g.examDate <= we)
    });
  }
  const max = Math.max(1, ...weeks.map(x => x.plan));
  const padL = 6, padB = 30, padT = 26;
  const bw = (w - padL*2) / weeks.length;
  const inner = bw * 0.62;
  const base = h - padB;

  // 基準線
  c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, base + .5); c.lineTo(w, base + .5); c.stroke();

  weeks.forEach((wk, i) => {
    const x = padL + i * bw + (bw - inner) / 2;
    const bh = (wk.plan / max) * (base - padT);
    // 計画
    c.fillStyle = "#2A2C31";
    c.fillRect(x, base - bh, inner, bh);
    // 消化
    const dh = wk.plan ? (wk.done / wk.plan) * bh : 0;
    c.fillStyle = i === 0 ? "#2E8BF0" : "#22C1A6";
    c.fillRect(x, base - dh, inner, dh);
    // 模試の位置に縦線
    if(wk.exams.length){
      c.strokeStyle = "#E8384F"; c.lineWidth = 1.5;
      c.setLineDash([3,3]);
      c.beginPath(); c.moveTo(x + inner/2, padT - 10); c.lineTo(x + inner/2, base); c.stroke();
      c.setLineDash([]);
      c.fillStyle = "#E8384F";
      c.font = "700 9px system-ui, sans-serif";
      c.textAlign = "center";
      c.fillText("模試", x + inner/2, padT - 13);
    }
    // 週ラベル（隔週）
    if(i % 2 === 0){
      c.fillStyle = i === 0 ? "#2E8BF0" : "#6B7078";
      c.font = "600 9px ui-monospace, monospace";
      c.textAlign = "center";
      c.fillText(fmtMD(wk.ws), x + inner/2, base + 13);
      if(i === 0){
        c.font = "700 8px system-ui, sans-serif";
        c.fillText("今週", x + inner/2, base + 24);
      }
    }
  });
  c.textAlign = "left";
}

/* =========================================================
   Canvas — 得点・偏差値の推移
   ========================================================= */
function setupCanvas(cv, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 320;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c, w, h };
}

function drawTrend(cv, metric){
  const { c, w, h } = setupCanvas(cv, 190);
  const key = metric === "deviation" ? "deviation" : "score";
  const series = CORE.map(s => ({
    subject: s, color: s === "english" ? "#2E8BF0" : "#E8384F",
    pts: db.examResults.filter(r => r.subject === s && r[key] != null)
                       .sort((a,b) => a.date.localeCompare(b.date))
  })).filter(s => s.pts.length);

  if(!series.length){
    c.fillStyle = "#6B7078"; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("模試結果を入れると推移が出ます", w/2, h/2);
    c.textAlign = "left"; return;
  }

  const all = series.flatMap(s => s.pts);
  const dates = all.map(r => parse(r.date).getTime());
  let dMin = Math.min(...dates), dMax = Math.max(...dates);
  if(dMin === dMax){ dMin -= 86400000 * 7; dMax += 86400000 * 7; }

  const targets = goalsOf("exam")
    .filter(g => series.some(s => s.subject === g.subject))
    .map(g => metric === "score" ? g.targetScore : g.targetDev)
    .filter(v => Number.isFinite(v) && v > 0);
  const vals = all.map(r => r[key]).concat(targets);
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  const padV = Math.max(3, (vMax - vMin) * 0.25);
  vMin = Math.floor(vMin - padV); vMax = Math.ceil(vMax + padV);

  const L = 30, R = 10, T = 14, B = 26;
  const px = t => L + (t - dMin) / (dMax - dMin) * (w - L - R);
  const py = v => T + (1 - (v - vMin) / (vMax - vMin)) * (h - T - B);

  c.font = "600 9px ui-monospace, monospace";
  for(let i = 0; i <= 3; i++){
    const v = vMin + (vMax - vMin) * i / 3, y = py(v);
    c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(L, y + .5); c.lineTo(w - R, y + .5); c.stroke();
    c.fillStyle = "#6B7078"; c.textAlign = "right";
    c.fillText(Math.round(v), L - 5, y + 3);
  }

  // 目標の線（得点／偏差値のどちらでも）
  {
    goalsOf("exam").forEach(g => {
      if(!series.some(s => s.subject === g.subject)) return;
      const tv = metric === "score" ? g.targetScore : g.targetDev;
      if(!Number.isFinite(tv) || tv <= 0) return;
      const y = py(tv);
      c.strokeStyle = g.subject === "english" ? "#2E8BF0" : "#E8384F";
      c.globalAlpha = .45; c.setLineDash([4,4]); c.lineWidth = 1;
      c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke();
      c.setLineDash([]); c.globalAlpha = 1;
    });
  }

  series.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = 2; c.lineJoin = "round";
    c.beginPath();
    s.pts.forEach((r, i) => {
      const x = px(parse(r.date).getTime()), y = py(r[key]);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
    s.pts.forEach(r => {
      const x = px(parse(r.date).getTime()), y = py(r[key]);
      c.fillStyle = "#16171A"; c.beginPath(); c.arc(x, y, 4.5, 0, 7); c.fill();
      c.strokeStyle = s.color; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 3.4, 0, 7); c.stroke();
    });
  });

  c.fillStyle = "#6B7078"; c.font = "600 9px ui-monospace, monospace";
  const sorted = all.slice().sort((a,b) => a.date.localeCompare(b.date));
  c.textAlign = "left";  c.fillText(fmtMD(sorted[0].date), L, h - 8);
  if(sorted.length > 1){
    c.textAlign = "right"; c.fillText(fmtMD(sorted[sorted.length-1].date), w - R, h - 8);
  }
  c.textAlign = "left";
}

/* 目標点に到達するために必要な、分野の平均得点率
   いまの平均得点率を、目標点／現在点の比で引き上げた値 */
function targetRate(subject){
  const t0 = today();
  const gs = goalsOf("exam").filter(x => x.subject === subject)
                            .sort((a,b) => a.examDate.localeCompare(b.examDate));
  const g = gs.find(x => x.examDate >= t0) || gs[gs.length - 1];
  const r = latestResult(subject);
  if(!g || !r) return null;
  const secs = sectionsOf(r);
  if(!secs.length) return null;
  const tot = secs.reduce((a,x) => a + (Number(x.max) || 0), 0);
  const got = secs.reduce((a,x) => a + (Number(x.score) || 0), 0);
  if(!tot) return null;
  const avg = got / tot;
  const cur = currentScoreOf(g);
  if(!cur || !g.targetScore) return null;
  return { need: Math.min(1, avg * g.targetScore / cur), avg, goal: g };
}

/* =========================================================
   Canvas — 分野別レーダー（最新と、ひとつ前を重ねる）
   ========================================================= */
function drawRadar(cv, subject){
  const rs = db.examResults.filter(r => r.subject === subject)
                           .sort((a,b) => a.date.localeCompare(b.date));
  const latest = rs[rs.length - 1];
  const secs = latest ? sectionsOf(latest).slice(0, 10) : [];
  const { c, w, h } = setupCanvas(cv, secs.length ? 250 : 180);
  const cx = w / 2, cy = h / 2 + 2;
  const N = Math.max(3, secs.length);
  const R = Math.min(w, h) / 2 - (w < 380 ? 44 : 52);
  const ang = i => -Math.PI/2 + i * 2 * Math.PI / N;

  for(let g = 1; g <= 4; g++){
    c.strokeStyle = g === 4 ? "#3A3D44" : "#2A2C31"; c.lineWidth = 1;
    c.beginPath();
    for(let i = 0; i < N; i++){
      const r = R * g / 4, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.stroke();
  }
  for(let i = 0; i < N; i++){
    const x = cx + Math.cos(ang(i)) * R, y = cy + Math.sin(ang(i)) * R;
    c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(x, y); c.stroke();
  }

  if(!secs.length){
    c.fillStyle = "#6B7078"; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("設問別を入れると出ます", cx, cy + 4); c.textAlign = "left"; return;
  }

  // 設問名（長いものは丸める）
  c.font = "700 10px system-ui, sans-serif";
  secs.forEach((x, i) => {
    const lx = cx + Math.cos(ang(i)) * (R + 15), ly = cy + Math.sin(ang(i)) * (R + 15);
    c.fillStyle = "#9DA1A8";
    c.textAlign = Math.abs(lx - cx) < 8 ? "center" : (lx > cx ? "left" : "right");
    c.textBaseline = "middle";
    const label = x.name.length > 7 ? x.name.slice(0, 6) + "…" : x.name;
    c.fillText(label, lx, ly);
  });
  c.textAlign = "left"; c.textBaseline = "alphabetic";

  const poly = (vals, color, fill, dash) => {
    if(vals.some(v => v == null)) return;
    c.setLineDash(dash || []);
    c.beginPath();
    vals.forEach((v, i) => {
      const r = R * Math.max(0, Math.min(1, v));
      const x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.closePath();
    if(fill){ c.fillStyle = fill; c.fill(); }
    c.strokeStyle = color; c.lineWidth = 2; c.stroke();
    c.setLineDash([]);
  };

  // 全国平均
  const nat = secs.map(secNatRate);
  if(!nat.some(v => v == null)) poly(nat, "#6B7078", null, [4,4]);

  // 目標ライン
  const tr = targetRate(subject);
  if(tr){
    c.strokeStyle = "#E8384F"; c.lineWidth = 1.5; c.setLineDash([2,4]);
    c.beginPath();
    for(let i = 0; i < N; i++){
      const rr = R * tr.need;
      const x = cx + Math.cos(ang(i)) * rr, y = cy + Math.sin(ang(i)) * rr;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.stroke(); c.setLineDash([]);
  }

  // 自分
  poly(secs.map(secRate), "#2E8BF0", "rgba(46,139,240,.20)");

  // 演習の得点率（対応づけできた設問だけ点で置く）
  const pb = practiceBreakdown(subject);
  if(pb){
    secs.forEach((x, i) => {
      const k = sectionTopic(subject, x.name);
      if(!k || pb[k] == null) return;
      const r = R * Math.max(0, Math.min(1, pb[k]));
      const px = cx + Math.cos(ang(i)) * r, py = cy + Math.sin(ang(i)) * r;
      c.fillStyle = "#16171A"; c.beginPath(); c.arc(px, py, 5.5, 0, 7); c.fill();
      c.fillStyle = "#F0B429"; c.beginPath(); c.arc(px, py, 3.6, 0, 7); c.fill();
    });
  }
}

    const bd = sectionsOf(r).map(x => x.name + " " + x.score + "/" + x.max
      + "(" + Math.round(secRate(x)*100) + "%"
      + (x.nat != null ? " 全国平均" + x.nat : "") + ")").join(" / ");
    L.push("- " + r.date + " " + (r.name||"模試") + " / " + subjLabel(r.subject)
      + " / 得点" + r.score + (r.deviation != null ? " / 偏差値" + r.deviation : "")
      + (bd ? "\n  分野別: " + bd : ""));
  });

  L.push("\n## 手持ちの教材と進捗");
  if(!db.books.length) L.push("未登録");
  db.books.forEach(b => {
    L.push("- " + b.title + "（" + subjLabel(b.subject) + "）");
    (b.units||[]).forEach(u => {
      const tp = Number(u.totalPages)||0, cp = Math.min(Number(u.currentPage)||0, tp);
      L.push("  ・" + u.name + " 重要度" + u.weight + " " + cp + "/" + tp + uShort(b.id)
        + "（" + unitRound(u) + "周目 / 残" + unitRemaining(u) + uShort(b.id) + "）");
    });
  });

  L.push("\n## 直近2週間の消化");
  const from = addDays(t0, -14);
  const past = db.tasks.filter(t => t.date >= from && t.date < t0);
  const donePages = past.filter(t => t.done).reduce((s,t) => s + t.pages, 0);
  const planPages = past.reduce((s,t) => s + t.pages, 0);
  L.push("- 計画 " + planPages + "p に対して消化 " + donePages + "p"
    + (planPages ? "（" + Math.round(donePages/planPages*100) + "%）" : ""));
  L.push("- 連続達成 " + streakDays() + "日 / 積み残し " + overdueCount() + "件");

  L.push("\n## 学習時間");
  L.push("- 今日 " + fmtDur(minutesIn(t0, t0)) + " / 直近7日 " + fmtDur(minutesIn(addDays(t0,-6), t0))
    + " / 累計 " + fmtDur(totalMinutes()));
  const byB = {};
  db.sessions.filter(s => s.date >= addDays(t0, -13)).forEach(s => { byB[s.bookId] = (byB[s.bookId]||0) + s.minutes; });
  Object.keys(byB).sort((a,b) => byB[b] - byB[a]).forEach(k =>
    L.push("- 直近2週間 " + bookName(k) + " " + fmtDur(byB[k])));

  const ps = db.practiceSets.filter(x => x.result).slice(0, 6);
  if(ps.length){
    L.push("\n## AI演習の結果（新しい順）");
    ps.forEach(x => L.push("- " + x.date + " " + subjLabel(x.subject) + " / "
      + topicLabel(x.subject, x.topic) + " / 得点率" + Math.round(x.result.rate * 100) + "%"));
  }

  CORE.forEach(sj => {
    const tr = targetRate(sj);
    if(!tr) return;
    L.push("\n## " + subjLabel(sj) + "の目標ライン");
    L.push("- 目標" + tr.goal.targetScore + "点に必要な分野平均は"
      + Math.round(tr.need * 100) + "%（現在の平均" + Math.round(tr.avg * 100) + "%）");
  });

  L.push("\n## 着地予測（直近14日の実測ペースから）");
  db.subjects.forEach(sj => {
    const f = forecast(sj.id);
    if(!f) return;
    if(!f.enough){ L.push("- " + sj.label + " 残" + f.remaining + "p / 実績不足で予測できず"); return; }
    L.push("- " + sj.label + " 残" + f.remaining + "p / 実測" + f.pace.toFixed(1) + "p per day"
      + " / 必要" + (f.need != null ? f.need.toFixed(1) : "?") + "p per day"
      + " / 完了予定" + f.eta + " / 仕上げ日" + f.dl
      + " / " + (f.late > 0 ? f.late + "日おくれ" : Math.abs(f.late) + "日前倒し"));
  });

  L.push("\n## 今後2週間の計画");
  const nx = db.tasks.filter(t => t.date >= t0 && t.date < addDays(t0, 14));
  const agg = {};
  nx.forEach(t => { const k = t.bookTitle + " / " + t.unitName; agg[k] = (agg[k]||0) + t.pages; });
  const keys = Object.keys(agg);
  if(!keys.length) L.push("未作成");
  keys.forEach(k => L.push("- " + k + " " + agg[k] + "p"));

  return L.join("\n");
}

async function callClaude(system, userText, maxTokens, imageB64){
  const key = (db.settings.apiKey || "").trim();
  if(!key) throw new Error("APIキーが未設定です。設定タブで登録してください。");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: db.settings.model || "claude-sonnet-5",
      max_tokens: maxTokens || 1200,
      system,
      messages: [{
        role: "user",
        content: imageB64
          ? [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageB64 } },
             { type: "text", text: userText }]
          : userText
      }]
    })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
    if(res.status === 401) throw new Error("APIキーが違うようです。設定タブで入れ直してください。");
    if(res.status === 429) throw new Error("呼び出しが混み合っています。少し置いてからもう一度。");
    if(res.status === 400 && /credit|balance/i.test(msg)) throw new Error("クレジット残高が不足しています。コンソールで確認してください。");
    throw new Error(msg);
  }
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
}

/* =========================================================
   成績表の写真から読み取る
   画像はその場で縮小してから Claude に送る
   ========================================================= */
function shrinkImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("画像を読めませんでした。"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像を読めませんでした。"));
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * sc);
        cv.height = Math.round(img.height * sc);
        const c = cv.getContext("2d");
        c.fillStyle = "#fff"; c.fillRect(0, 0, cv.width, cv.height);
        c.drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =========================================================
   模試対策演習
   実在の過去問は複製せず、形式・範囲・難易度を模した新作を毎回生成する
   ========================================================= */
const PRACTICE_COUNT = 8;

function weakestTopic(subject){
  const list = PRACTICE_TOPICS[subject];
  const r = latestResult(subject);
  if(!r) return list[0][0];
  // 設問を得点率の低い順に見て、演習の分野に対応づくものを拾う
  const secs = sectionsOf(r).slice().sort((a,b) => secRate(a) - secRate(b));
  for(const x of secs){
    const k = sectionTopic(subject, x.name);
    if(k) return k;
  }
  return list[0][0];
}

function topicLabel(subject, key){
  const f = (PRACTICE_TOPICS[subject].find(t => t[0] === key) || [key, key]);
  return f[1];
}

function buildGenPrompt(formatId, subject, topic){
  const F = FORMATS[formatId];
  const detail = F[subject][topic];
  const r = latestResult(subject);
  const rate = r && r.breakdown && r.breakdown[topic] != null
    ? Math.round(r.breakdown[topic] * 100) + "%" : "不明";
  return [
    "## 出題の条件",
    "形式: " + F.label,
    "形式の特徴: " + F.outline,
    "範囲の制約: " + F.scope,
    "科目: " + subjLabel(subject),
    "分野: " + topicLabel(subject, topic),
    "分野の出題内容: " + detail,
    "直近の模試でのこの分野の得点率: " + rate,
    "",
    "## 指示",
    "上の形式・範囲・難易度に沿ったオリジナル問題を " + PRACTICE_COUNT + " 問つくってください。",
    "選択式と記述式を混ぜ、記述式は3問以上入れること。",
    "得点率が低い分野なので、基礎の確認から始めて段階的に難度を上げる構成にしてください。",
    "長文読解の場合は、英文パッセージを1つ書き、それに対する設問を並べること（パッセージは最初の問題文の中に含める）。",
    "数学の場合、数式は LaTeX を使わずプレーンテキストで書くこと（例: x^2、√3、(1/2)、a_n）。"
  ].join("\n");
}

const GEN_SYSTEM =
  "あなたは大学受験の問題作成者です。指定された試験形式の傾向・範囲・難易度を模した、完全にオリジナルの問題を作成します。\n" +
  "厳守事項:\n" +
  "・実在する模試・過去問・市販問題集の文章や設問を、そのまま、あるいは軽微な改変で用いてはいけません。素材の英文・数値・設定はすべて新規に創作すること。\n" +
  "・指定された範囲を超える知識を必要とする問題を出さないこと。\n" +
  "・解答は必ず一意に定まるようにし、設問文だけで解答に必要な情報が揃うようにすること。\n" +
  "出力は次のJSONのみ。前置き・後書き・コードフェンスは一切書かないこと。\n" +
  '{"questions":[{"no":1,"type":"choice","prompt":"問題文","choices":["選択肢1","選択肢2","選択肢3","選択肢4"],"answer":0,"explanation":"解説"},' +
  '{"no":2,"type":"written","prompt":"問題文","modelAnswer":"模範解答","rubric":"採点の観点を2〜3項目、各観点の配点つきで","explanation":"解説"}]}\n' +
  "answer は choices の 0 始まりの番号。type は choice か written のいずれか。解説は簡潔に、なぜそうなるかを示すこと。";

const GRADE_SYSTEM =
  "あなたは大学受験の採点者です。渡された設問・模範解答・採点基準にもとづき、受験生の記述解答を採点します。\n" +
  "・採点基準の観点ごとに満たしているかを見て、0〜100の得点率をつけること。表現が模範解答と違っても、内容が要件を満たしていれば加点すること。\n" +
  "・無解答・白紙は0点。的外れな内容も0点。部分的に正しければその分だけ与えること。\n" +
  "・comment は50字以内で、どこが足りないかを具体的に指摘すること。褒めるだけの講評は書かない。\n" +
  "出力は次のJSONのみ。前置き・コードフェンス・説明文は一切書かないこと。\n" +
  '{"grades":[{"no":1,"score":70,"comment":"…"}],"overall":"全体の講評を100字以内で"}';

function parseJSON(text){
  let s = String(text || "").trim();
  s = s.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a < 0 || b < a) throw new Error("応答をJSONとして読み取れませんでした。");
  return JSON.parse(s.slice(a, b + 1));
}

async function gradePractice(){
  const p = db.practice;
  if(!p || practiceBusy) return;

  // 選択式は端末側で判定。AIには記述式だけ渡す
  const written = p.questions.filter(q => q.type === "written");
  const unanswered = p.questions.filter(q => {
    const a = p.answers[q.no];
    return a == null || (typeof a === "string" && !a.trim());
  });
  if(unanswered.length && !confirm(unanswered.length + "問が未解答です。このまま採点しますか。")) return;

  practiceBusy = true; render();
  try{
    let grades = [], overall = "";
    if(written.length){
      const payload = written.map(q => [
        "### 問" + q.no,
        "設問: " + q.prompt,
        "模範解答: " + q.modelAnswer,
        "採点基準: " + q.rubric,
        "受験生の解答: " + ((p.answers[q.no] || "").trim() || "（無解答）")
      ].join("\n")).join("\n\n");
      const raw = await callClaude(GRADE_SYSTEM, payload, 2000);
      const parsed = parseJSON(raw);
      grades = parsed.grades || [];
      overall = parsed.overall || "";
    }

    const gmap = {};
    grades.forEach(g => { gmap[Number(g.no)] = g; });

    const detail = p.questions.map(q => {
      if(q.type === "choice"){
        const picked = p.answers[q.no];
        const ok = picked != null && Number(picked) === q.answer;
        return { no: q.no, type: "choice", score: ok ? 100 : 0, comment: ok ? "正解" : "不正解" };
      }
      const g = gmap[q.no] || {};
      const sc = Math.max(0, Math.min(100, Number(g.score) || 0));
      return { no: q.no, type: "written", score: sc, comment: String(g.comment || "") };
    });

    const rate = detail.reduce((s,d) => s + d.score, 0) / (detail.length * 100);
    p.result = { detail, overall, rate };
    p.status = "graded";
    db.practiceSets.unshift(JSON.parse(JSON.stringify(p)));
    db.practiceSets = db.practiceSets.slice(0, 40);
    save();
  }catch(err){
    alert("採点できませんでした。\n\n" + err.message);
  }finally{
    practiceBusy = false; render();
  }
}

/* 直近の演習を分野別に集計。レーダーへ重ねる */
function practiceBreakdown(subject){
  const bd = {}, cnt = {};
  db.practiceSets.filter(p => p.subject === subject && p.result)
    .slice(0, 6)
    .forEach(p => {
      bd[p.topic] = (bd[p.topic] || 0) + p.result.rate;
      cnt[p.topic] = (cnt[p.topic] || 0) + 1;
    });
  const out = {};
  Object.keys(bd).forEach(k => out[k] = bd[k] / cnt[k]);
  return Object.keys(out).length ? out : null;
}

/* =========================================================
   学習時間の記録
   ========================================================= */
const SERIES = ["#E8384F","#F0B429","#22C1A6","#2E8BF0","#A855F7","#EC4899","#84CC16","#F97316"];

function bookColor(bookId){
  const i = db.books.findIndex(b => b.id === bookId);
  return i < 0 ? "#6B7078" : SERIES[i % SERIES.length];
}
function bookName(bookId){
  const b = db.books.find(x => x.id === bookId);
  return b ? b.title : "その他";
}
/* 分を「6時間30分」「45分」の形に */
function fmtDur(min){
  const m = Math.max(0, Math.round(min));
  const h = Math.floor(m / 60), r = m % 60;
  if(!m) return "0分";
  if(!h) return r + "分";
  return r ? h + "時間" + r + "分" : h + "時間";
}
function minutesIn(from, to){
  return db.sessions.filter(s => s.date >= from && s.date <= to)
                    .reduce((a,s) => a + s.minutes, 0);
}
function totalMinutes(){
  return db.sessions.reduce((a,s) => a + s.minutes, 0);
}
function monthStart(){
  const d = new Date();
  return ymd(new Date(d.getFullYear(), d.getMonth(), 1));
}

function liveSeconds(){
  if(!db.timer) return 0;
  return Math.max(0, Math.floor((Date.now() - db.timer.startedAt) / 1000));
}
function liveClock(){
  const s = liveSeconds();
  const p = n => String(n).padStart(2, "0");
  return p(Math.floor(s/3600)) + ":" + p(Math.floor(s%3600/60)) + ":" + p(s%60);
}

function startTimer(bookId, unitId){
  if(db.timer) return;
  db.timer = { bookId, unitId: unitId || null, startedAt: Date.now() };
  save(); render();
}
function stopTimer(){
  if(!db.timer) return;
  const ps = pomoState();
  const min = Math.round((ps ? ps.focusSec : liveSeconds()) / 60);
  const t = db.timer;
  db.timer = null;
  if(min >= 1){
    db.sessions.unshift({
      id: uid(), date: today(), bookId: t.bookId, unitId: t.unitId,
      minutes: min, note: ""
    });
    db.sessions = db.sessions.slice(0, 2000);
    save(); render();
    alert(fmtDur(min) + " を記録しました。");
  }else{
    save(); render();
    alert("1分未満だったので記録しませんでした。");
  }
}

/* 教材のセレクト用。「書名 / 単元」の一覧 */
function materialOptions(selected){
  const out = [];
  db.books.forEach(b => {
    const us = b.units || [];
    if(!us.length){
      out.push(['{"b":"' + b.id + '"}', b.title]);
    }else{
      us.forEach(u => out.push(['{"b":"' + b.id + '","u":"' + u.id + '"}', b.title + " / " + u.name]));

  return out.map(([v, label]) =>
    '<option value=\'' + v + '\'' + (selected === v ? " selected" : "") + '>' + esc(label) + '</option>').join("");
}

  const { c, w, h } = setupCanvas(cv, 175);
  const t0 = today();
  const days = [];
  for(let i = 6; i >= 0; i--){
    const date = addDays(t0, -i);
    const list = db.sessions.filter(s => s.date === date);
    const by = {};
    list.forEach(s => { by[s.bookId] = (by[s.bookId] || 0) + s.minutes; });
    days.push({ date, by, total: list.reduce((a,s) => a + s.minutes, 0) });
  }
  const max = Math.max(60, ...days.map(d => d.total));
  const step = max <= 120 ? 30 : (max <= 300 ? 60 : 120);
  const top = Math.ceil(max / step) * step;

  const L = 40, R = 8, T = 12, B = 34;
  const base = h - B;
  const bw = (w - L - R) / days.length;
  const inner = Math.min(28, bw * 0.5);

  c.font = "600 10px system-ui, sans-serif";
  for(let v = 0; v <= top; v += step){
    const y = base - (v / top) * (base - T);
    c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(L, y + .5); c.lineTo(w - R, y + .5); c.stroke();
    c.fillStyle = "#6B7078"; c.textAlign = "right";
    c.fillText(v === 0 ? "0" : (v % 60 === 0 ? (v/60) + "時間" : v + "分"), L - 6, y + 3.5);
  }

  days.forEach((d, i) => {
    const x = L + i * bw + (bw - inner) / 2;
    let acc = 0;
    Object.keys(d.by).forEach(bid => {
      const mh = (d.by[bid] / top) * (base - T);
      c.fillStyle = bookColor(bid);
      c.fillRect(x, base - acc - mh, inner, mh);
      acc += mh;
    });
    c.fillStyle = d.date === t0 ? "#FFFFFF" : "#6B7078";
    c.font = "600 10px system-ui, sans-serif";
    c.textAlign = "center";
    c.fillText(fmtMD(d.date), x + inner/2, base + 14);
    c.fillText(WD[dow(d.date)], x + inner/2, base + 26);
  });
  c.textAlign = "left";
}

/* =========================================================
   Canvas — 教材別の時間配分（ドーナツ）
   ========================================================= */
function drawDonut(cv, from){
  const { c, w, h } = setupCanvas(cv, 190);
  const by = {};
  db.sessions.filter(s => s.date >= from).forEach(s => {
    by[s.bookId] = (by[s.bookId] || 0) + s.minutes;
  });
  const keys = Object.keys(by).sort((a,b) => by[b] - by[a]);
  const sum = keys.reduce((a,k) => a + by[k], 0);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 14, r = R * 0.58;

  if(!sum){
    c.strokeStyle = "#2A2C31"; c.lineWidth = R - r;
    c.beginPath(); c.arc(cx, cy, (R + r)/2, 0, Math.PI*2); c.stroke();
    c.fillStyle = "#6B7078"; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("記録なし", cx, cy + 4); c.textAlign = "left"; return;
  }

  let a0 = -Math.PI / 2;
  keys.forEach(k => {
    const frac = by[k] / sum, a1 = a0 + frac * Math.PI * 2;
    c.fillStyle = bookColor(k);
    c.beginPath();
    c.arc(cx, cy, R, a0, a1);
    c.arc(cx, cy, r, a1, a0, true);
    c.closePath(); c.fill();
    if(frac >= 0.08){
      const am = (a0 + a1) / 2, rm = (R + r) / 2;
      c.fillStyle = "#FFFFFF";
      c.font = "800 12px system-ui, sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(Math.round(frac * 100) + "%", cx + Math.cos(am) * rm, cy + Math.sin(am) * rm);
    }
    a0 = a1;
  });
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = "#FFFFFF"; c.font = "800 17px system-ui, sans-serif";
  c.fillText(fmtDur(sum), cx, cy - 4);
  c.fillStyle = "#6B7078"; c.font = "600 10px system-ui, sans-serif";
  c.fillText("30日間", cx, cy + 14);
  c.textAlign = "left"; c.textBaseline = "alphabetic";
}

/* 総ページを章数で均等に割る（余りは前の章に足す） */
function splitPages(total, n){
  const base = Math.floor(total / n), rem = total % n;
  return Array.from({length: n}, (_, i) => base + (i < rem ? 1 : 0));
}

function itemMinutes(bookId){
  const m = minutesPerPage(bookId);
  if(m) return m;
  const b = db.books.find(x => x.id === bookId);
  if(b && Number(b.minPerItem) > 0) return Number(b.minPerItem);
  return DEFAULT_MIN_PER[unitTypeOf(bookId)] || 4;
}

  return Math.max(0, Number(weekend ? s.holidayMinutes : s.weekdayMinutes) || 0);
}

/* 直近で計測に使った教材（最大3件） */
function recentMaterials(){
  const seen = [], out = [];
  for(const s of db.sessions){
    const k = s.bookId + "|" + (s.unitId || "");
    if(seen.includes(k)) continue;
    if(!db.books.some(b => b.id === s.bookId)) continue;
    seen.push(k); out.push(s);
    if(out.length >= 3) break;
  }
  return out;
}

/* =========================================================
   クラウド保存（GitHub の非公開 Gist）
   サーバーを持たずに端末をまたいで保存するための仕組み。
   トークンと鍵の類は同期対象から外す。
   ========================================================= */
const GIST_FILE = "gyakusan.json";
const GH = () => ({
  "Authorization": "Bearer " + (db.settings.ghToken || "").trim(),
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28",
  "Content-Type": "application/json"
});

function ghError(res, data){
  const msg = (data && data.message) || ("HTTP " + res.status);
  if(res.status === 401) return new Error("トークンが違うか期限切れです。設定で入れ直してください。");
  if(res.status === 403) return new Error("GitHub側で弾かれました。少し置いてからもう一度。（" + msg + "）");
  if(res.status === 404) return new Error("保存先が見つかりません。「読み込む」を押すと探し直します。");
  return new Error(msg);
}

/* 同期する中身。APIキーとトークンは載せない */
function cloudPayload(){
  const c = JSON.parse(JSON.stringify(db));
  c.settings.apiKey = "";
  c.settings.ghToken = "";
  c.syncedAt = new Date().toISOString();
  return JSON.stringify(c, null, 2);
}

/* 自分のGistから保存先を探す（端末を替えたときに使う） */
async function findGist(){
  const res = await fetch("https://api.github.com/gists?per_page=100", { headers: GH() });
  const data = await res.json().catch(() => null);
  if(!res.ok) throw ghError(res, data);
  const hit = (data || []).find(g => g.files && g.files[GIST_FILE]);
  return hit ? hit.id : null;
}

let syncing = false, syncTimer = null, lastPush = 0;

async function pushCloud(silent){
  const tok = (db.settings.ghToken || "").trim();
  if(!tok){ if(!silent) alert("先にトークンを登録してください。"); return; }
  if(syncing) return;
  syncing = true;
  if(!silent) render();
  try{
    const body = JSON.stringify({
      description: "英数逆算プランナー のデータ",
      public: false,
      files: { [GIST_FILE]: { content: cloudPayload() } }
    });
    let id = db.settings.gistId;
    let res, data;
    if(id){
      res = await fetch("https://api.github.com/gists/" + id, { method: "PATCH", headers: GH(), body });
      data = await res.json().catch(() => null);
      if(res.status === 404){ id = null; }              // 消されていたら作り直す
      else if(!res.ok) throw ghError(res, data);
    }
    if(!id){
      res = await fetch("https://api.github.com/gists", { method: "POST", headers: GH(), body });
      data = await res.json().catch(() => null);
      if(!res.ok) throw ghError(res, data);
      db.settings.gistId = data.id;
    }
    db.settings.lastSync = new Date().toISOString();
    lastPush = Date.now();
    localStorage.setItem(KEY, JSON.stringify(db));      // save() を呼ぶと同期が再帰する
    if(!silent) alert("クラウドに保存しました。");
  }catch(err){
    if(!silent) alert("保存できませんでした。\n\n" + err.message);
    else console.warn("自動保存に失敗", err);
  }finally{
    syncing = false;
    if(!silent) render();
  }
}

async function pullCloud(){
  const tok = (db.settings.ghToken || "").trim();
  if(!tok){ alert("先にトークンを登録してください。"); return; }
  if(syncing) return;
  syncing = true; render();
  try{
    let id = db.settings.gistId;
    if(!id) id = await findGist();
    if(!id) throw new Error("このアカウントに保存データが見つかりませんでした。まず「いますぐ保存」してください。");
    const res = await fetch("https://api.github.com/gists/" + id, { headers: GH() });
    const data = await res.json().catch(() => null);
    if(!res.ok) throw ghError(res, data);
    const f = data.files && data.files[GIST_FILE];
    if(!f) throw new Error("保存データの形式が違います。");
    const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const d = JSON.parse(text);
    if(!d || typeof d !== "object") throw new Error("読み取れませんでした。");
    const when = d.syncedAt ? new Date(d.syncedAt) : null;
    if(!confirm("クラウドのデータで置き換えます。"
        + (when ? "\n保存日時: " + when.toLocaleString("ja-JP") : "")
        + "\n\nこの端末の内容は上書きされます。よろしいですか。")) return;
    const keep = { apiKey: db.settings.apiKey, ghToken: db.settings.ghToken, gistId: id };
    db = Object.assign(structuredClone(DEFAULTS), d, {
      settings: Object.assign(structuredClone(DEFAULTS.settings), d.settings || {}, keep)
    });
    db.settings.lastSync = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify(db));
    tab = "today"; render();
    alert("読み込みました。");
  }catch(err){
    alert("読み込めませんでした。\n\n" + err.message);
  }finally{
    syncing = false; render();
  }
}

/* 変更のたびに呼ばれる。まとめて2分に1回だけ送る */
function scheduleSync(){
  if(!db.settings.ghAuto || !(db.settings.ghToken || "").trim()) return;
  clearTimeout(syncTimer);
  const wait = Math.max(5000, 120000 - (Date.now() - lastPush));
  syncTimer = setTimeout(() => pushCloud(true), wait);
}

/* =========================================================
   ポモドーロ
   startedAt からの経過で今どの局面かを算出する（状態を持たない）
   ========================================================= */
function pomoState(){
  const s = db.settings;
  if(!s.pomodoro || !db.timer) return null;
  const f = Math.max(1, Number(s.focusMin) || 25) * 60;
  const br = Math.max(1, Number(s.breakMin) || 5) * 60;
  const cyc = f + br;
  const el = liveSeconds();
  const pos = el % cyc;
  const inFocus = pos < f;
  return {
    inFocus,
    remain: inFocus ? f - pos : cyc - pos,
    sets: Math.floor(el / cyc) + (inFocus ? 0 : 1),
    focusSec: Math.floor(el / cyc) * f + Math.min(pos, f)
  };
}

/* =========================================================
   教材の単位
   ========================================================= */
const UNITS = {
  page:     { name: "ページ", short: "p",  pre: "p."  },
  question: { name: "問",     short: "問", pre: "No." },
  word:     { name: "語",     short: "語", pre: "No." }
};
function unitTypeOf(bookId){
  const b = db.books.find(x => x.id === bookId);
  return (b && UNITS[b.unitType]) ? b.unitType : "page";
}
function uShort(bookId){ return UNITS[unitTypeOf(bookId)].short; }
function uName(bookId){ return UNITS[unitTypeOf(bookId)].name; }
function uRange(type, from, to){
  const U = UNITS[type] || UNITS.page;
  return from === to ? U.pre + from : U.pre + from + "–" + to;
}
/* その科目の教材が全部同じ単位なら its short、混在なら「件」 */
function subjUnit(subject){
  const set = new Set(db.books.filter(b => b.subject === subject).map(b => unitTypeOf(b.id)));
  return set.size === 1 ? UNITS[[...set][0]].short : "件";
}

/* =========================================================
   実測ペース（1ページあたり何分かかっているか）
   学習時間と消化ページを突き合わせる
   ========================================================= */
const MPP_MIN_MINUTES = 30, MPP_MIN_PAGES = 5;

function minutesPerPage(bookId){
  const min = db.sessions.filter(s => s.bookId === bookId).reduce((a,s) => a + s.minutes, 0);
  const pages = db.tasks.filter(t => t.done && t.bookId === bookId).reduce((a,t) => a + t.pages, 0);
  if(min < MPP_MIN_MINUTES || pages < MPP_MIN_PAGES) return null;
  return min / pages;
}

/* 全教材をならした 分/ページ。データのない教材のフォールバックに使う */
function overallMPP(){
  const min = db.sessions.reduce((a,s) => a + s.minutes, 0);
  const pages = db.tasks.filter(t => t.done).reduce((a,t) => a + t.pages, 0);
  if(min < MPP_MIN_MINUTES || pages < MPP_MIN_PAGES) return null;
  return min / pages;
}

/* これから2週間で回る教材の構成で重みづけした 分/ページ */
function plannedMPP(){
  const t0 = today(), to = addDays(t0, 14);
  const nx = db.tasks.filter(t => t.date >= t0 && t.date < to);
  const ov = overallMPP();
  if(!nx.length) return ov;
  let wsum = 0, psum = 0;
  nx.forEach(t => {
    const m = minutesPerPage(t.bookId) || ov;
    if(m == null) return;
    wsum += m * t.pages; psum += t.pages;
  });
  return psum ? wsum / psum : ov;
}

/* タスクの束にかかる見込み時間（分） */
function estimateMinutes(tasks){
  if(!tasks.length) return null;
  let sum = 0;
  tasks.forEach(t => { sum += itemMinutes(t.bookId) * t.pages; });
  return Math.round(sum);
}

/* 使える時間から現実的な上限ページを出す */
function suggestCap(minutes){
  const m = plannedMPP();
  if(!m || minutes <= 0) return null;
  return Math.max(1, Math.round(minutes / m));
}

/* =========================================================
   着地予測
   直近の実測ペースで進めたとき、いつ終わるか
   ========================================================= */
const PACE_WINDOW = 14;

function paceStats(subject, days){
  const t0 = today(), from = addDays(t0, -days);
  const done = db.tasks.filter(t => t.done && t.date >= from && t.date <= t0
                              && (!subject || t.subject === subject));
  const pages = done.reduce((a,t) => a + t.pages, 0);
  const activeDays = new Set(done.map(t => t.date)).size;
  return { pages, perDay: pages / days, activeDays };
}

function subjectRemaining(subject){
  return db.books.filter(b => b.subject === subject && !b.logOnly)
    .flatMap(b => b.units || [])
    .filter(u => u.status !== "done")
    .reduce((a,u) => a + unitRemaining(u), 0);
}

/* 科目ごとの着地予測。remaining が 0 の科目は null */
function forecast(subject){
  const t0 = today();
  const remaining = subjectRemaining(subject);
  if(remaining <= 0) return null;
  const dl = deadlineFor(subject, t0);
  const daysLeft = dl ? Math.max(1, diffDays(t0, dl)) : null;
  const need = daysLeft ? remaining / daysLeft : null;
  const st = paceStats(subject, PACE_WINDOW);
  const pace = st.perDay;
  const eta = pace > 0 ? addDays(t0, Math.ceil(remaining / pace)) : null;
  const late = (eta && dl) ? diffDays(dl, eta) : null;   // 正なら遅れ
  return { remaining, dl, daysLeft, need, pace, eta, late,
           sample: st.activeDays, enough: st.activeDays >= 3 };
}

/* 遅れている科目の一覧 */
function behindSubjects(){
  return db.subjects
    .map(s => ({ id: s.id, label: s.label, f: forecast(s.id) }))
    .filter(x => x.f && x.f.enough && x.f.late != null && x.f.late > 0);
}

   一覧の ✎ を押すと、その項目だけがフォームに変わる

    + '<div><label>全国平均</label><input class="' + cls + '-a" data-i="' + i + '" type="number" inputmode="decimal" step="0.1" value="' + (x.nat != null ? x.nat : "") + '"></div></div>'

/* 画面上の入力値を配列に読み戻す */
function readSecs(cls){
  const out = [];
  document.querySelectorAll("." + cls + "-n").forEach(el => {
    const i = el.dataset.i;
    const g = suf => { const e = document.querySelector("." + cls + "-" + suf + '[data-i="' + i + '"]'); return e ? e.value.trim() : ""; };
    const name = el.value.trim();
    const sc = g("s"), mx = g("m"), av = g("a");
    if(!name && sc === "" && mx === "") return;
    out.push({ name: name || "設問" + (Number(i) + 1),
               score: Number(sc) || 0,
               max: Number(mx) || 0,
               nat: av === "" ? null : Number(av) });
  });
  return out;
}
