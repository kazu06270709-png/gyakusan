/* ---------- 今日 ---------- */
function viewToday(){
  const t0 = today();
  const list = db.tasks.filter(t => t.date === t0).sort((a,b) => b.weight - a.weight);
  const doneN = list.filter(t => t.done).length;
  const od = overdueCount();
  const st = streakDays();

  let h = "";

  // カウントダウン
  const upcoming = db.goals.filter(g => diffDays(t0, g.examDate) >= 0)
                           .sort((a,b) => a.examDate.localeCompare(b.examDate));
  h += '<div class="countdown">';
  if(upcoming.length){
    const g = upcoming[0];
    const isTest = goalKind(g) === "test";
    const d = diffDays(t0, g.examDate);
    const wk = Math.floor(d / 7), rd = d % 7;
    h += '<p class="eyebrow">次の' + (isTest ? '定期テスト' : '模試') + 'まで</p>';
    h += d >= 7
      ? '<div class="cd-row"><span class="cd-big num">' + wk + '</span><span class="cd-unit">週</span>'
        + '<span class="cd-big num" style="font-size:34px">' + rd + '</span><span class="cd-unit">日</span></div>'
      : '<div class="cd-row"><span class="cd-big num">' + d + '</span><span class="cd-unit">日</span></div>';
    h += '<div class="cd-label">' + fmtFull(g.examDate) + ' ・ ' + esc(g.name || "試験") + '</div>';
    const sameDay = upcoming.filter(x => x.examDate === g.examDate);
    h += '<div class="gaps">' + sameDay.map(x => {
      if(goalKind(x) === "test"){
        return '<div class="gap"><b>' + subjLabel(x.subject) + '</b><div class="v num">目標 '
          + x.targetScore + ' <small>/ ' + (x.maxScore || 100) + '</small></div></div>';
      }
      const cur = currentScoreOf(x);
      return '<div class="gap"><b>' + subjLabel(x.subject) + '</b><div class="v num">'
        + cur + ' <small>→</small> ' + x.targetScore
        + ' <small>あと' + Math.max(0, x.targetScore - cur) + '</small></div>'
        + devLine(x) + '</div>';
    }).join("") + '</div>';
  }else{
    h += '<p class="eyebrow">次の試験まで</p><p class="cd-none">模試や定期テストがまだ登録されていません。「逆算」タブで登録すると、ここから逆算が始まります。</p>';
  }
  h += '</div>';

  // 周回の区切り
  const pm = pendingMastery();
  if(pm.length){
    const R = Math.max(1, Number(db.settings.targetRounds) || 1);
    h += pm.slice(0, 3).map(({ book, unit }) => {
      const r = unitRound(unit);
      return '<div class="round-card">'
        + '<div class="rc-h">' + r + '周目、走り切りました</div>'
        + '<div class="rc-t">' + esc(book.title) + ' / ' + esc(unit.name) + '</div>'
        + '<div class="rc-q">手応えは？</div>'
        + '<div class="rc-b">'
        + Object.keys(MASTERY).map(k =>
            '<button class="m-btn" data-act="mastery" data-b="' + book.id + '" data-u="' + unit.id + '" data-m="' + k + '"'
            + ' style="color:' + MASTERY[k][2] + ';border-color:' + MASTERY[k][2] + '">'
            + '<b>' + MASTERY[k][0] + '</b>' + MASTERY[k][1] + '</button>').join("")
        + '</div>'
        + '<p class="item-sub" style="margin:10px 0 0">'
        + (r >= R ? '目標の' + R + '周に届いています。◯なら卒業、△×ならもう1周します。'
                  : '◯なら次の周は軽め、△は半分、×はもう一度ぜんぶ回します。') + '</p>'
        + '</div>';
    }).join("");
  }

  // バックアップのリマインド
  const le = db.settings.lastExport;
  const syncedRecently = db.settings.lastSync
    && diffDays(db.settings.lastSync.slice(0,10), t0) < 7;
  const hasData = db.books.length || db.sessions.length;
  if(hasData && !syncedRecently && (!le || diffDays(le, t0) >= 30)){
    h += '<div class="notice quiet">'
      + (le ? '前回の書き出しから' + diffDays(le, t0) + '日たちました。' : 'まだ一度も書き出していません。')
      + 'データは端末の中だけにあります。'
      + '<button class="btn ghost" data-tab-jump="config">設定を開く</button></div>';
  }

  // 着地予測の警告
  const bh = behindSubjects();
  if(bh.length){
    h += '<div class="notice warn"><b>このペースだと間に合いません。</b><br>'
      + bh.slice(0,3).map(x => esc(x.label) + ' ' + x.f.late + '日おくれ（1日 ' + x.f.need.toFixed(1) + subjUnit(x.id) + ' 必要）').join('<br>')
      + '<button class="btn primary" data-tab-jump="plan">くわしく見る</button></div>';
  }

  // 結果待ちの模試
  const pend = pendingResults();
  if(pend.length){
    h += '<div class="notice"><b>受け終わった模試の結果が未入力です。</b><br>'
       + pend.slice(0,3).map(g => fmtMD(g.examDate) + ' ' + subjLabel(g.subject)).join(' ・ ')
       + '<button class="btn primary" data-tab-jump="analysis">結果を入れる</button></div>';
  }

  // 積み残し
  if(od > 0){
    h += '<div class="notice"><b>' + od + '件の積み残しがあります。</b><br>'
       + '重要度と模試までの残り日数で組み直します。未消化のページは消えません。'
       + '<button class="btn primary" data-act="regen">プランを組み直す</button></div>';
  }

  // 今日のタスク
  const est = estimateMinutes(list.filter(x => !x.done));
  h += '<section><p class="eyebrow">' + fmtFull(t0) + ' ・ ' + doneN + '/' + list.length + ' 消化'
    + (est ? ' ・ 残り約' + fmtDur(est) : '') + '</p>';
  if(!list.length){
    h += db.books.length
      ? '<div class="empty"><b>今日の割り当てはありません</b>「逆算」タブでプランを作成してください。</div>'
      : '<div class="empty"><b>まず教材を登録する</b>参考書と単元を入れると、模試日から逆算して日々の範囲が決まります。</div>';
  }else{
    h += list.map(t =>
      '<div class="task' + (t.done ? ' done' : '') + '" data-w="' + t.weight + '">'
      + '<button class="check" aria-pressed="' + t.done + '" data-act="toggle" data-id="' + t.id + '" aria-label="完了にする"></button>'
      + '<div class="t-body">'
      + '<div class="t-sub">' + subjLabel(t.subject) + ' ・ 重要度 ' + t.weight + '</div>'
      + '<div class="t-title">' + esc(t.unitName) + '</div>'
      + '<div class="t-meta">' + esc(t.bookTitle) + ' <span class="t-range">' + t.range + '</span> ・ ' + t.pages + (UNITS[t.unitType] || UNITS.page).short + '</div>'
      + '</div>'
      + (t.done || db.timer ? '' :
          '<button class="play" data-act="tstart" data-b="' + t.bookId + '" data-u="' + t.unitId + '" aria-label="この教材で計測を開始">▶</button>')
      + '</div>').join("");
  }
  h += '</section>';

  // 学習時間
  const todayMin = minutesIn(t0, t0);
  const manual = db.settings.logMode !== "timer";
  h += '<section><p class="eyebrow">学習時間</p>';

  if(db.timer){
    const bk = db.books.find(x => x.id === db.timer.bookId);
    const un = bk && db.timer.unitId ? (bk.units||[]).find(x => x.id === db.timer.unitId) : null;
    const ps = pomoState();
    h += '<div class="timer running' + (ps && !ps.inFocus ? ' rest' : '') + '">'
      + '<div class="timer-m">' + esc(bk ? bk.title : "教材") + (un ? ' / ' + esc(un.name) : '') + '</div>'
      + (ps ? '<div class="pomo-ph' + (ps.inFocus ? '' : ' rest') + '" id="tphase">'
              + (ps.inFocus ? '集中' : '休憩') + '</div>' : '')
      + '<div class="timer-c num" id="tlive">' + (ps ? mmss(ps.remain) : liveClock()) + '</div>'
      + (ps ? '<div class="timer-m" id="tsub">経過 ' + liveClock() + ' ・ ' + ps.sets + 'セット</div>' : '')
      + '<button class="btn danger" data-act="tstop">記録して止める</button></div>';
  }else{
    const opts = materialOptions(db.settings.lastMat);
    h += '<div class="timer">'
      + '<div class="log-head"><span class="timer-today">今日 <b class="num">' + fmtDur(todayMin) + '</b></span>'
      + '<span class="seg">'
      + '<button class="' + (manual ? 'on' : '') + '" data-act="logmode" data-v="manual">手入力</button>'
      + '<button class="' + (manual ? '' : 'on') + '" data-act="logmode" data-v="timer">タイマー</button>'
      + '</span></div>';

    if(!opts){
      h += '<p class="item-sub" style="margin:10px 0 0">教材を登録すると記録できます。</p>';
    }else if(manual){
      h += '<select id="q-mat" data-act="qmat" style="margin-top:12px">' + opts + '</select>'
        + '<div class="quick">'
        + [15, 30, 45, 60, 90, 120].map(m =>
            '<button class="qbtn" data-act="quicklog" data-m="' + m + '">'
            + (m >= 60 ? Math.floor(m / 60) + '時間' + (m % 60 ? (m % 60) + '分' : '') : m + '分') + '</button>').join("")
        + '</div>'
        + '<div class="row" style="gap:9px;align-items:flex-end">'
        + '<div><label for="q-h">時間</label><input id="q-h" type="number" inputmode="numeric" min="0" value="0"></div>'
        + '<div><label for="q-m">分</label><input id="q-m" type="number" inputmode="numeric" min="0" max="59" value="0"></div>'
        + '<div style="flex:0 0 auto"><button class="btn primary" data-act="quicklog" data-m="0" style="margin-top:0;padding:0 20px">記録</button></div></div>';
    }else{
      const rec = recentMaterials();
      h += (rec.length
        ? '<div class="chips" style="margin-top:12px">' + rec.map(x => {
            const bk = db.books.find(y => y.id === x.bookId);
            const un = bk && x.unitId ? (bk.units||[]).find(y => y.id === x.unitId) : null;
            return '<button class="chip tap" data-act="tstart" data-b="' + x.bookId + '" data-u="' + (x.unitId||"") + '">'
              + '<span class="dot" style="background:' + bookColor(x.bookId) + '"></span>'
              + esc(bk ? bk.title : "") + (un ? ' / ' + esc(un.name) : '') + '</button>';
          }).join("") + '</div>'
        : '')
        + '<select id="t-mat" style="margin-top:12px">' + opts + '</select>'
        + '<button class="btn primary" data-act="tstart">計測を開始</button>';
    }

    // 今日つけた記録
    const todays = db.sessions.filter(x => x.date === t0);
    if(todays.length){
      h += '<div class="today-log">' + todays.map(x => {
        const bk = db.books.find(y => y.id === x.bookId);
        const un = bk && x.unitId ? (bk.units||[]).find(y => y.id === x.unitId) : null;
        return '<div class="unit-line" style="border-top-color:var(--rule)">'
          + '<span class="dot" style="background:' + bookColor(x.bookId) + '"></span>'
          + '<span class="nm">' + esc(bookName(x.bookId)) + (un ? ' / ' + esc(un.name) : '') + '</span>'
          + '<span class="pg" style="color:var(--chalk);font-weight:700">' + fmtDur(x.minutes) + '</span>'
          + '<button class="x" data-act="delsession" data-id="' + x.id + '" aria-label="削除">×</button></div>';
      }).join("") + '</div>';
    }
    h += '</div>';
  }
  h += '</section>';

  // ストリーク
  h += '<div class="streak"><div><p class="eyebrow">連続達成</p>'
     + '<div class="streak-n num">' + st + '<small>日</small></div></div>'
     + '<canvas id="tally"></canvas></div>';

  return h;
}

/* ---------- 逆算 ---------- */
function viewPlan(){
  const t0 = today();
  let h = '<p class="eyebrow">逆算メーター</p>';
  h += '<canvas id="meter"></canvas>';
  h += '<p class="item-sub" style="margin:7px 0 0">薄い柱が週の計画量、色のついた部分が消化済み。赤い破線が模試の週です。</p>';
  h += '<button class="btn primary" data-act="regen">プランを組み直す</button>';
  if(db.lastPlan) h += '<p class="item-sub" style="text-align:center;margin-top:6px">最終作成 ' + fmtFull(db.lastPlan) + '</p>';

  // 週別
  const upcoming = db.tasks.filter(t => t.date >= t0);
  if(upcoming.length){
    h += '<section style="margin-top:26px"><p class="eyebrow">これからの週</p>';
    const byWeek = {};
    upcoming.forEach(t => { (byWeek[weekStart(t.date)] = byWeek[weekStart(t.date)] || []).push(t); });
    Object.keys(byWeek).sort().slice(0,6).forEach((ws, i) => {
      const list = byWeek[ws];
      const pages = list.reduce((s,t) => s + t.pages, 0);
      const wkMin = estimateMinutes(list);
      h += '<div class="wk"><div class="wk-h"><b>' + (i === 0 ? '今週' : fmtMD(ws) + 'の週') + '</b><span>'
         + list.length + 'タスク' + (wkMin ? ' ・ 約' + fmtDur(wkMin) : '') + '</span></div><ul class="wk-list">';
      const agg = {};
      list.forEach(t => {
        const k = t.bookTitle + " / " + t.unitName;
        if(!agg[k]) agg[k] = { n: 0, u: (UNITS[t.unitType] || UNITS.page).short };
        agg[k].n += t.pages;
      });
      Object.keys(agg).slice(0,6).forEach(k =>
        h += '<li><span class="d">' + agg[k].n + agg[k].u + '</span>' + esc(k) + '</li>');
      h += '</ul></div>';
    });
    h += '</section>';
  }

  // 着地予測
  h += '<section style="margin-top:26px"><p class="eyebrow">着地予測</p>';
  const fc = db.subjects.map(s => ({ s, f: forecast(s.id) })).filter(x => x.f);
  const mppNow = plannedMPP();
  if(!fc.length){
    h += '<div class="empty"><b>予測できる教材がありません</b>教材を登録してプランを作ると、間に合うかどうかを出します。</div>';
  }else{
    h += fc.map(({ s, f }) => {
      if(!f.enough){
        return '<div class="fc"><div class="fc-h">' + esc(s.label) + '</div>'
          + '<div class="fc-sub">残り ' + f.remaining + subjUnit(s.id)
          + (f.dl ? ' ・ 仕上げ ' + fmtMD(f.dl) + '（あと' + f.daysLeft + '日）' : '')
          + '</div>'
          + '<p class="item-sub" style="margin:8px 0 0">実績が' + f.sample + '日ぶんしかありません。3日ぶん記録がたまると予測できます。'
          + (f.need ? '目安は1日 ' + f.need.toFixed(1) + subjUnit(s.id) + ' です。' : '') + '</p></div>';
      }
      const ok = f.late <= 0;
      const col = ok ? "var(--green)" : "var(--red)";
      // 今日→仕上げ日 を100%として、予測がどこに着地するか
      const span = Math.max(f.daysLeft || 1, 1);
      const etaPos = Math.min(140, Math.max(2, Math.round(diffDays(today(), f.eta) / span * 100)));
      const gap = f.need != null ? f.need - f.pace : null;
      return '<div class="fc" style="border-left-color:' + col + '">'
        + '<div class="fc-h">' + esc(s.label)
        + ' <span style="color:' + col + ';font-size:13px">'
        + (ok ? (f.late === 0 ? 'ちょうど' : Math.abs(f.late) + '日前倒し') : f.late + '日おくれ') + '</span></div>'
        + '<div class="fc-sub">残り ' + f.remaining + subjUnit(s.id) + ' ・ 実測 ' + f.pace.toFixed(1) + subjUnit(s.id) + '/日'
        + '（直近' + PACE_WINDOW + '日）</div>'
        + '<div class="fc-bar"><i style="width:' + Math.min(100, etaPos) + '%;background:' + col + '"></i>'
        + '<span class="fc-dl"></span></div>'
        + '<div class="fc-legend"><span>今日</span><span>仕上げ ' + fmtMD(f.dl) + '</span></div>'
        + '<div class="fc-note">このペースだと <b>' + fmtMD(f.eta) + '</b> に完了。'
        + (ok ? '間に合います。'
              : '間に合わせるには1日 <b style="color:' + col + '">' + f.need.toFixed(1) + subjUnit(s.id) + '</b>'
                + (gap > 0 ? '（あと+' + gap.toFixed(1) + '）' : '') + ' 必要です。'
                + (mppNow ? '実測だと1日およそ <b>' + fmtDur(f.need * mppNow) + '</b> かかります。' : ''))
        + '</div></div>';
    }).join("");
  }
  h += '</section>';

  // 模試
  h += '<section style="margin-top:26px"><p class="eyebrow">模試と目標点</p>';
  const gs = goalsOf("exam").slice().sort((a,b) => a.examDate.localeCompare(b.examDate));
  if(!gs.length){
    h += '<div class="empty"><b>模試が未登録です</b>日程を入れると、そこから逆算が始まります。</div>';
  }else{
    h += gs.map(g => isEd("goal", g.id) ? edGoalExam(g) :
      '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + esc(g.name || "模試") + ' ・ ' + subjLabel(g.subject) + '</div>'
      + '<div class="item-sub">' + fmtFull(g.examDate) + ' ・ 現在 ' + currentScoreOf(g) + ' → 目標 ' + g.targetScore
      + (g.targetDev != null
          ? ' ・ 偏差値 ' + (currentDevOf(g) != null ? currentDevOf(g) : '—') + ' → ' + g.targetDev : '')
      + '</div>'
      + '</div>' + edBtn("goal", g.id) + '</div></div>').join("");
  }
  h += '<details class="fold"><summary>模試を追加</summary><div class="card" style="margin:8px 0 0">'
     + '<label for="g-name">模試の名前</label><input id="g-name" placeholder="第3回 全統高2模試">'
     + '<div class="row"><div><label for="g-date">実施日</label><input id="g-date" type="date" value="' + addDays(t0, 60) + '"></div>'
     + '<div><label for="g-subj">科目</label><select id="g-subj">' + subjOptions("english", true) + '</select></div></div>'
     + '<div class="row"><div><label for="g-cur">現在の点</label><input id="g-cur" type="number" inputmode="numeric" placeholder="112"></div>'
     + '<div><label for="g-tgt">目標点</label><input id="g-tgt" type="number" inputmode="numeric" placeholder="125"></div></div>'
     + '<label for="g-tdev">目標偏差値（任意）</label><input id="g-tdev" type="number" inputmode="decimal" step="0.1" placeholder="65">'
     + '<p class="item-sub" style="margin:6px 0 0">現在の偏差値は、分析タブに入れた模試結果から自動で拾います。'
     + '偏差値は受験者全体との相対値なので、目標点とは別物として並べて表示します。</p>'
     + '<button class="btn" data-act="addgoal">模試を追加する</button></div></details></section>';

  // 定期テスト
  h += '<section style="margin-top:26px"><p class="eyebrow">定期テスト</p>';
  const ts = goalsOf("test").slice().sort((a,b) => a.examDate.localeCompare(b.examDate));
  if(!ts.length){
    h += '<div class="empty"><b>定期テストが未登録です</b>科目ごとに実施日を入れると、模試と同じように逆算されます。</div>';
  }else{
    h += ts.map(g => {
      if(isEd("goal", g.id)) return edGoalTest(g);
      const done = diffDays(t0, g.examDate) < 0;
      const dd = diffDays(t0, g.examDate);
      return '<div class="item"><div class="item-head"><div>'
        + '<div class="item-title">' + esc(g.name || "定期テスト") + ' ・ ' + subjLabel(g.subject)
        + (g.resultScore != null ? ' <span class="num" style="color:var(--green)">' + g.resultScore + '点</span>' : '') + '</div>'
        + '<div class="item-sub">' + fmtFull(g.examDate)
        + (done ? '（終了）' : ' ・ あと' + dd + '日')
        + ' ・ 目標 ' + g.targetScore + '/' + (g.maxScore || 100) + '</div>'
        + (done && g.resultScore == null
            ? '<div class="row" style="gap:8px;margin-top:9px;align-items:center">'
              + '<input class="res-in" data-id="' + g.id + '" type="number" inputmode="numeric" placeholder="取った点" style="min-height:38px">'
              + '<button class="btn btn-sm primary" data-act="setresult" data-id="' + g.id + '">記録</button></div>'
            : '')
        + '</div>' + edBtn("goal", g.id) + '</div></div>';
    }).join("");
    const scored = ts.filter(g => g.resultScore != null);
    if(scored.length){
      const avg = scored.reduce((a,g) => a + g.resultScore / (g.maxScore || 100), 0) / scored.length;
      h += '<p class="item-sub" style="margin-top:8px">記録済み ' + scored.length + '科目の平均得点率 '
        + '<b style="color:var(--chalk)">' + Math.round(avg * 100) + '%</b></p>';
    }
  }
  h += '<details class="fold"><summary>定期テストを追加</summary><div class="card" style="margin:8px 0 0">'
     + '<label for="tt-name">テストの名前</label><input id="tt-name" placeholder="2学期中間考査">'
     + '<div class="row"><div><label for="tt-date">実施日</label><input id="tt-date" type="date" value="' + addDays(t0, 21) + '"></div>'
     + '<div><label for="tt-subj">科目</label><select id="tt-subj">' + subjOptions(null, false) + '</select></div></div>'
     + '<div class="row"><div><label for="tt-tgt">目標点</label><input id="tt-tgt" type="number" inputmode="numeric" value="80"></div>'
     + '<div><label for="tt-max">満点</label><input id="tt-max" type="number" inputmode="numeric" value="100"></div></div>'
     + '<p class="item-sub" style="margin:8px 0 0">科目ごとに1件ずつ登録してください。範囲は教材タブで、その科目の単元として入れます。</p>'
     + '<button class="btn" data-act="addtest">定期テストを追加する</button></div></details></section>';

  return h;
}

/* ---------- 分析 ---------- */
function viewAnalysis(){
  const rs = db.examResults.slice().sort((a,b) => b.date.localeCompare(a.date));
  let h = "";

  // 目標とのギャップ
  h += '<p class="eyebrow">目標とのギャップ</p><div class="gaps" style="margin-top:0">';
  CORE.forEach(s => {
    const t0 = today();
    const gs = goalsOf("exam").filter(x => x.subject === s).sort((a,b) => a.examDate.localeCompare(b.examDate));
    const g = gs.find(x => x.examDate >= t0) || gs[gs.length - 1];
    const r = latestResult(s);
    if(!g && !r) return;
    const cur = r ? r.score : (g ? g.currentScore : 0);
    const tgt = g ? g.targetScore : null;
    const diff = tgt == null ? null : tgt - cur;
    h += '<div class="gap"><b>' + subjLabel(s) + '</b><div class="v num">' + cur
       + (tgt == null ? '' : ' <small>→</small> ' + tgt
          + ' <small style="color:' + (diff > 0 ? 'var(--red)' : 'var(--green)') + '">'
          + (diff > 0 ? 'あと' + diff : '到達') + '</small>')
       + '</div>' + (g ? devLine(g) : '') + '</div>';
  });
  h += '</div>';
  if(!rs.length && !db.goals.length){
    h = '<div class="empty"><b>まだ何もありません</b>「逆算」タブで模試を登録し、受けたら結果をここに入れてください。</div>';
  }

  // AIアドバイス
  const adv = db.weeklyAdvice;
  h += '<section style="margin-top:24px"><p class="eyebrow">AIアドバイス</p>';
  if(adv.length){
    h += '<div class="advice"><div class="advice-h">' + fmtFull(adv[0].date)
      + ' ・ ' + esc(modelLabel(adv[0].model)) + '</div>'
      + '<div class="advice-b">' + esc(adv[0].content) + '</div></div>';
  }else{
    h += '<div class="empty"><b>まだ生成していません</b>模試結果と教材を入れてからボタンを押すと、来週の重点を出します。</div>';
  }
  h += '<button class="btn ' + (advising ? '' : 'primary') + '" data-act="advise"' + (advising ? ' disabled' : '') + '>'
    + (advising ? '生成中…' : (adv.length ? '新しく生成する' : 'アドバイスを生成する')) + '</button>';
  if(!(db.settings.apiKey || "").trim()){
    h += '<p class="item-sub" style="margin:7px 0 0">使うには設定タブで Claude の APIキーを登録してください。</p>';
  }
  if(adv.length > 1){
    h += '<details class="fold"><summary>過去のアドバイス（' + (adv.length - 1) + '件）</summary>'
      + adv.slice(1).map(a =>
          '<div class="advice" style="margin-top:8px"><div class="advice-h">' + fmtFull(a.date)
          + ' ・ ' + esc(modelLabel(a.model))
          + '<button class="x" data-act="deladvice" data-id="' + a.id + '" aria-label="削除">×</button></div>'
          + '<div class="advice-b">' + esc(a.content) + '</div></div>').join("")
      + '</details>';
  }
  h += '</section>';

  // 学習時間レポート
  const t0a = today();
  h += '<section style="margin-top:24px"><p class="eyebrow">学習推移（教材）</p>'
    + '<div class="stats">'
    + '<div><b>今日</b><span class="num">' + fmtDur(minutesIn(t0a, t0a)) + '</span></div>'
    + '<div><b>今月</b><span class="num">' + fmtDur(minutesIn(monthStart(), t0a)) + '</span></div>'
    + '<div><b>累計</b><span class="num">' + fmtDur(totalMinutes()) + '</span></div>'
    + '</div>'
    + '<canvas id="stack" class="chart"></canvas></section>';

  h += '<section style="margin-top:24px"><p class="eyebrow">時間配分（教材）</p>'
    + '<canvas id="donut" class="chart"></canvas>';
  const from30 = addDays(t0a, -29);
  const byBook = {};
  db.sessions.filter(s => s.date >= from30).forEach(s => { byBook[s.bookId] = (byBook[s.bookId]||0) + s.minutes; });
  const bkeys = Object.keys(byBook).sort((a,b) => byBook[b] - byBook[a]);
  if(bkeys.length){
    h += '<div class="legend" style="flex-direction:column;gap:7px">'
      + bkeys.map(k => '<span><i style="background:' + bookColor(k) + '"></i>'
          + esc(bookName(k)) + ' <b style="color:var(--chalk)">' + fmtDur(byBook[k]) + '</b></span>').join("")
      + '</div>';
  }
  h += '<details class="fold"><summary>手動で記録を追加</summary><div class="card" style="margin:8px 0 0">'
    + '<label for="s-date">日付</label><input id="s-date" type="date" value="' + t0a + '">'
    + '<label for="s-mat">教材</label><select id="s-mat">' + (materialOptions(null) || '<option value="">（教材が未登録）</option>') + '</select>'
    + '<div class="row"><div><label for="s-h">時間</label><input id="s-h" type="number" inputmode="numeric" min="0" max="24" value="0"></div>'
    + '<div><label for="s-m">分</label><input id="s-m" type="number" inputmode="numeric" min="0" max="59" value="30"></div></div>'
    + '<button class="btn" data-act="addsession">この記録を追加</button></div></details>';

  const recent = db.sessions.slice(0, 30);
  if(recent.length){
    h += '<details class="fold"' + (editing && editing.k === "session" ? ' open' : '') + '><summary>記録の一覧（' + db.sessions.length + '件）</summary>'
      + recent.map(s => {
          if(isEd("session", s.id)) return edSession(s);
          const b = db.books.find(x => x.id === s.bookId);
          const u = b && s.unitId ? (b.units||[]).find(x => x.id === s.unitId) : null;
          return '<div class="unit-line"><span class="dot" style="background:' + bookColor(s.bookId) + '"></span>'
            + '<span class="nm">' + esc(bookName(s.bookId)) + (u ? ' / ' + esc(u.name) : '') + '</span>'
            + '<span class="pg">' + fmtMD(s.date) + '</span>'
            + '<span class="pg" style="color:var(--chalk);font-weight:700">' + fmtDur(s.minutes) + '</span>'
            + edBtn("session", s.id) + '</div>';
        }).join("")
      + '</details>';
  }
  h += '</section>';

  // 推移
  h += '<section style="margin-top:24px"><p class="eyebrow">推移</p>'
    + '<div class="row" style="gap:6px;margin-bottom:9px">'
    + '<button class="btn btn-sm ' + (trendMetric === "score" ? 'primary' : 'ghost') + '" data-act="metric" data-m="score" style="flex:1;margin:0">得点</button>'
    + '<button class="btn btn-sm ' + (trendMetric === "deviation" ? 'primary' : 'ghost') + '" data-act="metric" data-m="deviation" style="flex:1;margin:0">偏差値</button></div>'
    + '<canvas id="trend" class="chart"></canvas>'
    + '<div class="legend">'
    + '<span><i style="background:var(--yellow)"></i>英語</span>'
    + '<span><i style="background:var(--red)"></i>数学</span>'
    + '<span>破線が目標' + (trendMetric === "score" ? '点' : '偏差値') + '</span>'
    + '</div></section>';

  // レーダー
  CORE.forEach(s => {
    const r = latestResult(s);
    h += '<section style="margin-top:24px"><p class="eyebrow">' + subjLabel(s) + ' の分野別</p>'
      + '<canvas id="radar-' + s + '" class="chart"></canvas>';
    if(r){
      const secs = sectionsOf(r);
      const worst = secs.slice().sort((a,b) => secRate(a) - secRate(b))[0];
      const hasNat = secs.length && secs.every(x => x.nat != null);
      h += '<p class="item-sub" style="margin:7px 0 0">' + fmtFull(r.date) + ' 時点。';
      if(worst) h += 'いちばん低いのは <b style="color:var(--red)">' + esc(worst.name) + '</b>（'
        + Math.round(secRate(worst) * 100) + '%）。';
      if(hasNat){
        const below = secs.filter(x => secRate(x) < secNatRate(x))
                          .sort((a,b) => (secRate(a) - secNatRate(a)) - (secRate(b) - secNatRate(b)));
        h += '<span style="color:var(--chalk-dim)">灰の破線が全国平均。</span>';
        h += below.length
          ? '平均を下回っているのは ' + below.slice(0,3).map(x => esc(x.name)
              + '（−' + Math.round((secNatRate(x) - secRate(x)) * 100) + 'pt）').join('、') + '。'
          : '<b style="color:var(--green)">全設問で全国平均を上回っています。</b>';
      }
      h += '</p>';
      const tr = targetRate(s);
      if(tr){
        const short = secs.filter(x => secRate(x) < tr.need)
                          .sort((a,b) => secRate(a) - secRate(b));
        h += '<p class="item-sub" style="margin:6px 0 0">'
          + '<span style="color:var(--red)">赤の点線が目標ライン</span>。'
          + tr.goal.targetScore + '点に届くには平均 <b style="color:var(--chalk)">'
          + Math.round(tr.need * 100) + '%</b> 必要です（いま' + Math.round(tr.avg * 100) + '%）。'
          + (short.length
              ? '足りないのは ' + short.slice(0,3).map(x => esc(x.name)
                  + '（−' + Math.round((tr.need - secRate(x)) * 100) + 'pt）').join('、') + '。'
              : '全設問が目標ラインに届いています。')
          + '</p>';
      }
      if(practiceBreakdown(s)) h += '<p class="item-sub" style="margin:6px 0 0;color:var(--amber)">黄の点は演習での得点率です。</p>';
    }
    h += '</section>';
  });

  // 結果一覧
  h += '<section style="margin-top:26px"><p class="eyebrow">模試結果</p>';
  if(!rs.length){
    h += '<div class="empty"><b>結果が未登録です</b>模試を受けたら、下のフォームから入れてください。</div>';
  }else{
    h += rs.map(r => isEd("result", r.id) ? edResult(r) :
      '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + esc(r.name || "模試") + ' ・ ' + subjLabel(r.subject) + '</div>'
      + '<div class="item-sub">' + fmtFull(r.date) + ' ・ 得点 ' + r.score
      + (r.deviation != null ? ' ・ 偏差値 ' + r.deviation : '')
      + (sectionsOf(r).length ? ' ・ 設問' + sectionsOf(r).length + '件' : '') + '</div>'
      + '</div>' + edBtn("result", r.id) + '</div></div>').join("");
  }

  // 入力フォーム
  h += '<details class="fold" open><summary>結果を追加</summary><div class="card" style="margin:8px 0 0">'
    + '<label for="r-name">模試の名前</label><input id="r-name" placeholder="26年度第1回全統高2模試" value="' + esc(newMeta.name) + '">'
    + '<div class="row"><div><label for="r-date">受験日</label><input id="r-date" type="date" value="' + (newMeta.date || today()) + '"></div>'
    + '<div><label for="r-subj">科目</label><select id="r-subj" data-act="rsubj">' + subjOptions(resultSubject, true) + '</select></div></div>'
    + '<div class="row"><div><label for="r-score">得点</label><input id="r-score" type="number" inputmode="numeric" placeholder="112" value="' + esc(newMeta.score) + '"></div>'
    + '<div><label for="r-dev">偏差値</label><input id="r-dev" type="number" inputmode="decimal" step="0.1" placeholder="56.2" value="' + esc(newMeta.dev) + '"></div></div>'
    + '<button class="btn ' + (ocrBusy ? '' : 'primary') + '" data-act="ocr"' + (ocrBusy ? ' disabled' : '') + '>'
    + (ocrBusy ? '読み取り中…' : '📷 成績表の写真から読み取る') + '</button>'
    + '<p class="item-sub" style="margin:6px 0 0">模試ナビの「設問別」の画面を撮って読み込ませると、下の欄が自動で埋まります。'
    + '画像は読み取りのために Claude に送られます（1回およそ2円）。</p>'
    + '<label style="margin-top:16px">設問別</label>'
    + '<p class="item-sub" style="margin:0 0 8px">成績表の「設問別」をそのまま写してください。全国平均は任意ですが、入れると平均との差が見えます。</p>'
    + secRows(newSecs, "r-sec")
    + (db.examResults.some(x => x.subject === resultSubject)
        ? '<button class="btn ghost btn-sm" data-act="seccopy" style="margin-top:8px">前回の設問名を引き継ぐ</button>' : '')
    + '<button class="btn" data-act="addresult">この結果を保存する</button></div></details></section>';

  return h;
}
/* ---------- 演習 ---------- */
function viewPractice(){
  const p = db.practice;

  // 出題中・採点後
  if(p && p.questions && p.questions.length){
    const graded = p.status === "graded" && p.result;
    const gmap = {};
    if(graded) p.result.detail.forEach(d => gmap[d.no] = d);

    let h = '<p class="eyebrow">' + FORMATS[p.formatId].label + ' ・ ' + subjLabel(p.subject)
      + ' ・ ' + topicLabel(p.subject, p.topic) + '</p>';

    if(graded){
      const pct = Math.round(p.result.rate * 100);
      h += '<div class="score"><div class="score-n num">' + pct + '<small>%</small></div>'
        + '<div class="score-s">' + p.questions.length + '問 ・ '
        + p.result.detail.filter(d => d.score >= 80).length + '問が8割以上</div></div>';
      if(p.result.overall){
        h += '<div class="advice" style="margin-bottom:14px"><div class="advice-b">' + esc(p.result.overall) + '</div></div>';
      }
    }

    h += p.questions.map(q => {
      const g = gmap[q.no];
      const ans = p.answers[q.no];
      let s = '<div class="q' + (g ? (g.score >= 80 ? ' ok' : (g.score > 0 ? ' half' : ' ng')) : '') + '">';
      s += '<div class="q-h"><span class="q-no num">問' + q.no + '</span>'
        + '<span class="q-type">' + (q.type === "written" ? "記述" : "選択") + '</span>'
        + (g ? '<span class="q-score num">' + g.score + '点</span>' : '') + '</div>';
      s += '<div class="q-p">' + esc(q.prompt) + '</div>';

      if(q.type === "choice"){
        s += '<div class="opts">' + q.choices.map((c, i) => {
          const picked = Number(ans) === i;
          const cls = graded
            ? (i === q.answer ? " right" : (picked ? " wrong" : ""))
            : (picked ? " picked" : "");
          return '<button class="opt' + cls + '"' + (graded ? ' disabled' : '')
            + ' data-act="pick" data-no="' + q.no + '" data-i="' + i + '">'
            + '<span class="opt-i num">' + (i+1) + '</span>' + esc(c) + '</button>';
        }).join("") + '</div>';
      }else{
        s += graded
          ? '<div class="ansbox"><b>あなたの解答</b>' + esc((ans || "").trim() || "（無解答）") + '</div>'
          : '<textarea class="ansin" data-no="' + q.no + '" rows="4" placeholder="ここに解答を書く">' + esc(ans || "") + '</textarea>';
      }

      if(graded){
        if(g.comment) s += '<div class="q-c">' + esc(g.comment) + '</div>';
        if(q.type === "written" && q.modelAnswer)
          s += '<details class="fold"><summary>模範解答</summary><div class="q-e">' + esc(q.modelAnswer) + '</div></details>';
        if(q.explanation)
          s += '<details class="fold"><summary>解説</summary><div class="q-e">' + esc(q.explanation) + '</div></details>';
      }
      return s + '</div>';
    }).join("");

    if(graded){
      h += '<button class="btn primary" data-act="newset">別のセットをつくる</button>';
      h += '<button class="btn ghost" data-act="closeset">閉じる</button>';
    }else{
      h += '<button class="btn ' + (practiceBusy ? '' : 'primary') + '" data-act="grade"'
        + (practiceBusy ? ' disabled' : '') + '>' + (practiceBusy ? '採点中…' : '採点する') + '</button>';
      h += '<button class="btn ghost" data-act="closeset">中断して破棄</button>';
    }
    return h;
  }

  // 出題設定
  const fid = db.settings.practiceFormat || "zento2";
  const subj = db.settings.practiceSubject || "english";
  const auto = db.settings.practiceAuto !== false;
  const topic = auto ? weakestTopic(subj) : (db.settings.practiceTopic || PRACTICE_TOPICS[subj][0][0]);

  let h = '<p class="eyebrow">出題する</p><div class="card">'
    + '<label for="p-fmt">形式</label><select id="p-fmt" data-act="pset">'
    + Object.keys(FORMATS).map(k => '<option value="' + k + '"' + (fid === k ? " selected" : "") + '>' + FORMATS[k].label + '</option>').join("")
    + '</select>'
    + '<p class="item-sub" style="margin:6px 0 0">' + esc(FORMATS[fid].outline) + '</p>'
    + '<label for="p-subj">科目</label><select id="p-subj" data-act="pset">' + subjOptions(subj, true) + '</select>'
    + '<p class="item-sub" style="margin:6px 0 0">演習は英語と数学のみです。</p>'
    + '<label>分野</label>'
    + '<div class="row" style="gap:6px;margin-bottom:9px">'
    + '<button class="btn btn-sm ' + (auto ? 'primary' : 'ghost') + '" data-act="pauto" data-v="1" style="flex:1;margin:0">弱点から自動</button>'
    + '<button class="btn btn-sm ' + (auto ? 'ghost' : 'primary') + '" data-act="pauto" data-v="0" style="flex:1;margin:0">自分で選ぶ</button></div>';

  if(auto){
    const r = latestResult(subj);
    h += '<div class="pick-auto">' + topicLabel(subj, topic)
      + (r && r.breakdown && r.breakdown[topic] != null
          ? ' <span class="num">' + Math.round(r.breakdown[topic]*100) + '%</span>' : '')
      + '</div>'
      + '<p class="item-sub" style="margin:5px 0 0">'
      + (r ? '直近の模試でいちばん低い分野です。' : '模試結果がまだないので、先頭の分野から始めます。') + '</p>';
  }else{
    h += '<select id="p-topic" data-act="pset">'
      + PRACTICE_TOPICS[subj].map(t => '<option value="' + t[0] + '"' + (topic === t[0] ? " selected" : "") + '>' + t[1] + '</option>').join("")
      + '</select>';
  }

  h += '<p class="item-sub" style="margin:12px 0 0">' + esc(FORMATS[fid][subj][topic] || "") + '</p>'
    + '<button class="btn ' + (practiceBusy ? '' : 'primary') + '" data-act="gen"' + (practiceBusy ? ' disabled' : '') + '>'
    + (practiceBusy ? '作成中…（30秒ほど）' : PRACTICE_COUNT + '問つくる') + '</button>';
  if(!(db.settings.apiKey || "").trim()){
    h += '<p class="item-sub" style="margin:7px 0 0">使うには設定タブで Claude の APIキーを登録してください。</p>';
  }
  h += '</div>';

  // 履歴
  const hist = db.practiceSets.filter(x => x.result);
  h += '<section style="margin-top:26px"><p class="eyebrow">これまでの演習</p>';
  if(!hist.length){
    h += '<div class="empty"><b>まだ記録がありません</b>解いた結果は分野別に集計され、分析タブのレーダーに重なります。</div>';
  }else{
    h += hist.slice(0,12).map(x =>
      '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + subjLabel(x.subject) + ' ・ ' + topicLabel(x.subject, x.topic)
      + ' <span class="num" style="color:' + (x.result.rate >= .8 ? 'var(--green)' : (x.result.rate >= .5 ? 'var(--amber)' : 'var(--red)')) + '">'
      + Math.round(x.result.rate*100) + '%</span></div>'
      + '<div class="item-sub">' + fmtFull(x.date) + ' ・ ' + FORMATS[x.formatId].label + ' ・ ' + x.questions.length + '問</div>'
      + '</div><button class="x" data-act="delset" data-id="' + x.id + '" aria-label="削除">×</button></div></div>').join("");
  }
  h += '</section>';
  return h;
}

/* ---------- 教材（本棚） ---------- */
function viewBooks(){
  let h = '<p class="eyebrow">本棚</p>';
  if(!db.books.length){
    h += '<div class="empty"><b>本棚が空です</b>下から教材を追加してください。よく使う参考書はプリセットを選ぶだけで章まで入ります。</div>';
  }
  h += db.books.map(b => {
    if(isEd("book", b.id)) return edBook(b);
    const units = b.units || [];
    const tot = units.reduce((s,u) => s + (Number(u.totalPages)||0), 0);
    const cur = units.reduce((s,u) => s + Math.min(Number(u.currentPage)||0, Number(u.totalPages)||0), 0);
    const pct = tot ? Math.round(cur / tot * 100) : 0;
    const min = bookMinutes(b.id);
    const rest = units.reduce((a,u) => a + (u.status === 'done' ? 0 : unitRemaining(u)), 0);
    const mpb = minutesPerPage(b.id);
    const un = uShort(b.id);
    return '<details class="shelf"' + (openBook === b.id ? ' open' : '') + '>'
      + '<summary><span class="spine" style="background:' + bookColor(b.id) + '"></span>'
      + '<span class="sh-body">'
      + '<span class="sh-title">' + esc(b.title) + '</span>'
      + '<span class="sh-sub">' + subjLabel(b.subject)
      + (b.logOnly
          ? ' ・ <span class="rd">記録のみ</span> ・ 合計 ' + fmtDur(min)
          : ' ・ ' + units.length + '章'
            + (tot ? ' ・ ' + cur + '/' + tot + un + '（' + pct + '%）' : ' ・ ' + uName(b.id) + '未設定')
            + (rest ? ' ・ 残' + rest + un : '')
            + (min ? ' ・ ' + fmtDur(min) : '')
            + (mpb ? ' ・ 1' + un + ' ' + mpb.toFixed(1) + '分' : '')) + '</span>'
      + (b.logOnly ? '' : '<span class="bar"><i style="width:' + pct + '%"></i></span>')
      + '</span></summary>'
      + '<div class="sh-open">'
      + (b.logOnly ? '<p class="item-sub" style="margin:12px 0 0">この教材は逆算の対象外です。学習時間の記録だけに使われます。</p>' : '')
      + (b.logOnly ? '' : units.map(u => {
          if(isEd("unit", u.id)) return edUnit(b, u);
          const ut = Number(u.totalPages)||0, uc = Math.min(Number(u.currentPage)||0, ut);
          const rr = unitRound(u), mk = MASTERY[u.mastery];
          return '<div class="unit-line"><span class="wt">' + "●".repeat(u.weight) + "○".repeat(5-u.weight) + '</span>'
            + '<span class="nm">' + esc(u.name)
            + (u.status === "done" ? ' <span class="rd done">完了</span>'
               : (rr > 1 ? ' <span class="rd">' + rr + '周目</span>' : ''))
            + (mk ? ' <span class="rd" style="color:' + mk[2] + ';border-color:' + mk[2] + '">' + mk[0] + '</span>' : '')
            + '</span>'
            + '<span class="pg">' + uc + '/' + ut + '</span>'
            + edBtn("unit", u.id, b.id) + '</div>';
        }).join(""))
      + (b.logOnly ? '' : '<div class="card" style="margin:12px 0 0;background:#0E0F11">'
      + '<label>章をまとめて作る</label>'
      + '<div class="row"><div><input class="bk-total" data-book="' + b.id + '" type="number" inputmode="numeric" placeholder="総' + uName(b.id) + '数"></div>'
      + '<div><input class="bk-n" data-book="' + b.id + '" type="number" inputmode="numeric" placeholder="章数" value="' + Math.max(1, units.length || 5) + '"></div>'
      + '<div><input class="bk-w" data-book="' + b.id + '" type="number" inputmode="numeric" min="1" max="5" placeholder="重要度" value="3"></div></div>'
      + '<p class="item-sub" style="margin:6px 0 0">既にある章はそのまま残し、足りない分を均等に割って足します。</p>'
      + '<button class="btn ghost" data-act="bulkunits" data-id="' + b.id + '">均等に分けて作る</button></div>')
      + (b.logOnly ? '' : '<details class="fold"><summary>章名を貼り付けてまとめて作る</summary><div class="card" style="margin:8px 0 0;background:#0E0F11">'
      + '<label>章の名前（1行に1つ）</label>'
      + '<textarea class="bl-names" data-book="' + b.id + '" rows="7" placeholder="Section 1 名詞, 120&#10;Section 2 動詞, 80&#10;Section 3 形容詞, 60"></textarea>'
      + '<p class="item-sub" style="margin:6px 0 0">「名前, 数」の形で書くと、章ごとの' + uName(b.id) + '数もそのまま入ります。数を書かない場合は下の総数を均等に割ります。</p>'
      + '<div class="row"><div><label>総' + uName(b.id) + '数（任意）</label><input class="bl-total" data-book="' + b.id + '" type="number" inputmode="numeric" placeholder="2155"></div>'
      + '<div><label>重要度 1–5</label><input class="bl-w" data-book="' + b.id + '" type="number" inputmode="numeric" min="1" max="5" value="3"></div></div>'
      + '<p class="item-sub" style="margin:6px 0 0">いまある章はすべて置き換わります。総数を入れると均等に割り振ります。</p>'
      + '<button class="btn ghost" data-act="bulknames" data-id="' + b.id + '">この名前で章を作る</button></div></details>')
      + (b.logOnly ? '' : '<details class="fold"><summary>章を1つずつ追加</summary><div class="card" style="margin:8px 0 0;background:#0E0F11">'
      + '<label>章の名前</label><input class="u-name" data-book="' + b.id + '" placeholder="二次関数">'
      + '<div class="row"><div><label>重要度 1–5</label><input class="u-w" data-book="' + b.id + '" type="number" inputmode="numeric" min="1" max="5" value="3"></div>'
      + '<div><label>総' + uName(b.id) + '</label><input class="u-tp" data-book="' + b.id + '" type="number" inputmode="numeric" value="40"></div>'
      + '<div><label>済' + uName(b.id) + '</label><input class="u-cp" data-book="' + b.id + '" type="number" inputmode="numeric" value="0"></div></div>'
      + '<button class="btn ghost" data-act="addunit" data-id="' + b.id + '">この章を追加</button></div></details>')
      + '<div class="row" style="gap:9px">'
      + '<button class="btn ghost" data-act="tstart" data-b="' + b.id + '" style="margin-top:12px">この教材で計測</button>'
      + '<button class="btn ghost" data-act="edit" data-k="book" data-id="' + b.id + '" style="margin-top:12px">書名や科目を直す</button></div>'
      + '<button class="btn danger" data-act="delbook" data-id="' + b.id + '">本棚から削除</button>'
      + '</div></details>';
  }).join("");

  // 追加フォーム
  const asub = db.settings.addSubject || (db.subjects[0] && db.subjects[0].id) || "english";
  const aLog = db.settings.addLogOnly === true;
  h += '<section style="margin-top:22px"><p class="eyebrow">教材を追加</p><div class="card">'
    + '<div class="row" style="gap:6px">'
    + '<button class="btn btn-sm ' + (aLog ? 'ghost' : 'primary') + '" data-act="alog" data-v="0" style="flex:1;margin:0">逆算に入れる</button>'
    + '<button class="btn btn-sm ' + (aLog ? 'primary' : 'ghost') + '" data-act="alog" data-v="1" style="flex:1;margin:0">記録だけ</button></div>'
    + '<p class="item-sub" style="margin:8px 0 0">'
    + (aLog ? '学校の宿題や授業など、計画に載せずに時間だけ記録したいもの。'
            : '参考書や問題集など、模試日から逆算して範囲を割り振るもの。') + '</p>'
    + '<label for="b-subj">科目</label><select id="b-subj" data-act="asub">' + subjOptions(asub, false) + '</select>'
    + '<label for="b-preset">' + (aLog ? 'よくある項目から選ぶ' : 'よく使う参考書から選ぶ') + '</label>'
    + '<select id="b-preset" data-act="apreset">'
    + '<option value="">（自分で入力する）</option>'
    + (aLog ? BOOK_PRESETS._log : presetsFor(asub)).map((x,i) => '<option value="' + i + '">' + esc(x.t) + '</option>').join("")
    + '</select>'
    + '<label for="b-title">書名</label><input id="b-title" placeholder="システム英単語">'
    + '<label for="b-unit">数え方</label><select id="b-unit">'
    + Object.keys(UNITS).map(k => '<option value="' + k + '"' + (guessUnit(db.settings.addTitle || "") === k ? " selected" : "") + '>'
        + UNITS[k].name + '（' + UNITS[k].pre + '123）</option>').join("")
    + '</select>'
    + (aLog ? ''
        : '<div class="row"><div><label for="b-total">総数（任意）</label><input id="b-total" type="number" inputmode="numeric" placeholder="200"></div>'
          + '<div><label for="b-w">重要度 1–5</label><input id="b-w" type="number" inputmode="numeric" min="1" max="5" value="3"></div></div>'
          + '<p class="item-sub" style="margin:6px 0 0">プリセットを選んで総数を入れると、章が自動で作られます。章立ては目安なので、あとから直せます。</p>')
    + '<button class="btn primary" data-act="addbook">本棚に追加する</button></div></section>';

  // 科目
  h += '<section style="margin-top:26px"><p class="eyebrow">科目</p><div class="card">'
    + '<p class="item-sub" style="margin:0">英語と数学は模試分析の対象です。定期テスト用の科目はここで足してください。</p>'
    + '<div class="chips">' + db.subjects.map(s =>
        '<span class="chip' + (isCore(s.id) ? ' core' : '') + '">' + esc(s.label)
        + (isCore(s.id) ? '' : '<button class="x" data-act="delsubj" data-id="' + s.id + '" aria-label="削除">×</button>')
        + '</span>').join("") + '</div>'

    + '<button class="btn ghost" data-act="addsubj">追加する</button></div></section>';
  return h;
}

/* 実測から上限ページを提案するブロック */
function mppBlock(s){
  const rows = db.books.filter(b => !b.logOnly).map(b => {
    const real = minutesPerPage(b.id);
    const im = itemMinutes(b.id);
    return '<span><i style="background:' + bookColor(b.id) + '"></i>'
      + esc(b.title) + ' <b style="color:var(--chalk)">1' + uShort(b.id) + ' ' + im.toFixed(1) + '分</b>'
      + (real ? '' : '<span style="color:var(--chalk-far)">（目安）</span>') + '</span>';
  });
  if(!rows.length) return "";
  return '<div class="mpp">'
    + '<div class="mpp-h">1件あたりの重み</div>'
    + '<div class="legend" style="flex-direction:column;gap:5px;margin-top:8px">' + rows.join("") + '</div>'
    + '<div class="mpp-s">学習時間の記録がたまると、目安が実測に置き換わります。'
    + '実態と違うときは、本棚の「書名や科目を直す」から教材ごとに変えられます。</div>'
    + '</div>';
}

    + '<p class="item-sub" style="margin:5px 0 0">章の多い教材が枠を独占しないための制限です。教材の数が多いなら1〜2にしてください。</p>'
    + mppBlock(s)
    + '<div class="row"><div><label for="s-mt">1日のタスク数の上限</label><input id="s-mt" type="number" inputmode="numeric" min="1" max="6" value="' + s.maxTasksPerDay + '"></div>'
    + '<div><label for="s-mc">1タスクの最小件数</label><input id="s-mc" type="number" inputmode="numeric" min="1" max="20" value="' + s.minChunk + '"></div></div>'
    + '<div class="row"><div><label for="s-rounds">何周する</label><input id="s-rounds" type="number" inputmode="numeric" min="1" max="5" value="' + (s.targetRounds || 3) + '"></div>'
    + '<div><label for="s-rf">次の周の量（％）</label><input id="s-rf" type="number" inputmode="numeric" min="10" max="100" value="' + Math.round((s.roundFactor || 0.6) * 100) + '"></div></div>'
    + '<p class="item-sub" style="margin:5px 0 0">手応えを入れる前の見込みです。◯は25%、△は60%、×は100%として計算し直します。</p>'
    + '<label for="s-bd">模試の何日前に一周終えるか</label><input id="s-bd" type="number" inputmode="numeric" min="0" max="60" value="' + s.bufferDays + '">'
    + '<p class="item-sub" style="margin:5px 0 0">この日数だけ手前を仕上げ日にして逆算します。直前は総復習に空きます。</p>'
    + '<label>完全に休む曜日</label><div class="row" style="gap:5px">'
    + WD.map((d,i) => '<button class="btn btn-sm ' + (s.restDays.includes(i) ? 'primary' : 'ghost') + '" data-act="rest" data-d="' + i + '" aria-pressed="' + s.restDays.includes(i) + '" style="flex:1;padding:0">' + d + '</button>').join("")
    + '</div>'
    + '<button class="btn primary" data-act="savecfg">保存してプランを組み直す</button></div>';

  h += '<section style="margin-top:26px"><p class="eyebrow">ポモドーロ</p><div class="card">'
    + '<p class="item-sub" style="margin:0">オンにすると、計測中に集中と休憩を自動で切り替えます。'
    + '切り替わるタイミングで端末が振動し、通知を許可していれば通知も出ます。記録されるのは集中していた時間だけです。</p>'
    + '<div class="row" style="gap:6px;margin-top:12px">'
    + '<button class="btn btn-sm ' + (s.pomodoro ? 'primary' : 'ghost') + '" data-act="pomo" data-v="1" style="flex:1;margin:0">使う</button>'
    + '<button class="btn btn-sm ' + (s.pomodoro ? 'ghost' : 'primary') + '" data-act="pomo" data-v="0" style="flex:1;margin:0">使わない</button></div>'
    + '<div class="row"><div><label for="s-fm">集中（分）</label><input id="s-fm" type="number" inputmode="numeric" min="5" max="90" value="' + (s.focusMin || 25) + '"></div>'
    + '<div><label for="s-bm">休憩（分）</label><input id="s-bm" type="number" inputmode="numeric" min="1" max="30" value="' + (s.breakMin || 5) + '"></div></div>'
    + '<button class="btn ghost" data-act="savepomo">保存する</button></div></section>';

  h += '<section style="margin-top:26px"><p class="eyebrow">AIアドバイス</p><div class="card">'
    + '<p class="item-sub" style="margin:0">Claude の APIキーを登録すると、分析タブでアドバイスを生成できます。'
    + 'キーはこの端末のLocalStorageにだけ保存され、送信先は api.anthropic.com だけです。書き出したJSONにはキーは含めません。</p>'
    + '<label for="s-key">APIキー</label>'
    + '<input id="s-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="' + esc(s.apiKey || "") + '">'
    + '<label for="s-model">モデル</label><select id="s-model">'
    + MODELS.map(m => '<option value="' + m[0] + '"' + (s.model === m[0] ? " selected" : "") + '>' + m[1] + '</option>').join("")
    + '</select>'
    + '<button class="btn primary" data-act="savekey">保存する</button>'
    + '<button class="btn ghost" data-act="testkey">接続を試す</button>'
    + '<p class="item-sub" style="margin:8px 0 0">残高と使用量は platform.claude.com のコンソールで確認できます。</p>'
    + '</div></section>';

  const ls = s.lastSync ? new Date(s.lastSync) : null;
  h += '<section style="margin-top:26px"><p class="eyebrow">クラウド保存（GitHub）</p><div class="card">'
    + '<p class="item-sub" style="margin:0">GitHubの非公開Gistにデータを預けます。'
    + '別の端末で同じトークンを入れれば、そこから読み込めます。'
    + 'ClaudeのAPIキーとこのトークン自体は、クラウドには送りません。</p>'
    + '<label for="s-gh">GitHubトークン</label>'
    + '<input id="s-gh" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…" value="' + esc(s.ghToken || "") + '">'
    + '<p class="item-sub" style="margin:6px 0 0">GitHub → Settings → Developer settings → Personal access tokens → '
    + '<b>Tokens (classic)</b> で作り、権限は <b>gist</b> だけにチェックを入れてください。</p>'
    + '<div class="row" style="gap:6px;margin-top:12px">'
    + '<button class="btn btn-sm ' + (s.ghAuto ? 'primary' : 'ghost') + '" data-act="ghauto" data-v="1" style="flex:1;margin:0">自動で保存</button>'
    + '<button class="btn btn-sm ' + (s.ghAuto ? 'ghost' : 'primary') + '" data-act="ghauto" data-v="0" style="flex:1;margin:0">手動だけ</button></div>'
    + '<button class="btn primary" data-act="ghsave"' + (syncing ? ' disabled' : '') + '>'
    + (syncing ? '通信中…' : 'トークンを保存して同期する') + '</button>'
    + '<button class="btn ghost" data-act="ghpull"' + (syncing ? ' disabled' : '') + '>クラウドから読み込む</button>'
    + '<p class="item-sub" style="margin:10px 0 0">'
    + (ls ? '最終同期 ' + ls.toLocaleString("ja-JP") : 'まだ同期していません')
    + (s.gistId ? '<br>保存先ID ' + esc(s.gistId) : '') + '</p>'
    + '</div></section>';

  h += '<section style="margin-top:26px"><p class="eyebrow">データ</p><div class="card">'
    + '<p class="item-sub" style="margin:0">端末のLocalStorageにだけ保存されます。機種変更やブラウザのデータ削除に備えて、ときどき書き出してください。</p>'
    + '<button class="btn ghost" data-act="export">JSONに書き出す</button>'
    + '<button class="btn ghost" data-act="import">JSONから読み込む</button>'
    + '<button class="btn danger" data-act="reset">すべて消去する</button></div></section>';

  h += '<section style="margin-top:26px"><p class="eyebrow">使い方</p><div class="card">'
    + '<p class="item-sub" style="margin:0">逆算のしくみ、周回の考え方、着地予測の読み方、困ったときの対処をまとめてあります。オフラインでも読めます。</p>'
    + '<a class="btn primary" href="./help.html" style="text-decoration:none">説明書をひらく</a></div></section>';

  h += '<section style="margin-top:26px"><p class="eyebrow">このアプリについて</p><div class="card">'
    + '<p class="item-sub" style="margin:0">英数逆算プランナー Phase 1（計画とタスク）。'
    + '模試分析・AIアドバイス・演習・通知は Phase 2 以降で追加します。</p></div></section>';
  return h;
}

/* =========================================================
   操作
   ========================================================= */
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if(!b) return;
  tab = b.dataset.tab;
  openBook = null;
  editing = null;
  render();
});

app.addEventListener("click", e => {
  const jump = e.target.closest("[data-tab-jump]");
  if(jump){ tab = jump.dataset.tabJump; openBook = null; render(); return; }
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const val = sel => { const el = document.querySelector(sel); return el ? el.value.trim() : ""; };
  const numv = (sel, d) => { const v = Number(val(sel)); return Number.isFinite(v) ? v : d; };

  if(act === "logmode"){
    db.settings.logMode = b.dataset.v;
    save(); render(); return;
  }
  if(act === "quicklog"){
    const sel = document.getElementById("q-mat");
    if(!sel || !sel.value){ alert("教材を選んでください。"); return; }
    let min = Number(b.dataset.m) || 0;
    if(!min) min = Math.max(0, numv("#q-h", 0)) * 60 + Math.max(0, numv("#q-m", 0));
    if(min < 1){ alert("時間を入れてください。"); return; }
    let o; try{ o = JSON.parse(sel.value); }catch(e){ return; }
    db.settings.lastMat = sel.value;
    db.sessions.unshift({ id: uid(), date: today(), bookId: o.b, unitId: o.u || null, minutes: min, note: "" });
    db.sessions.sort((a,c) => c.date.localeCompare(a.date));
    save(); render(); return;
  }
  if(act === "tstart"){
    let bid = b.dataset.b, uid_ = b.dataset.u;
    if(!bid){
      const sel = document.getElementById("t-mat");
      if(!sel || !sel.value){ alert("教材を選んでください。"); return; }
      try{ const o = JSON.parse(sel.value); bid = o.b; uid_ = o.u; }catch(e){ return; }
    }
    startTimer(bid, uid_ || null);
    return;
  }
  if(act === "tstop"){ stopTimer(); return; }
  if(act === "addsession"){
    const sel = document.getElementById("s-mat");
    if(!sel || !sel.value){ alert("教材を選んでください。"); return; }
    const min = Math.max(0, numv("#s-h", 0)) * 60 + Math.max(0, numv("#s-m", 0));
    if(min < 1){ alert("1分以上を入れてください。"); return; }
    let o; try{ o = JSON.parse(sel.value); }catch(e){ return; }
    db.sessions.unshift({ id: uid(), date: val("#s-date") || today(), bookId: o.b, unitId: o.u || null, minutes: min, note: "" });
    db.sessions.sort((a,c) => c.date.localeCompare(a.date));
    save(); render(); return;
  }
  if(act === "delsession"){
    db.sessions = db.sessions.filter(s => s.id !== id);
    save(); render(); return;
  }

  if(act === "gen"){
    const fid = db.settings.practiceFormat || "zento2";
    const subj = db.settings.practiceSubject || "english";
    const auto = db.settings.practiceAuto !== false;
    const topic = auto ? weakestTopic(subj) : (db.settings.practiceTopic || PRACTICE_TOPICS[subj][0][0]);
    generatePractice(fid, subj, topic);
    return;
  }
  if(act === "pauto"){
    db.settings.practiceAuto = b.dataset.v === "1";
    save(); render(); return;
  }
  if(act === "pick"){
    if(!db.practice) return;
    db.practice.answers[b.dataset.no] = Number(b.dataset.i);
    save(); render(); return;
  }
  if(act === "grade"){ collectWritten(); gradePractice(); return; }
  if(act === "newset" || act === "closeset"){
    if(act === "closeset" && db.practice && db.practice.status !== "graded"
       && !confirm("この問題セットを破棄します。よろしいですか。")) return;
    db.practice = null; save(); render(); return;
  }
  if(act === "delset"){
    db.practiceSets = db.practiceSets.filter(x => x.id !== id);
    save(); render(); return;
  }

  if(act === "advise"){ generateAdvice(); return; }
  if(act === "deladvice"){
    db.weeklyAdvice = db.weeklyAdvice.filter(a => a.id !== id);
    save(); render(); return;
  }
  if(act === "savekey"){
    db.settings.apiKey = val("#s-key");
    db.settings.model = val("#s-model") || "claude-sonnet-5";
    save(); render();
    alert("保存しました。");
    return;
  }
  if(act === "testkey"){
    db.settings.apiKey = val("#s-key");
    db.settings.model = val("#s-model") || "claude-sonnet-5";
    save();
    b.disabled = true; b.textContent = "確認中…";
    callClaude("ひとことで答えてください。", "接続確認です。「OK」とだけ返してください。")
      .then(t => alert("つながりました。\n応答: " + t.slice(0, 40)))
      .catch(e => alert("つながりませんでした。\n\n" + e.message))
      .finally(() => render());
    return;
  }

  if(act === "metric"){
    trendMetric = b.dataset.m;
    render(); return;
  }
  if(act === "ocr"){
    keepMeta();
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = () => { const f = inp.files && inp.files[0]; if(f) ocrResult(f); };
    inp.click();
    return;
  }
  if(act === "secadd"){
    keepMeta();
    const cls = b.dataset.cls;
    if(cls === "r-sec"){ newSecs = readSecs("r-sec"); newSecs.push({ name: "", score: null, max: null, nat: null }); }
    else if(editing){ editing.secs = readSecs("e-sec"); editing.secs.push({ name: "", score: null, max: null, nat: null }); }
    render(); return;
  }
  if(act === "secdel"){
    keepMeta();
    const cls = b.dataset.cls, i = Number(b.dataset.i);
    if(cls === "r-sec"){ const cur = readSecs("r-sec"); cur.splice(i, 1); newSecs = cur.length ? cur : [{ name: "", score: null, max: null, nat: null }]; }
    else if(editing){ const cur = readSecs("e-sec"); cur.splice(i, 1); editing.secs = cur; }
    render(); return;
  }
  if(act === "seccopy"){
    keepMeta();
    const prev = db.examResults.filter(x => x.subject === resultSubject)
                               .sort((a,c) => c.date.localeCompare(a.date))[0];
    if(!prev) return;
    const keep = readSecs("r-sec");
    newSecs = sectionsOf(prev).map((x, i) => ({
      name: x.name, max: x.max,
      score: keep[i] ? keep[i].score : null, nat: null
    }));
    render(); return;
  }
  if(act === "addresult"){
    const date = val("#r-date");
    const score = val("#r-score");
    if(!date || score === ""){ alert("受験日と得点を入れてください。"); return; }
    const secs = readSecs("r-sec").filter(x => x.max > 0);
    const dev = val("#r-dev");
    db.examResults.push({
      id: uid(), name: val("#r-name") || "模試", date,
      subject: val("#r-subj"), score: Number(score),
      deviation: dev === "" ? null : Number(dev), sections: secs
    });
    newSecs = [{ name: "", score: null, max: null, nat: null }];
    newMeta = { name: "", date: "", score: "", dev: "" };
    save(); render(); return;
  }
  if(act === "delresult"){
    db.examResults = db.examResults.filter(r => r.id !== id);
    save(); render(); return;
  }

  if(act === "edit"){
    editing = { k: b.dataset.k, id: b.dataset.id, b: b.dataset.b || null };
    if(editing.k === "result"){
      const r0 = db.examResults.find(x => x.id === editing.id);
      editing.secs = r0 ? JSON.parse(JSON.stringify(sectionsOf(r0))) : [];
      if(!editing.secs.length) editing.secs = [{ name: "", score: null, max: null, nat: null }];
    }
    if(editing.k === "unit" || editing.k === "book") openBook = editing.b || editing.id;
    render(); return;
  }
  if(act === "canceledit"){ editing = null; render(); return; }
  if(act === "saveedit"){ saveEdit(); return; }

  if(act === "mastery"){ setMastery(b.dataset.b, b.dataset.u, b.dataset.m); return; }
  if(act === "toggle"){ toggleTask(id); return; }

  if(act === "regen"){
    const n = generatePlan();
    render();
    alert(n ? n + "件のタスクを組み直しました。" : "割り当てる教材がありません。教材タブで単元を登録してください。");
    return;
  }

  if(act === "addgoal"){
    const date = val("#g-date");
    if(!date){ alert("実施日を入れてください。"); return; }
    db.goals.push({
      id: uid(), kind: "exam", name: val("#g-name") || "模試", examDate: date,
      subject: val("#g-subj"), targetScore: numv("#g-tgt", 0), currentScore: numv("#g-cur", 0),
      targetDev: val("#g-tdev") === "" ? null : numv("#g-tdev", 0)
    });
    save(); render(); return;
  }
  if(act === "addtest"){
    const date = val("#tt-date");
    const subj = val("#tt-subj");
    if(!date){ alert("実施日を入れてください。"); return; }
    if(!subj){ alert("科目を選んでください。"); return; }
    db.goals.push({
      id: uid(), kind: "test", name: val("#tt-name") || "定期テスト", examDate: date,
      subject: subj, targetScore: numv("#tt-tgt", 80), maxScore: Math.max(1, numv("#tt-max", 100)),
      currentScore: 0, resultScore: null
    });
    save(); render(); return;
  }
  if(act === "setresult"){
    const el = document.querySelector('.res-in[data-id="' + id + '"]');
    const v = el ? Number(el.value) : NaN;
    if(!Number.isFinite(v)){ alert("点数を入れてください。"); return; }
    const g = db.goals.find(x => x.id === id);
    if(g){ g.resultScore = v; save(); render(); }
    return;
  }
  if(act === "addsubj"){
    const label = val("#sj-name");
    if(!label){ alert("科目名を入れてください。"); return; }
    if(db.subjects.some(s => s.label === label)){ alert("同じ名前の科目があります。"); return; }
    db.subjects.push({ id: "s_" + uid(), label });
    save(); render(); return;
  }
  if(act === "delsubj"){
    const used = db.books.some(b => b.subject === id) || db.goals.some(g => g.subject === id);
    if(used && !confirm("この科目の参考書や試験も一緒に削除されます。よろしいですか。")) return;
    db.subjects = db.subjects.filter(s => s.id !== id);
    const bids = db.books.filter(b => b.subject === id).map(b => b.id);
    db.books = db.books.filter(b => b.subject !== id);
    db.goals = db.goals.filter(g => g.subject !== id);
    db.tasks = db.tasks.filter(t => !bids.includes(t.bookId));
    db.sessions = db.sessions.filter(s => !bids.includes(s.bookId));
    save(); render(); return;
  }
  if(act === "delgoal"){
    db.goals = db.goals.filter(g => g.id !== id);
    save(); render(); return;
  }

  if(act === "alog"){
    db.settings.addLogOnly = b.dataset.v === "1";
    save(); render(); return;
  }
  if(act === "addbook"){
    const subj = val("#b-subj");
    const logOnly = db.settings.addLogOnly === true;
    const pi = val("#b-preset");
    const list = logOnly ? BOOK_PRESETS._log : presetsFor(subj);
    const preset = pi === "" ? null : list[Number(pi)];
    const title = val("#b-title") || (preset ? preset.t : "");
    if(!title){ alert("書名を入れるか、参考書を選んでください。"); return; }
    const total = Math.max(0, numv("#b-total", 0));
    const w = Math.min(5, Math.max(1, numv("#b-w", 3)));
    const book = { id: uid(), title, subject: subj, unitType: val("#b-unit") || "page", units: [] };
    if(logOnly){
      book.logOnly = true;
      db.books.push(book); openBook = book.id; save(); render(); return;
    }
    if(preset && total > 0){
      const parts = splitPages(total, preset.u.length);
      book.units = preset.u.map((name, i) => ({
        id: uid(), name, weight: w, status: "todo", totalPages: parts[i], currentPage: 0
      }));
    }else if(preset){
      book.units = preset.u.map(name => ({
        id: uid(), name, weight: w, status: "todo", totalPages: 0, currentPage: 0
      }));
    }else if(total > 0){
      book.units = [{ id: uid(), name: title, weight: w, status: "todo", totalPages: total, currentPage: 0 }];
    }
    db.books.push(book);
    openBook = book.id;
    save(); render(); return;
  }
  if(act === "asub"){ return; }
  if(act === "bulknames"){
    const g = c => document.querySelector("." + c + '[data-book="' + id + '"]');
    // 「名前, 数」の形なら数も一緒に取り込む
    const lines = (g("bl-names").value || "").split("\n").map(x => x.trim()).filter(Boolean);
    if(!lines.length){ alert("章の名前を入れてください。"); return; }
    if(lines.length > 60){ alert("章が多すぎます。60個までにしてください。"); return; }
    const parsed = lines.map(line => {
      const m = line.match(/^(.*?)[,\t，]\s*(\d+)\s*$/);
      return m ? { name: m[1].trim(), n: Number(m[2]) } : { name: line, n: null };
    });
    const names = parsed.map(x => x.name);
    const hasCounts = parsed.some(x => x.n != null);
    const total = Math.max(0, Number(g("bl-total").value) || 0);
    const w = Math.min(5, Math.max(1, Number(g("bl-w").value) || 3));
    const book = db.books.find(x => x.id === id);
    if(!book) return;
    const had = (book.units || []).some(u => (Number(u.currentPage) || 0) > 0);
    if(!confirm("いまある" + (book.units || []).length + "章を、この" + names.length + "章に置き換えます。"
      + (had ? "\n\n進捗のある章も消えます。" : "") + "\nよろしいですか。")) return;
    const even = total > 0 ? splitPages(total, names.length) : names.map(() => 0);
    book.units = parsed.map((x, i) => ({
      id: uid(), name: x.name, weight: w, status: "todo",
      totalPages: hasCounts ? (x.n || 0) : even[i], currentPage: 0
    }));
    db.tasks = db.tasks.filter(t => t.bookId !== id);
    openBook = id;
    save(); generatePlan(); render();
    return;
  }
  if(act === "bulkunits"){
    const g = c => document.querySelector("." + c + '[data-book="' + id + '"]');
    const total = Math.max(0, Number(g("bk-total").value) || 0);
    const n = Math.max(1, Math.min(30, Number(g("bk-n").value) || 5));
    const w = Math.min(5, Math.max(1, Number(g("bk-w").value) || 3));
    if(total < 1){ alert("総ページを入れてください。"); return; }
    const book = db.books.find(x => x.id === id);
    if(!book) return;
    book.units = book.units || [];
    const parts = splitPages(total, n);
    for(let i = 0; i < n; i++){
      if(book.units[i]){
        book.units[i].totalPages = parts[i];
        book.units[i].weight = w;
      }else{
        book.units.push({ id: uid(), name: "第" + (i+1) + "章", weight: w, status: "todo",
                          totalPages: parts[i], currentPage: 0 });
      }
    }
    openBook = id;
    save(); render(); return;
  }
  if(act === "delbook"){
    if(!confirm("この参考書と単元をすべて削除します。よろしいですか。")) return;
    db.books = db.books.filter(x => x.id !== id);
    db.tasks = db.tasks.filter(t => t.bookId !== id);
    save(); render(); return;
  }

  if(act === "addunit"){
    const g = c => document.querySelector("." + c + '[data-book="' + id + '"]');
    const name = g("u-name").value.trim();
    if(!name){ alert("単元名を入れてください。"); return; }
    const total = Math.max(1, Number(g("u-tp").value) || 1);
    const cur = Math.min(total, Math.max(0, Number(g("u-cp").value) || 0));
    const w = Math.min(5, Math.max(1, Number(g("u-w").value) || 3));
    const book = db.books.find(x => x.id === id);
    book.units = book.units || [];
    book.units.push({ id: uid(), name, weight: w, status: cur > 0 ? "in_progress" : "todo", totalPages: total, currentPage: cur });
    openBook = id;
    save(); render();
    const f = document.querySelector('.u-name[data-book="' + id + '"]');
    if(f) f.focus();
    return;
  }
  if(act === "delunit"){
    const book = db.books.find(x => x.id === id);
    if(book) book.units = (book.units||[]).filter(u => u.id !== b.dataset.uid);
    db.tasks = db.tasks.filter(t => t.unitId !== b.dataset.uid);
    save(); render(); return;
  }

  if(act === "rest"){
    const d = Number(b.dataset.d);
    const r = db.settings.restDays;
    const i = r.indexOf(d);
    if(i >= 0) r.splice(i,1); else r.push(d);
    save(); render(); return;
  }
  if(act === "ghauto"){
    db.settings.ghAuto = b.dataset.v === "1";
    save(); render(); return;
  }
  if(act === "ghsave"){
    db.settings.ghToken = val("#s-gh");
    localStorage.setItem(KEY, JSON.stringify(db));
    pushCloud(false);
    return;
  }
  if(act === "ghpull"){
    db.settings.ghToken = val("#s-gh");
    localStorage.setItem(KEY, JSON.stringify(db));
    pullCloud();
    return;
  }
  if(act === "pomo"){
    db.settings.pomodoro = b.dataset.v === "1";
    if(db.settings.pomodoro && window.Notification && Notification.permission === "default"){
      try{ Notification.requestPermission(); }catch(e){}
    }
    save(); render(); return;
  }
  if(act === "savepomo"){
    db.settings.focusMin = Math.min(90, Math.max(5, numv("#s-fm", 25)));
    db.settings.breakMin = Math.min(30, Math.max(1, numv("#s-bm", 5)));
    save(); render(); alert("保存しました。"); return;
  }
  if(act === "usecap"){
    const w = document.getElementById("s-wd"), hh = document.getElementById("s-hd");
    if(w) w.value = b.dataset.w;
    if(hh) hh.value = b.dataset.h;
    alert("上限を書き換えました。下の「保存してプランを組み直す」を押してください。");
    return;
  }
  if(act === "savecfg"){
    db.settings.maxPerBook = Math.min(5, Math.max(1, numv("#s-mpb", 2)));
    db.settings.maxTasksPerDay = Math.min(6, Math.max(1, numv("#s-mt", 3)));
    db.settings.minChunk = Math.min(20, Math.max(1, numv("#s-mc", 3)));
    db.settings.bufferDays = Math.min(60, Math.max(0, numv("#s-bd", 7)));
    db.settings.targetRounds = Math.min(5, Math.max(1, numv("#s-rounds", 3)));
    db.settings.roundFactor = Math.min(1, Math.max(0.1, numv("#s-rf", 60) / 100));
    db.settings.weekdayMinutes = Math.max(0, numv("#s-wm", 120));
    db.settings.holidayMinutes = Math.max(0, numv("#s-hm", 240));
    save();
    const n = generatePlan();
    tab = "today"; render();
    alert("保存しました。" + (n ? n + "件のタスクを組み直しました。" : ""));
    return;
  }

  if(act === "export"){
    const copy = JSON.parse(JSON.stringify(db));
    copy.settings.apiKey = "";   // 鍵はファイルに残さない
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gyakusan-" + today() + ".json";
    a.click();
    db.settings.lastExport = today(); save();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    return;
  }
  if(act === "import"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const d = JSON.parse(r.result);
          if(!d || typeof d !== "object") throw new Error("形式が違います");
          const keepKey = db.settings.apiKey;
          db = Object.assign(structuredClone(DEFAULTS), d, {
            settings: Object.assign(structuredClone(DEFAULTS.settings), d.settings || {})
          });
          if(!db.settings.apiKey) db.settings.apiKey = keepKey;
          save(); render();
          alert("読み込みました。");
        }catch(err){
          alert("読み込めませんでした。このアプリで書き出したJSONを選んでください。");
        }
      };
      r.readAsText(f);
    };
    inp.click();
    return;
  }
  if(act === "reset"){
    if(!confirm("目標・教材・タスクをすべて消去します。元に戻せません。")) return;
    db = structuredClone(DEFAULTS);
    save(); tab = "today"; render();
    return;
  }
});

/* 編集内容を書き戻す */
function saveEdit(){
  if(!editing) return;
  const v = sel => { const e = document.querySelector(sel); return e ? e.value.trim() : ""; };
  const n = (sel, d) => { const x = Number(v(sel)); return Number.isFinite(x) ? x : d; };
  const k = editing.k, id = editing.id;
  let replan = false;

  if(k === "result"){
    const r = db.examResults.find(x => x.id === id);
    if(r){
      r.name = v("#e-name") || "模試";
      r.date = v("#e-date") || r.date;
      r.subject = v("#e-subj") || r.subject;
      r.score = n("#e-score", r.score);
      const dv = v("#e-dev");
      r.deviation = dv === "" ? null : Number(dv);
      r.sections = readSecs("e-sec").filter(x => x.max > 0);
      delete r.breakdown;
    }
  }

  if(k === "goal"){
    const g = db.goals.find(x => x.id === id);
    if(g){
      g.name = v("#e-name") || g.name;
      g.examDate = v("#e-date") || g.examDate;
      g.subject = v("#e-subj") || g.subject;
      g.targetScore = n("#e-tgt", g.targetScore);
      if(goalKind(g) === "test"){
        g.maxScore = Math.max(1, n("#e-max", g.maxScore || 100));
        const rs = v("#e-res");
        g.resultScore = rs === "" ? null : Number(rs);
      }else{
        g.currentScore = n("#e-cur", g.currentScore);
        const td = v("#e-tdev");
        g.targetDev = td === "" ? null : Number(td);
      }
      replan = true;
    }
  }

  if(k === "book"){
    const bk = db.books.find(x => x.id === id);
    if(bk){
      bk.title = v("#e-title") || bk.title;
      bk.subject = v("#e-subj") || bk.subject;
      const oldType = unitTypeOf(bk.id);
      bk.unitType = v("#e-unit") || "page";
      bk.logOnly = v("#e-log") === "1";
      bk.order = v("#e-order") === "weight" ? "weight" : "seq";
      const mp = Number(v("#e-min"));
      if(bk.unitType !== oldType && Math.abs(mp - (DEFAULT_MIN_PER[oldType] || 4)) < 0.05){
        delete bk.minPerItem;          // 単位を変えたので目安も新しい初期値に戻す
      }else if(Number.isFinite(mp) && mp > 0){
        bk.minPerItem = mp;
      }
      db.tasks.forEach(t => { if(t.bookId === bk.id){ t.bookTitle = bk.title; t.subject = bk.subject; } });
      replan = true;
    }
  }

  if(k === "unit"){
    const u = findUnit(editing.b, id);
    if(u){
      u.name = v("#e-uname") || u.name;
      u.weight = Math.min(5, Math.max(1, n("#e-w", u.weight)));
      u.totalPages = Math.max(0, n("#e-tp", u.totalPages));
      u.currentPage = Math.min(u.totalPages, Math.max(0, n("#e-cp", u.currentPage)));
      u.round = Math.max(1, n("#e-round", unitRound(u)));
      const m = v("#e-mast");
      u.mastery = m || null;
      u.status = v("#e-done") === "1" ? "done" : (u.currentPage > 0 ? "in_progress" : "todo");
      db.tasks.forEach(t => { if(t.unitId === u.id) t.unitName = u.name; });
      replan = true;
    }
  }

  if(k === "session"){
    const ss = db.sessions.find(x => x.id === id);
    if(ss){
      ss.date = v("#e-date") || ss.date;
      const min = Math.max(0, n("#e-h", 0)) * 60 + Math.max(0, n("#e-m", 0));
      if(min >= 1) ss.minutes = min;
      try{ const o = JSON.parse(v("#e-mat")); ss.bookId = o.b; ss.unitId = o.u || null; }catch(e){}
      db.sessions.sort((a,c) => c.date.localeCompare(a.date));
    }
  }

  editing = null;
  save();
  if(replan) generatePlan();
  render();
}

/* 記述欄の内容を都度ひろう（再描画で消えないように） */
function collectWritten(){
  if(!db.practice) return;
  document.querySelectorAll(".ansin").forEach(el => {
    db.practice.answers[el.dataset.no] = el.value;
  });
  save();
}
app.addEventListener("input", e => {
  if(e.target.classList && e.target.classList.contains("ansin")){
    if(db.practice) db.practice.answers[e.target.dataset.no] = e.target.value;
  }
});
window.addEventListener("pagehide", () => {
  collectWritten();
  if(db.settings.ghAuto && (db.settings.ghToken || "").trim()) pushCloud(true);
});

app.addEventListener("change", e => {
  const es = e.target.closest('[data-act="edsubj"]');
  if(es && editing && editing.k === "result"){
    const r = db.examResults.find(x => x.id === editing.id);
    if(r && r.subject !== es.value){ r.subject = es.value; save(); render(); }
    return;
  }
  const asub = e.target.closest('[data-act="asub"]');
  if(asub){
    db.settings.addSubject = asub.value;
    save(); render();
    const d = document.getElementById("b-subj");
    if(d) d.focus();
    return;
  }
  const apre = e.target.closest('[data-act="apreset"]');
  if(apre){
    const t = document.getElementById("b-title");
    const subj = (document.getElementById("b-subj") || {}).value;
    const lst = db.settings.addLogOnly === true ? BOOK_PRESETS._log : presetsFor(subj);
    const title = apre.value === "" ? "" : (lst[Number(apre.value)] || {}).t || "";
    if(t) t.value = title;
    db.settings.addTitle = title;
    const us = document.getElementById("b-unit");
    if(us && title) us.value = guessUnit(title);
    return;
  }
  const qm = e.target.closest('[data-act="qmat"]');
  if(qm){ db.settings.lastMat = qm.value; save(); return; }
  const ps = e.target.closest('[data-act="pset"]');
  if(ps){
    const id = ps.id;
    if(id === "p-fmt") db.settings.practiceFormat = ps.value;
    if(id === "p-subj"){ db.settings.practiceSubject = ps.value; db.settings.practiceTopic = null; }
    if(id === "p-topic") db.settings.practiceTopic = ps.value;
    save(); render(); return;
  }
  const el = e.target.closest('[data-act="rsubj"]');
  if(!el) return;
  keepMeta();
  resultSubject = el.value;
  render();
  const d = document.querySelector("details.fold");
  if(d) d.open = true;
});

window.addEventListener("resize", () => {
  if(tab === "plan"){ const cv = document.getElementById("meter"); if(cv) drawMeter(cv); }
  if(tab === "analysis"){
    const st = document.getElementById("stack"); if(st) drawStack(st);
    const dn = document.getElementById("donut"); if(dn) drawDonut(dn, addDays(today(), -29));
    const tr = document.getElementById("trend"); if(tr) drawTrend(tr, trendMetric);
    CORE.forEach(s => {
      const cv = document.getElementById("radar-" + s); if(cv) drawRadar(cv, s);
    });
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW登録に失敗", err));
  });
}
</script>
