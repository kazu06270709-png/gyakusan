<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>英数逆算プランナー</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
/* ===========================================================
   黒板とチョーク — 教室の道具立てで組んだ配色
   =========================================================== */
:root{
  --board:      #000000;   /* 画面の地 */
  --board-deep: #000000;   /* 入力欄・ナビ */
  --panel:      #16171A;   /* カード面 */
  --rule:       #2A2C31;   /* 罫線 */
  --rule-soft:  transparent;
  --chalk:      #FFFFFF;   /* 主要テキスト */
  --chalk-dim:  #9DA1A8;   /* 副次テキスト */
  --chalk-far:  #6B7078;   /* さらに薄い */
  --yellow:     #2E8BF0;   /* プライマリ（青） */
  --red:        #E8384F;
  --green:      #22C1A6;
  --amber:      #F0B429;
  --tap: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--board);
  color:var(--chalk);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
#app{
  min-height:100vh;
  background:var(--board);
  padding:calc(env(safe-area-inset-top) + 16px) 16px 28px;
  max-width:560px;margin:0 auto;
}
h1,h2,h3{margin:0;font-weight:700}

/* セクション見出し */
.eyebrow{
  font-size:17px;letter-spacing:.01em;
  color:var(--chalk);font-weight:700;margin:0 0 12px;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- カウントダウン帯（画面の主題） ---------- */
.countdown{padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.cd-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd-big{font-size:56px;font-weight:800;line-height:.95;color:var(--chalk)}
.cd-unit{font-size:15px;color:var(--chalk-dim);font-weight:600}
.cd-label{font-size:13px;color:var(--chalk-dim);margin-top:8px}
.cd-none{color:var(--chalk-dim);font-size:14px}
.gaps{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.gap{
  flex:1 1 130px;border:none;border-radius:12px;
  padding:12px 14px;background:var(--panel);
}
.gap b{display:block;font-size:12px;color:var(--chalk-dim);font-weight:600}
.gap .v{font-size:23px;font-weight:800;margin-top:3px}
.gap .v small{font-size:12px;color:var(--chalk-dim);font-weight:600;margin-left:3px}

/* ---------- カード・タスク ---------- */
section{margin-bottom:30px}
.card{border:none;border-radius:12px;background:var(--panel);padding:16px;margin-bottom:10px}

.task{
  display:flex;gap:13px;align-items:flex-start;
  border:none;border-left:4px solid var(--rule);
  border-radius:10px;background:var(--panel);
  padding:14px 15px;margin-bottom:10px;
  transition:opacity .16s;
}
.task[data-w="5"],.task[data-w="4"]{border-left-color:var(--red)}
.task[data-w="3"]{border-left-color:var(--amber)}
.task[data-w="2"],.task[data-w="1"]{border-left-color:var(--chalk-far)}
.task.done{opacity:.4;border-left-color:var(--green)}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:1px}
.check{
  flex:0 0 26px;height:26px;margin-top:1px;border:2px solid var(--chalk-far);
  border-radius:50%;background:none;cursor:pointer;position:relative;padding:0;
}
.check[aria-pressed="true"]{border-color:var(--green);background:var(--green)}
.check[aria-pressed="true"]::after{
  content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;
  border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.t-body{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:700;line-height:1.4}
.t-meta{font-size:12.5px;color:var(--chalk-dim);margin-top:4px}
.t-range{color:var(--chalk);font-weight:700}
.t-sub{font-size:11px;color:var(--chalk-far);font-weight:600}

/* ---------- ストリーク（正の字） ---------- */
.streak{border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:18px;align-items:center}
.streak-n{font-size:38px;font-weight:800;line-height:1;color:var(--chalk)}
.streak-n small{font-size:13px;color:var(--chalk-dim);font-weight:600;margin-left:4px}
#tally{display:block;max-width:100%;height:auto}

/* ---------- 逆算メーター ---------- */
#meter{display:block;width:100%;height:auto;border:none;border-radius:12px;background:var(--panel)}

/* ---------- フォーム ---------- */
label{display:block;font-size:12px;color:var(--chalk-dim);font-weight:600;margin:14px 0 6px}
input,select,textarea{
  width:100%;background:#0E0F11;color:var(--chalk);
  border:1px solid var(--rule);border-radius:8px;padding:11px 12px;
  font-size:16px;font-family:inherit;min-height:var(--tap);
}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
button{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;padding:0 18px;border-radius:24px;
  border:1px solid var(--rule);background:none;color:var(--chalk);
  font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:16px;
}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--chalk-dim);font-weight:600}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:active{opacity:.75}
.btn-sm{width:auto;min-height:36px;padding:0 14px;font-size:13px;margin-top:0;border-radius:18px}

/* ---------- 一覧項目 ---------- */
.item{border:none;border-radius:12px;background:var(--panel);padding:14px 15px;margin-bottom:10px}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-title{font-weight:700;font-size:15.5px}
.item-sub{font-size:12.5px;color:var(--chalk-dim);margin-top:3px}
.unit-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.unit-line .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt{font-size:11px;color:var(--amber);letter-spacing:.06em;flex:0 0 auto}
.pg{font-size:12px;color:var(--chalk-dim);flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#0E0F11;border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.x{background:none;border:none;color:var(--chalk-far);font-size:20px;line-height:1;padding:6px 4px;cursor:pointer;flex:0 0 auto}
.fold{margin-top:12px;border-top:1px solid var(--rule)}
.fold>summary{
  list-style:none;cursor:pointer;padding:12px 2px 4px;
  font-size:13px;font-weight:700;color:var(--yellow);
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"＋ "}
.fold[open]>summary::before{content:"− "}

/* ---------- 告知・空状態 ---------- */
.notice{
  border:none;border-radius:12px;background:rgba(46,139,240,.14);
  padding:14px 15px;margin-bottom:18px;font-size:13.5px;
}
.notice .btn{margin-top:12px}
.empty{border:none;border-radius:12px;background:var(--panel);padding:26px 16px;text-align:center;color:var(--chalk-dim);font-size:13.5px}
.empty b{display:block;color:var(--chalk);font-size:15px;margin-bottom:6px}

/* ---------- 週プラン ---------- */
.wk{border-top:1px solid var(--rule);padding:14px 0}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--chalk-dim)}
.wk-h b{color:var(--chalk);font-size:15px}
.wk-list{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--chalk-dim)}
.wk-list li{padding:4px 0}
.wk-list .d{color:var(--yellow);margin-right:9px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 分析 ---------- */
.chart{display:block;width:100%;height:auto;border:none;border-radius:12px;background:var(--panel)}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ax{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;background:#0E0F11}
.ax span{flex:1;min-width:0;font-size:11.5px;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ax input{width:58px;flex:0 0 auto;padding:6px 8px;min-height:36px;font-size:15px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--chalk-dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* ---------- AIアドバイス ---------- */
.advice{border:none;border-radius:12px;background:var(--panel);padding:15px 16px}
.advice-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--chalk-far);font-weight:600;margin-bottom:10px}
.advice-b{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- 演習 ---------- */
.q{border:none;border-left:4px solid var(--rule);border-radius:10px;background:var(--panel);padding:15px 16px;margin-bottom:12px}
.q.ok{border-left-color:var(--green)}
.q.half{border-left-color:var(--amber)}
.q.ng{border-left-color:var(--red)}
.q-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.q-no{font-size:13px;font-weight:800;color:var(--chalk-dim)}
.q-type{font-size:11px;font-weight:700;color:var(--chalk-far);border:1px solid var(--rule);border-radius:10px;padding:1px 9px}
.q-score{margin-left:auto;font-size:15px;font-weight:800}
.q.ok .q-score{color:var(--green)} .q.half .q-score{color:var(--amber)} .q.ng .q-score{color:var(--red)}
.q-p{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--rule);border-radius:10px;background:#0E0F11;
  color:var(--chalk);padding:12px;font-size:14px;line-height:1.6;cursor:pointer;min-height:48px;
}
.opt-i{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--chalk-far);margin-top:2px}
.opt.picked{border-color:var(--yellow);background:rgba(46,139,240,.12)}
.opt.right{border-color:var(--green);background:rgba(34,193,166,.12)}
.opt.right .opt-i{color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(232,56,79,.1)}
.opt.wrong .opt-i{color:var(--red)}
.opt[disabled]{cursor:default}
.ansin{margin-top:12px;line-height:1.7;resize:vertical}
.ansbox{margin-top:12px;border:1px solid var(--rule);border-radius:10px;background:#0E0F11;padding:12px;font-size:14px;white-space:pre-wrap}
.ansbox b{display:block;font-size:11px;color:var(--chalk-far);margin-bottom:5px;font-weight:600}
.q-c{margin-top:12px;font-size:13px;color:var(--chalk-dim);border-top:1px solid var(--rule);padding-top:10px}
.q-e{font-size:13.5px;line-height:1.8;color:var(--chalk-dim);white-space:pre-wrap;padding:2px 0 8px}
.score{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:18px}
.score-n{font-size:52px;font-weight:800;line-height:1;color:var(--chalk)}
.score-n small{font-size:17px;color:var(--chalk-dim);margin-left:3px}
.score-s{font-size:13px;color:var(--chalk-dim);margin-top:7px}
.pick-auto{border:none;border-radius:10px;background:rgba(46,139,240,.14);padding:13px 14px;font-size:15px;font-weight:700}
.pick-auto .num{color:var(--yellow);margin-left:6px}

/* ---------- タブ ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;background:#0B0C0E;border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;color:var(--chalk-far);
  padding:9px 0 10px;font-size:10px;font-weight:600;letter-spacing:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;
}
nav button .g{
  font-size:14px;line-height:26px;font-weight:800;
  width:30px;height:26px;border-radius:13px;
}
nav button[aria-current="page"]{color:var(--yellow)}
nav button[aria-current="page"] .g{background:rgba(46,139,240,.18);color:var(--yellow)}

:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>

<nav>
  <button data-tab="today"  aria-current="page"><span class="g">今</span>今日</button>
  <button data-tab="plan"><span class="g">逆</span>逆算</button>
  <button data-tab="practice"><span class="g">演</span>演習</button>
  <button data-tab="analysis"><span class="g">析</span>分析</button>
  <button data-tab="books"><span class="g">材</span>教材</button>
  <button data-tab="config"><span class="g">設</span>設定</button>
</nav>

<script>
"use strict";
/* =========================================================
   保存
   ========================================================= */
const KEY = "gyakusan.v1";
const DEFAULTS = {
  goals: [],
  books: [],
  tasks: [],
  examResults: [],
  weeklyAdvice: [],
  practiceSets: [],
  practice: null,
  settings: { weekdayPages: 12, holidayPages: 24, maxTasksPerDay: 3, restDays: [], bufferDays: 7, minChunk: 3,
              apiKey: "", model: "claude-sonnet-5" },
  lastPlan: null
};

const MODELS = [
  ["claude-sonnet-5", "Sonnet 5（推奨・約2円/回）"],
  ["claude-opus-5", "Opus 5（最も賢い・約5.5円/回）"],
  ["claude-haiku-4-5-20251001", "Haiku 4.5（最安・約1円/回）"]
];

/* =========================================================
   出題形式プリセット
   実在の過去問は一切収録しない。形式・範囲・難易度の記述だけを持ち、
   AIには毎回オリジナル問題を新規に作らせる。
   ========================================================= */
const FORMATS = {
  zento2: {
    label: "全統高2模試（記述式）",
    outline: "河合塾の全統高2模試。英語90分200点、数学80〜100分200点。記述問題の比重が高く、"
      + "平均点は200点満点で70〜90点程度。偏差値65の目安は英語125点・数学142点。"
      + "定期テストより範囲が広く、思考を要する問題が中心。",
    scope: "高校2年生が10月時点で既習の範囲にとどめること。数Ⅲ・数Cの発展内容は出さない。",
    english: {
      vocab: "語彙・熟語。文脈から適語を判断させる。単なる単語の意味当てではなく、コロケーションや多義語の識別を問う。",
      grammar: "文法・語法、整序英作文、和文英訳。記述式を混ぜる。",
      reading: "長文総合問題。英文は150〜200語。下線部和訳、内容説明の記述、内容一致を組み合わせる。"
    },
    math: {
      numfunc: "数ⅠA（数と式・2次関数）と数Ⅱ（式と証明、いろいろな式）。",
      geometry: "図形と計量・図形の性質、数Ⅱの図形と方程式。",
      prob: "場合の数と確率（数A）。",
      trig: "三角関数（数Ⅱ）、指数関数・対数関数。",
      calc: "微分法（数Ⅱ）。接線、極値、3次関数のグラフ。積分は基本のみ。",
      seqvec: "数列、ベクトル（数B）。"
    }
  },
  kyotsu: {
    label: "共通テスト形式（マーク中心）",
    outline: "大学入学共通テスト。会話文・図表・資料の読み取りなど、実用的な文脈での情報処理を重視。"
      + "知識の丸暗記ではなく、与えられた材料から judgement を要求する。時間に対して分量が多い。",
    scope: "高校2年生が既習の範囲にとどめること。",
    english: {
      vocab: "文脈の中で語義を判断させる。告知文・記事などの実用文を素材にする。",
      grammar: "単独の文法問題は出さず、文章の流れを踏まえた語句の選択として問う。",
      reading: "図表・資料つきの読解。事実と意見の区別、要点の把握、複数情報の照合。英文は150〜200語。"
    },
    math: {
      numfunc: "数と式、2次関数。会話文や具体的な場面設定を伴う誘導形式。",
      geometry: "図形と計量、図形の性質。",
      prob: "場合の数と確率。",
      trig: "三角関数、指数・対数。",
      calc: "微分・積分の考え。",
      seqvec: "数列、ベクトル。"
    }
  },
  keio: {
    label: "慶應経済A方式",
    outline: "慶應義塾大学経済学部A方式。英語200点、数学150点（80分）。2027年度入試から小論文は廃止され英数2教科型。"
      + "数学はマーク式と記述式の併用で、複数単元をまたぐ複合問題が多い。試験時間に対して分量が多く、正確さと速さの両方を要求される。"
      + "英語は自由英作文を含み、論理的に主張を組み立てる力が問われる。",
    scope: "難易度は高めに設定してよいが、高校2年生の既習範囲を大きく超える道具は使わないこと。",
    english: {
      vocab: "抽象度の高い評論調の文脈で語義を判断させる。",
      grammar: "文法知識そのものより、英作文で正しく運用できるかを問う。和文英訳・条件つき英作文を混ぜる。",
      reading: "社会科学系の評論文の読解。英文は180〜220語。要約、内容説明、意見論述を組み合わせる。"
    },
    math: {
      numfunc: "数と式、2次関数。他分野との複合を意識する。",
      geometry: "図形と方程式。ベクトルとの融合が多い。",
      prob: "確率。頻出分野。漸化式との融合もありうる。",
      trig: "指数・対数。三角関数の出題頻度は低いため比重を下げる。",
      calc: "微分・積分。頻出分野。面積、最大最小。",
      seqvec: "数列、ベクトル。ともに頻出分野。"
    }
  }
};

/* 演習で出題できる分野。リスニングは音声が扱えないため英語からは外す */
const PRACTICE_TOPICS = {
  english: [["vocab","語彙・熟語"], ["grammar","文法・英作文"], ["reading","長文読解"]],
  math: [
    ["numfunc","数と式・2次関数"], ["geometry","図形"], ["prob","場合の数・確率"],
    ["trig","三角・指数対数"], ["calc","微分積分"], ["seqvec","数列・ベクトル"]
  ]
};

/* 分野別の軸。英語は技能、数学は単元でまとめる */
const AXES = {
  english: [
    ["vocab","語彙"], ["grammar","文法"], ["reading","長文"], ["listening","リスニング"]
  ],
  math: [
    ["numfunc","数と式・2次関数"], ["geometry","図形"], ["prob","場合の数・確率"],
    ["trig","三角・指数対数"], ["calc","微分積分"], ["seqvec","数列・ベクトル"]
  ]
};
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULTS), d, {
      settings: Object.assign(structuredClone(DEFAULTS.settings), d.settings || {})
    });
  }catch(e){
    console.error(e);
    return structuredClone(DEFAULTS);
  }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* =========================================================
   日付ユーティリティ（すべてローカル時間の YYYY-MM-DD 文字列で扱う）
   ========================================================= */
const WD = ["日","月","火","水","木","金","土"];
function ymd(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function today(){ return ymd(new Date()); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function dow(s){ return parse(s).getDay(); }
function fmtMD(s){ const d = parse(s); return (d.getMonth()+1) + "/" + d.getDate(); }
function fmtFull(s){ const d = parse(s); return (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")"; }
/* 週の始まり＝月曜 */
function weekStart(s){ const d = parse(s); const off = (d.getDay() + 6) % 7; return addDays(s, -off); }

const SUBJ = { english: "英語", math: "数学" };

/* =========================================================
   逆算プランの生成
   優先度 = 重み × (残ページ ÷ 目標日までの残日数)
   重要度と締切の切迫度をどちらも効かせる
   ========================================================= */
/* 締切は模試日そのものではなく「仕上げ日」＝模試の bufferDays 日前。
   直前は総復習に空けておく。 */
function deadlineFor(subject, from){
  const buf = Math.max(0, Number(db.settings.bufferDays) || 0);
  const future = db.goals
    .filter(g => g.subject === subject && diffDays(from, g.examDate) >= 0)
    .sort((a,b) => a.examDate.localeCompare(b.examDate));
  if(!future.length) return null;
  const fin = addDays(future[0].examDate, -buf);
  return fin > from ? fin : future[0].examDate;
}

function dailyCap(dateStr){
  const s = db.settings;
  if(s.restDays && s.restDays.includes(dow(dateStr))) return 0;
  const weekend = dow(dateStr) === 0 || dow(dateStr) === 6;
  return Math.max(0, weekend ? s.holidayPages : s.weekdayPages);
}

function generatePlan(){
  const t0 = today();

  // 完了済みタスクだけ履歴として残す。未消化はここで消え、以下で組み直される
  db.tasks = db.tasks.filter(t => t.done);

  // 仮想の進捗カーソルを立てて日ごとに配っていく
  const sim = [];
  for(const b of db.books){
    for(const u of (b.units||[])){
      if(u.status === "done") continue;
      const total = Number(u.totalPages)||0;
      const cur = Math.min(Number(u.currentPage)||0, total);
      if(total - cur <= 0) continue;
      sim.push({
        bookId: b.id, bookTitle: b.title, subject: b.subject,
        unitId: u.id, unitName: u.name, weight: Number(u.weight)||3,
        cursor: cur, total: total,
        deadline: deadlineFor(b.subject, t0) || addDays(t0, 56)
      });
    }
  }
  if(!sim.length){ db.lastPlan = t0; save(); return 0; }

  const HORIZON = 220;
  const maxTasks = Math.max(1, Number(db.settings.maxTasksPerDay)||3);
  const minChunk = Math.max(1, Number(db.settings.minChunk)||3);
  const out = [];
  sim.forEach(u => u.debt = 0);

  for(let i = 0; i < HORIZON; i++){
    const date = addDays(t0, i);

    const live = sim.filter(u => u.total - u.cursor > 0);
    if(!live.length) break;

    // その日時点で「仕上げ日までに終わらせるには1日何ページ必要か」を出す。
    // 上限いっぱいまで前倒しはせず、仕上げ日ちょうどに終わるペースで配る。
    live.forEach(u => {
      const left = Math.max(1, diffDays(date, u.deadline));
      u.need = (u.total - u.cursor) / left;
      u.debt += u.need;
      u.score = u.weight * u.need;
    });

    const cap = dailyCap(date);
    if(cap <= 0) continue;   // 休養日でもペースの借りは溜まっていく

    // ペースが1日1ページを超える単元は毎日。それ未満は minChunk 溜まってから
    // まとめて出す。1ページだけのタスクが延々並ぶのを避ける。
    const ready = live
      .filter(u => u.need >= 1 || u.debt >= minChunk || (u.total - u.cursor) <= minChunk)
      .sort((a,b) => b.score - a.score)
      .slice(0, maxTasks);

    let spent = 0;
    ready.forEach(u => {
      const remainCap = cap - spent;
      if(remainCap <= 0) return;
      let n = u.need >= 1 ? Math.ceil(u.need) : Math.floor(u.debt);
      n = Math.max(1, Math.min(n, remainCap, u.total - u.cursor));
      const from = u.cursor + 1, to = u.cursor + n;
      out.push({
        id: uid(), date, bookId: u.bookId, unitId: u.unitId,
        bookTitle: u.bookTitle, unitName: u.unitName, subject: u.subject,
        weight: u.weight, fromPage: from, toPage: to, pages: n,
        range: from === to ? "p." + from : "p." + from + "–" + to, done: false
      });
      u.cursor += n;
      u.debt -= n;
      spent += n;
    });
  }

  db.tasks = db.tasks.concat(out);
  db.tasks.sort((a,b) => a.date.localeCompare(b.date));
  db.lastPlan = t0;
  save();
  return out.length;
}

/* =========================================================
   タスク完了 / 取り消し（単元の現在ページを動かす唯一の経路）
   ========================================================= */
function toggleTask(id){
  const t = db.tasks.find(x => x.id === id);
  if(!t) return;
  const u = findUnit(t.bookId, t.unitId);
  t.done = !t.done;
  if(u){
    if(t.done){
      u.currentPage = Math.min(Number(u.totalPages)||0, Math.max(Number(u.currentPage)||0, t.toPage));
      if(u.currentPage >= (Number(u.totalPages)||0)) u.status = "done";
      else u.status = "in_progress";
    }else{
      u.currentPage = Math.max(0, Math.min(Number(u.currentPage)||0, t.fromPage - 1));
      u.status = u.currentPage > 0 ? "in_progress" : "todo";
    }
  }
  save();
  render();
}

function findUnit(bookId, unitId){
  const b = db.books.find(x => x.id === bookId);
  return b ? (b.units||[]).find(u => u.id === unitId) : null;
}

/* その科目の直近の模試結果。なければ null */
function latestResult(subject){
  const rs = db.examResults.filter(r => r.subject === subject)
                           .sort((a,b) => a.date.localeCompare(b.date));
  return rs.length ? rs[rs.length - 1] : null;
}
/* 現在点は、模試結果があればそれを優先する（二重入力を避ける） */
function currentScoreOf(goal){
  const r = latestResult(goal.subject);
  return r ? r.score : goal.currentScore;
}
/* 結果待ちの模試＝日程は過ぎたのに、その日以降の結果が入っていないもの */
function pendingResults(){
  const t0 = today();
  return db.goals.filter(g => g.examDate < t0 &&
    !db.examResults.some(r => r.subject === g.subject && r.date >= g.examDate));
}

/* =========================================================
   ストリーク
   タスクのある日をすべて消化したら達成。タスクのない日は素通り
   ========================================================= */
function streakDays(){
  const byDate = {};
  for(const t of db.tasks){
    (byDate[t.date] = byDate[t.date] || []).push(t);
  }
  let n = 0, cur = today();
  // 今日がまだ途中なら、昨日から数え始める
  const todayTasks = byDate[cur] || [];
  if(!(todayTasks.length && todayTasks.every(t => t.done))) cur = addDays(cur, -1);
  for(let i = 0; i < 400; i++){
    const list = byDate[cur];
    if(list && list.length){
      if(list.every(t => t.done)) n++;
      else break;
    }
    cur = addDays(cur, -1);
  }
  return n;
}

function overdueCount(){
  const t0 = today();
  return db.tasks.filter(t => !t.done && t.date < t0).length;
}

/* =========================================================
   Canvas — 正の字のタリー
   ========================================================= */
function drawTally(cv, n){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cols = Math.min(6, Math.max(1, Math.ceil(n / 5) || 1));
  const cw = 34, gap = 13, pad = 4;
  const w = n ? cols * cw + (cols - 1) * gap + pad * 2 : 92;
  const h = 46;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  c.clearRect(0,0,w,h);
  c.lineCap = "round";
  c.lineWidth = 2.4;

  const full = Math.floor(n / 5), rest = n % 5;
  const shown = Math.min(cols, full + (rest ? 1 : 0));
  const skipped = Math.max(0, Math.ceil(n/5) - cols);

  for(let i = 0; i < shown; i++){
    const idx = i + skipped;
    const strokes = (idx < full) ? 5 : rest;
    drawSei(c, pad + i * (cw + gap), 7, cw, h - 16, strokes,
            idx < full ? "#FFFFFF" : "#2E8BF0");
  }
  if(!n){
    c.font = "600 12px system-ui, sans-serif";
    c.fillStyle = "#6B7078";
    c.fillText("まだ0日", pad, 26);
  }
}
// 正 = 一 丨 一 丨 一（筆順どおり5画）
function drawSei(c, x, y, w, h, strokes, color){
  const cx = x + w * 0.52, my = y + h * 0.50;
  const seg = [
    [[x + w*0.18, y], [x + w*0.86, y]],                 // ① 上の横
    [[cx, y], [cx, y + h]],                             // ② 中央の縦
    [[x + w*0.10, my], [cx, my]],                       // ③ 中ほどの短い横
    [[x + w*0.10, my], [x + w*0.10, y + h]],            // ④ 左の縦
    [[x - w*0.04, y + h], [x + w*1.04, y + h]]          // ⑤ 下の横
  ];
  c.strokeStyle = color;
  for(let i = 0; i < strokes; i++){
    const [a, b] = seg[i];
    c.globalAlpha = 0.92;
    c.beginPath();
    c.moveTo(a[0], a[1]);
    c.lineTo(b[0] + (Math.random()-0.5), b[1] + (Math.random()-0.5));
    c.stroke();
  }
  c.globalAlpha = 1;
}

/* =========================================================
   Canvas — 逆算メーター（週ごとの計画量と消化量）
   ========================================================= */
function drawMeter(cv){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 320, h = 150;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  c.clearRect(0,0,w,h);

  const t0 = today(), w0 = weekStart(t0);
  const weeks = [];
  for(let i = 0; i < 14; i++){
    const ws = addDays(w0, i * 7), we = addDays(ws, 6);
    const list = db.tasks.filter(t => t.date >= ws && t.date <= we);
    weeks.push({
      ws, we,
      plan: list.reduce((s,t) => s + t.pages, 0),
      done: list.filter(t => t.done).reduce((s,t) => s + t.pages, 0),
      exams: db.goals.filter(g => g.examDate >= ws && g.examDate <= we)
    });
  }
  const max = Math.max(1, ...weeks.map(x => x.plan));
  const padL = 6, padB = 30, padT = 26;
  const bw = (w - padL*2) / weeks.length;
  const inner = bw * 0.62;
  const base = h - padB;

  // 基準線
  c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, base + .5); c.lineTo(w, base + .5); c.stroke();

  weeks.forEach((wk, i) => {
    const x = padL + i * bw + (bw - inner) / 2;
    const bh = (wk.plan / max) * (base - padT);
    // 計画
    c.fillStyle = "#2A2C31";
    c.fillRect(x, base - bh, inner, bh);
    // 消化
    const dh = wk.plan ? (wk.done / wk.plan) * bh : 0;
    c.fillStyle = i === 0 ? "#2E8BF0" : "#22C1A6";
    c.fillRect(x, base - dh, inner, dh);
    // 模試の位置に縦線
    if(wk.exams.length){
      c.strokeStyle = "#E8384F"; c.lineWidth = 1.5;
      c.setLineDash([3,3]);
      c.beginPath(); c.moveTo(x + inner/2, padT - 10); c.lineTo(x + inner/2, base); c.stroke();
      c.setLineDash([]);
      c.fillStyle = "#E8384F";
      c.font = "700 9px system-ui, sans-serif";
      c.textAlign = "center";
      c.fillText("模試", x + inner/2, padT - 13);
    }
    // 週ラベル（隔週）
    if(i % 2 === 0){
      c.fillStyle = i === 0 ? "#2E8BF0" : "#6B7078";
      c.font = "600 9px ui-monospace, monospace";
      c.textAlign = "center";
      c.fillText(fmtMD(wk.ws), x + inner/2, base + 13);
      if(i === 0){
        c.font = "700 8px system-ui, sans-serif";
        c.fillText("今週", x + inner/2, base + 24);
      }
    }
  });
  c.textAlign = "left";
}

/* =========================================================
   Canvas — 得点・偏差値の推移
   ========================================================= */
function setupCanvas(cv, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 320;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  return { c, w, h };
}

function drawTrend(cv, metric){
  const { c, w, h } = setupCanvas(cv, 190);
  const key = metric === "deviation" ? "deviation" : "score";
  const series = ["english","math"].map(s => ({
    subject: s, color: s === "english" ? "#2E8BF0" : "#E8384F",
    pts: db.examResults.filter(r => r.subject === s && r[key] != null)
                       .sort((a,b) => a.date.localeCompare(b.date))
  })).filter(s => s.pts.length);

  if(!series.length){
    c.fillStyle = "#6B7078"; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("模試結果を入れると推移が出ます", w/2, h/2);
    c.textAlign = "left"; return;
  }

  const all = series.flatMap(s => s.pts);
  const dates = all.map(r => parse(r.date).getTime());
  let dMin = Math.min(...dates), dMax = Math.max(...dates);
  if(dMin === dMax){ dMin -= 86400000 * 7; dMax += 86400000 * 7; }

  const targets = metric === "score"
    ? db.goals.filter(g => series.some(s => s.subject === g.subject)).map(g => g.targetScore)
    : [];
  const vals = all.map(r => r[key]).concat(targets);
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  const padV = Math.max(3, (vMax - vMin) * 0.25);
  vMin = Math.floor(vMin - padV); vMax = Math.ceil(vMax + padV);

  const L = 30, R = 10, T = 14, B = 26;
  const px = t => L + (t - dMin) / (dMax - dMin) * (w - L - R);
  const py = v => T + (1 - (v - vMin) / (vMax - vMin)) * (h - T - B);

  c.font = "600 9px ui-monospace, monospace";
  for(let i = 0; i <= 3; i++){
    const v = vMin + (vMax - vMin) * i / 3, y = py(v);
    c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(L, y + .5); c.lineTo(w - R, y + .5); c.stroke();
    c.fillStyle = "#6B7078"; c.textAlign = "right";
    c.fillText(Math.round(v), L - 5, y + 3);
  }

  // 目標点の線
  if(metric === "score"){
    db.goals.forEach(g => {
      if(!series.some(s => s.subject === g.subject)) return;
      const y = py(g.targetScore);
      c.strokeStyle = g.subject === "english" ? "#2E8BF0" : "#E8384F";
      c.globalAlpha = .45; c.setLineDash([4,4]); c.lineWidth = 1;
      c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke();
      c.setLineDash([]); c.globalAlpha = 1;
    });
  }

  series.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = 2; c.lineJoin = "round";
    c.beginPath();
    s.pts.forEach((r, i) => {
      const x = px(parse(r.date).getTime()), y = py(r[key]);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.stroke();
    s.pts.forEach(r => {
      const x = px(parse(r.date).getTime()), y = py(r[key]);
      c.fillStyle = "#16171A"; c.beginPath(); c.arc(x, y, 4.5, 0, 7); c.fill();
      c.strokeStyle = s.color; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 3.4, 0, 7); c.stroke();
    });
  });

  c.fillStyle = "#6B7078"; c.font = "600 9px ui-monospace, monospace";
  const sorted = all.slice().sort((a,b) => a.date.localeCompare(b.date));
  c.textAlign = "left";  c.fillText(fmtMD(sorted[0].date), L, h - 8);
  if(sorted.length > 1){
    c.textAlign = "right"; c.fillText(fmtMD(sorted[sorted.length-1].date), w - R, h - 8);
  }
  c.textAlign = "left";
}

/* =========================================================
   Canvas — 分野別レーダー（最新と、ひとつ前を重ねる）
   ========================================================= */
function drawRadar(cv, subject){
  const axes = AXES[subject];
  const { c, w, h } = setupCanvas(cv, 230);
  const cx = w / 2, cy = h / 2 + 4;
  const R = Math.min(w, h) / 2 - 40;
  const N = axes.length;
  const ang = i => -Math.PI/2 + i * 2 * Math.PI / N;

  const rs = db.examResults.filter(r => r.subject === subject)
                           .sort((a,b) => a.date.localeCompare(b.date));
  const latest = rs[rs.length - 1], prev = rs[rs.length - 2];

  for(let g = 1; g <= 4; g++){
    c.strokeStyle = g === 4 ? "#3A3D44" : "#2A2C31"; c.lineWidth = 1;
    c.beginPath();
    for(let i = 0; i < N; i++){
      const r = R * g / 4, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath(); c.stroke();
  }
  c.font = "700 10px system-ui, sans-serif";
  for(let i = 0; i < N; i++){
    const x = cx + Math.cos(ang(i)) * R, y = cy + Math.sin(ang(i)) * R;
    c.strokeStyle = "#2A2C31"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(x, y); c.stroke();
    const lx = cx + Math.cos(ang(i)) * (R + 15), ly = cy + Math.sin(ang(i)) * (R + 15);
    c.fillStyle = "#9DA1A8";
    c.textAlign = Math.abs(lx - cx) < 6 ? "center" : (lx > cx ? "left" : "right");
    c.textBaseline = "middle";
    c.fillText(axes[i][1], lx, ly);
  }
  c.textAlign = "left"; c.textBaseline = "alphabetic";

  if(!latest){
    c.fillStyle = "#6B7078"; c.font = "600 12px system-ui, sans-serif"; c.textAlign = "center";
    c.fillText("結果待ち", cx, cy + 4); c.textAlign = "left"; return;
  }

  const poly = (res, color, fill) => {
    c.beginPath();
    for(let i = 0; i < N; i++){
      const v = Math.max(0, Math.min(1, Number((res.breakdown||{})[axes[i][0]]) || 0));
      const r = R * v, x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
    if(fill){ c.fillStyle = fill; c.fill(); }
    c.strokeStyle = color; c.lineWidth = 2; c.stroke();
  };
  if(prev){ c.setLineDash([3,3]); poly(prev, "#6B7078", null); c.setLineDash([]); }
  poly(latest, "#2E8BF0", "rgba(46,139,240,.20)");

  const pb = practiceBreakdown(subject);
  if(pb){
    for(let i = 0; i < N; i++){
      const v = pb[axes[i][0]];
      if(v == null) continue;
      const r = R * Math.max(0, Math.min(1, v));
      const x = cx + Math.cos(ang(i)) * r, y = cy + Math.sin(ang(i)) * r;
      c.fillStyle = "#16171A"; c.beginPath(); c.arc(x, y, 5.5, 0, 7); c.fill();
      c.fillStyle = "#F0B429"; c.beginPath(); c.arc(x, y, 3.6, 0, 7); c.fill();
    }
  }
}

function buildAdvicePayload(){

  L.push("## 今日 " + t0);

  L.push("\n## 目標（登録済みの模試）");
  const gs = db.goals.slice().sort((a,b) => a.examDate.localeCompare(b.examDate));
  if(!gs.length) L.push("未登録");
  gs.forEach(g => {
    const dd = diffDays(t0, g.examDate);
    L.push("- " + g.examDate + " " + (g.name||"模試") + " / " + SUBJ[g.subject]
      + " / 目標" + g.targetScore + "点 / 現在" + currentScoreOf(g) + "点"
      + " / " + (dd >= 0 ? "あと" + dd + "日" : "実施済み"));
  });

  L.push("\n## 模試結果（新しい順、最大4件）");
  const rs = db.examResults.slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0,4);
  if(!rs.length) L.push("未登録");
  rs.forEach(r => {
    const bd = AXES[r.subject].map(([k,label]) => {
      const v = (r.breakdown||{})[k];
      return v == null ? null : label + " " + Math.round(v*100) + "%";
    }).filter(Boolean).join(" / ");
    L.push("- " + r.date + " " + (r.name||"模試") + " / " + SUBJ[r.subject]
      + " / 得点" + r.score + (r.deviation != null ? " / 偏差値" + r.deviation : "")
      + (bd ? "\n  分野別: " + bd : ""));
  });

  L.push("\n## 手持ちの教材と進捗");
  if(!db.books.length) L.push("未登録");
  db.books.forEach(b => {
    L.push("- " + b.title + "（" + SUBJ[b.subject] + "）");
    (b.units||[]).forEach(u => {
      const tp = Number(u.totalPages)||0, cp = Math.min(Number(u.currentPage)||0, tp);
      L.push("  ・" + u.name + " 重要度" + u.weight + " " + cp + "/" + tp + "p（残" + (tp-cp) + "p）");
    });
  });

  L.push("\n## 直近2週間の消化");
  const from = addDays(t0, -14);
  const past = db.tasks.filter(t => t.date >= from && t.date < t0);
  const donePages = past.filter(t => t.done).reduce((s,t) => s + t.pages, 0);
  const planPages = past.reduce((s,t) => s + t.pages, 0);
  L.push("- 計画 " + planPages + "p に対して消化 " + donePages + "p"
    + (planPages ? "（" + Math.round(donePages/planPages*100) + "%）" : ""));
  L.push("- 連続達成 " + streakDays() + "日 / 積み残し " + overdueCount() + "件");

  L.push("\n## 今後2週間の計画");
  const nx = db.tasks.filter(t => t.date >= t0 && t.date < addDays(t0, 14));
  const agg = {};
  nx.forEach(t => { const k = t.bookTitle + " / " + t.unitName; agg[k] = (agg[k]||0) + t.pages; });
  const keys = Object.keys(agg);
  if(!keys.length) L.push("未作成");
  keys.forEach(k => L.push("- " + k + " " + agg[k] + "p"));

  return L.join("\n");
}

async function callClaude(system, userText, maxTokens){
  const key = (db.settings.apiKey || "").trim();
  if(!key) throw new Error("APIキーが未設定です。設定タブで登録してください。");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: db.settings.model || "claude-sonnet-5",
      max_tokens: maxTokens || 1200,
      system,
      messages: [{ role: "user", content: userText }]
    })
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
    if(res.status === 401) throw new Error("APIキーが違うようです。設定タブで入れ直してください。");
    if(res.status === 429) throw new Error("呼び出しが混み合っています。少し置いてからもう一度。");
    if(res.status === 400 && /credit|balance/i.test(msg)) throw new Error("クレジット残高が不足しています。コンソールで確認してください。");
    throw new Error(msg);
  }
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
}

/* =========================================================
   模試対策演習
   実在の過去問は複製せず、形式・範囲・難易度を模した新作を毎回生成する
   ========================================================= */
const PRACTICE_COUNT = 8;

function weakestTopic(subject){
  const r = latestResult(subject);
  const list = PRACTICE_TOPICS[subject];
  if(!r || !r.breakdown) return list[0][0];
  const scored = list.map(([k]) => [k, Number(r.breakdown[k])])
                     .filter(x => Number.isFinite(x[1]));
  if(!scored.length) return list[0][0];
  return scored.sort((a,b) => a[1] - b[1])[0][0];
}

function topicLabel(subject, key){
  const f = (PRACTICE_TOPICS[subject].find(t => t[0] === key) || [key, key]);
  return f[1];
}

function buildGenPrompt(formatId, subject, topic){
  const F = FORMATS[formatId];
  const detail = F[subject][topic];
  const r = latestResult(subject);
  const rate = r && r.breakdown && r.breakdown[topic] != null
    ? Math.round(r.breakdown[topic] * 100) + "%" : "不明";
  return [
    "## 出題の条件",
    "形式: " + F.label,
    "形式の特徴: " + F.outline,
    "範囲の制約: " + F.scope,
    "科目: " + SUBJ[subject],
    "分野: " + topicLabel(subject, topic),
    "分野の出題内容: " + detail,
    "直近の模試でのこの分野の得点率: " + rate,
    "",
    "## 指示",
    "上の形式・範囲・難易度に沿ったオリジナル問題を " + PRACTICE_COUNT + " 問つくってください。",
    "選択式と記述式を混ぜ、記述式は3問以上入れること。",
    "得点率が低い分野なので、基礎の確認から始めて段階的に難度を上げる構成にしてください。",
    "長文読解の場合は、英文パッセージを1つ書き、それに対する設問を並べること（パッセージは最初の問題文の中に含める）。",
    "数学の場合、数式は LaTeX を使わずプレーンテキストで書くこと（例: x^2、√3、(1/2)、a_n）。"
  ].join("\n");
}

const GEN_SYSTEM =
  "あなたは大学受験の問題作成者です。指定された試験形式の傾向・範囲・難易度を模した、完全にオリジナルの問題を作成します。\n" +
  "厳守事項:\n" +
  "・実在する模試・過去問・市販問題集の文章や設問を、そのまま、あるいは軽微な改変で用いてはいけません。素材の英文・数値・設定はすべて新規に創作すること。\n" +
  "・指定された範囲を超える知識を必要とする問題を出さないこと。\n" +
  "・解答は必ず一意に定まるようにし、設問文だけで解答に必要な情報が揃うようにすること。\n" +
  "出力は次のJSONのみ。前置き・後書き・コードフェンスは一切書かないこと。\n" +
  '{"questions":[{"no":1,"type":"choice","prompt":"問題文","choices":["選択肢1","選択肢2","選択肢3","選択肢4"],"answer":0,"explanation":"解説"},' +
  '{"no":2,"type":"written","prompt":"問題文","modelAnswer":"模範解答","rubric":"採点の観点を2〜3項目、各観点の配点つきで","explanation":"解説"}]}\n' +
  "answer は choices の 0 始まりの番号。type は choice か written のいずれか。解説は簡潔に、なぜそうなるかを示すこと。";

const GRADE_SYSTEM =
  "あなたは大学受験の採点者です。渡された設問・模範解答・採点基準にもとづき、受験生の記述解答を採点します。\n" +
  "・採点基準の観点ごとに満たしているかを見て、0〜100の得点率をつけること。表現が模範解答と違っても、内容が要件を満たしていれば加点すること。\n" +
  "・無解答・白紙は0点。的外れな内容も0点。部分的に正しければその分だけ与えること。\n" +
  "・comment は50字以内で、どこが足りないかを具体的に指摘すること。褒めるだけの講評は書かない。\n" +
  "出力は次のJSONのみ。前置き・コードフェンス・説明文は一切書かないこと。\n" +
  '{"grades":[{"no":1,"score":70,"comment":"…"}],"overall":"全体の講評を100字以内で"}';

function parseJSON(text){
  let s = String(text || "").trim();
  s = s.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a < 0 || b < a) throw new Error("応答をJSONとして読み取れませんでした。");
  return JSON.parse(s.slice(a, b + 1));
}

async function gradePractice(){
  const p = db.practice;
  if(!p || practiceBusy) return;

  // 選択式は端末側で判定。AIには記述式だけ渡す
  const written = p.questions.filter(q => q.type === "written");
  const unanswered = p.questions.filter(q => {
    const a = p.answers[q.no];
    return a == null || (typeof a === "string" && !a.trim());
  });
  if(unanswered.length && !confirm(unanswered.length + "問が未解答です。このまま採点しますか。")) return;

  practiceBusy = true; render();
  try{
    let grades = [], overall = "";
    if(written.length){
      const payload = written.map(q => [
        "### 問" + q.no,
        "設問: " + q.prompt,
        "模範解答: " + q.modelAnswer,
        "採点基準: " + q.rubric,
        "受験生の解答: " + ((p.answers[q.no] || "").trim() || "（無解答）")
      ].join("\n")).join("\n\n");
      const raw = await callClaude(GRADE_SYSTEM, payload, 2000);
      const parsed = parseJSON(raw);
      grades = parsed.grades || [];
      overall = parsed.overall || "";
    }

    const gmap = {};
    grades.forEach(g => { gmap[Number(g.no)] = g; });

    const detail = p.questions.map(q => {
      if(q.type === "choice"){
        const picked = p.answers[q.no];
        const ok = picked != null && Number(picked) === q.answer;
        return { no: q.no, type: "choice", score: ok ? 100 : 0, comment: ok ? "正解" : "不正解" };
      }
      const g = gmap[q.no] || {};
      const sc = Math.max(0, Math.min(100, Number(g.score) || 0));
      return { no: q.no, type: "written", score: sc, comment: String(g.comment || "") };
    });

    const rate = detail.reduce((s,d) => s + d.score, 0) / (detail.length * 100);
    p.result = { detail, overall, rate };
    p.status = "graded";
    db.practiceSets.unshift(JSON.parse(JSON.stringify(p)));
    db.practiceSets = db.practiceSets.slice(0, 40);
    save();
  }catch(err){
    alert("採点できませんでした。\n\n" + err.message);
  }finally{
    practiceBusy = false; render();
  }
}

/* 直近の演習を分野別に集計。レーダーへ重ねる */
function practiceBreakdown(subject){
  const bd = {}, cnt = {};
  db.practiceSets.filter(p => p.subject === subject && p.result)
    .slice(0, 6)
    .forEach(p => {
      bd[p.topic] = (bd[p.topic] || 0) + p.result.rate;
      cnt[p.topic] = (cnt[p.topic] || 0) + 1;
    });
  const out = {};
  Object.keys(bd).forEach(k => out[k] = bd[k] / cnt[k]);
  return Object.keys(out).length ? out : null;
}

     + '<div class="row"><div><label for="g-cur">現在の点</label><input id="g-cur" type="number" inputmode="numeric" value="60"></div>'

     + '<button class="btn" data-act="addgoal">模試を追加する</button></div></section>';

  return h;
}

/* ---------- 分析 ---------- */
function viewAnalysis(){
  const rs = db.examResults.slice().sort((a,b) => b.date.localeCompare(a.date));
  let h = "";

  // 目標とのギャップ
  h += '<p class="eyebrow">目標とのギャップ</p><div class="gaps" style="margin-top:0">';
  ["english","math"].forEach(s => {
    const t0 = today();
    const gs = db.goals.filter(x => x.subject === s).sort((a,b) => a.examDate.localeCompare(b.examDate));
    const g = gs.find(x => x.examDate >= t0) || gs[gs.length - 1];
    const r = latestResult(s);
    if(!g && !r) return;
    const cur = r ? r.score : (g ? g.currentScore : 0);
    const tgt = g ? g.targetScore : null;
    const diff = tgt == null ? null : tgt - cur;
    h += '<div class="gap"><b>' + SUBJ[s] + '</b><div class="v num">' + cur
       + (tgt == null ? '' : ' <small>→</small> ' + tgt
          + ' <small style="color:' + (diff > 0 ? 'var(--red)' : 'var(--green)') + '">'
          + (diff > 0 ? 'あと' + diff : '到達') + '</small>')
       + '</div></div>';
  });
  h += '</div>';
  if(!rs.length && !db.goals.length){
    h = '<div class="empty"><b>まだ何もありません</b>「逆算」タブで模試を登録し、受けたら結果をここに入れてください。</div>';
  }

  // AIアドバイス
  const adv = db.weeklyAdvice;
  h += '<section style="margin-top:24px"><p class="eyebrow">AIアドバイス</p>';
  if(adv.length){
    h += '<div class="advice"><div class="advice-h">' + fmtFull(adv[0].date)
      + ' ・ ' + esc(modelLabel(adv[0].model)) + '</div>'
      + '<div class="advice-b">' + esc(adv[0].content) + '</div></div>';
  }else{
    h += '<div class="empty"><b>まだ生成していません</b>模試結果と教材を入れてからボタンを押すと、来週の重点を出します。</div>';
  }
  h += '<button class="btn ' + (advising ? '' : 'primary') + '" data-act="advise"' + (advising ? ' disabled' : '') + '>'
    + (advising ? '生成中…' : (adv.length ? '新しく生成する' : 'アドバイスを生成する')) + '</button>';
  if(!(db.settings.apiKey || "").trim()){
    h += '<p class="item-sub" style="margin:7px 0 0">使うには設定タブで Claude の APIキーを登録してください。</p>';
  }
  if(adv.length > 1){
    h += '<details class="fold"><summary>過去のアドバイス（' + (adv.length - 1) + '件）</summary>'
      + adv.slice(1).map(a =>
          '<div class="advice" style="margin-top:8px"><div class="advice-h">' + fmtFull(a.date)
          + ' ・ ' + esc(modelLabel(a.model))
          + '<button class="x" data-act="deladvice" data-id="' + a.id + '" aria-label="削除">×</button></div>'
          + '<div class="advice-b">' + esc(a.content) + '</div></div>').join("")
      + '</details>';
  }
  h += '</section>';

  // 推移
  h += '<section style="margin-top:24px"><p class="eyebrow">推移</p>'
    + '<div class="row" style="gap:6px;margin-bottom:9px">'
    + '<button class="btn btn-sm ' + (trendMetric === "score" ? 'primary' : 'ghost') + '" data-act="metric" data-m="score" style="flex:1;margin:0">得点</button>'
    + '<button class="btn btn-sm ' + (trendMetric === "deviation" ? 'primary' : 'ghost') + '" data-act="metric" data-m="deviation" style="flex:1;margin:0">偏差値</button></div>'
    + '<canvas id="trend" class="chart"></canvas>'
    + '<div class="legend">'
    + '<span><i style="background:var(--yellow)"></i>英語</span>'
    + '<span><i style="background:var(--red)"></i>数学</span>'
    + (trendMetric === "score" ? '<span>破線が目標点</span>' : '')
    + '</div></section>';

  // レーダー
  ["english","math"].forEach(s => {
    const r = latestResult(s);
    h += '<section style="margin-top:24px"><p class="eyebrow">' + SUBJ[s] + ' の分野別</p>'
      + '<canvas id="radar-' + s + '" class="chart"></canvas>';
    if(r){
      const weak = AXES[s].map(([k,label]) => [label, Number((r.breakdown||{})[k]) || 0])
                          .sort((a,b) => a[1] - b[1])[0];
      h += '<p class="item-sub" style="margin:7px 0 0">' + fmtFull(r.date)
        + ' 時点。いちばん低いのは <b style="color:var(--red)">' + esc(weak[0]) + '</b>（'
        + Math.round(weak[1] * 100) + '%）'
        + (db.examResults.filter(x => x.subject === s).length > 1 ? '。灰の破線はひとつ前の結果です。' : '')
        + (practiceBreakdown(s) ? ' <span style="color:var(--amber)">黄の点は演習での得点率です。</span>' : '')
        + '</p>';
    }
    h += '</section>';
  });

  // 結果一覧
  h += '<section style="margin-top:26px"><p class="eyebrow">模試結果</p>';
  if(!rs.length){
    h += '<div class="empty"><b>結果が未登録です</b>模試を受けたら、下のフォームから入れてください。</div>';
  }else{
    h += rs.map(r =>
      '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + esc(r.name || "模試") + ' ・ ' + SUBJ[r.subject] + '</div>'
      + '<div class="item-sub">' + fmtFull(r.date) + ' ・ 得点 ' + r.score
      + (r.deviation != null ? ' ・ 偏差値 ' + r.deviation : '') + '</div>'
      + '</div><button class="x" data-act="delresult" data-id="' + r.id + '" aria-label="削除">×</button></div></div>').join("");
  }

  // 入力フォーム
  const axes = AXES[resultSubject];
  h += '<details class="fold" open><summary>結果を追加</summary><div class="card" style="margin:8px 0 0">'
    + '<label for="r-name">模試の名前</label><input id="r-name" placeholder="第2回 全統記述模試">'
    + '<div class="row"><div><label for="r-date">受験日</label><input id="r-date" type="date" value="' + today() + '"></div>'
    + '<div><label for="r-subj">科目</label><select id="r-subj" data-act="rsubj">'
    + '<option value="english"' + (resultSubject === "english" ? " selected" : "") + '>英語</option>'
    + '<option value="math"' + (resultSubject === "math" ? " selected" : "") + '>数学</option></select></div></div>'
    + '<div class="row"><div><label for="r-score">得点</label><input id="r-score" type="number" inputmode="numeric" placeholder="61"></div>'
    + '<div><label for="r-dev">偏差値</label><input id="r-dev" type="number" inputmode="decimal" step="0.1" placeholder="58"></div></div>'
    + '<label style="margin-top:16px">分野別の得点率（％）</label><div class="axes">'
    + axes.map(([k,label]) =>
        '<div class="ax"><span>' + label + '</span>'
        + '<input class="r-ax" data-k="' + k + '" type="number" inputmode="numeric" min="0" max="100" placeholder="0"></div>').join("")
    + '</div>'
    + '<button class="btn" data-act="addresult">この結果を保存する</button></div></details></section>';

  return h;
}
/* ---------- 演習 ---------- */
function viewPractice(){
  const p = db.practice;

  // 出題中・採点後
  if(p && p.questions && p.questions.length){
    const graded = p.status === "graded" && p.result;
    const gmap = {};
    if(graded) p.result.detail.forEach(d => gmap[d.no] = d);

    let h = '<p class="eyebrow">' + FORMATS[p.formatId].label + ' ・ ' + SUBJ[p.subject]
      + ' ・ ' + topicLabel(p.subject, p.topic) + '</p>';

    if(graded){
      const pct = Math.round(p.result.rate * 100);
      h += '<div class="score"><div class="score-n num">' + pct + '<small>%</small></div>'
        + '<div class="score-s">' + p.questions.length + '問 ・ '
        + p.result.detail.filter(d => d.score >= 80).length + '問が8割以上</div></div>';
      if(p.result.overall){
        h += '<div class="advice" style="margin-bottom:14px"><div class="advice-b">' + esc(p.result.overall) + '</div></div>';
      }
    }

    h += p.questions.map(q => {
      const g = gmap[q.no];
      const ans = p.answers[q.no];
      let s = '<div class="q' + (g ? (g.score >= 80 ? ' ok' : (g.score > 0 ? ' half' : ' ng')) : '') + '">';
      s += '<div class="q-h"><span class="q-no num">問' + q.no + '</span>'
        + '<span class="q-type">' + (q.type === "written" ? "記述" : "選択") + '</span>'
        + (g ? '<span class="q-score num">' + g.score + '点</span>' : '') + '</div>';
      s += '<div class="q-p">' + esc(q.prompt) + '</div>';

      if(q.type === "choice"){
        s += '<div class="opts">' + q.choices.map((c, i) => {
          const picked = Number(ans) === i;
          const cls = graded
            ? (i === q.answer ? " right" : (picked ? " wrong" : ""))
            : (picked ? " picked" : "");
          return '<button class="opt' + cls + '"' + (graded ? ' disabled' : '')
            + ' data-act="pick" data-no="' + q.no + '" data-i="' + i + '">'
            + '<span class="opt-i num">' + (i+1) + '</span>' + esc(c) + '</button>';
        }).join("") + '</div>';
      }else{
        s += graded
          ? '<div class="ansbox"><b>あなたの解答</b>' + esc((ans || "").trim() || "（無解答）") + '</div>'
          : '<textarea class="ansin" data-no="' + q.no + '" rows="4" placeholder="ここに解答を書く">' + esc(ans || "") + '</textarea>';
      }

      if(graded){
        if(g.comment) s += '<div class="q-c">' + esc(g.comment) + '</div>';
        if(q.type === "written" && q.modelAnswer)
          s += '<details class="fold"><summary>模範解答</summary><div class="q-e">' + esc(q.modelAnswer) + '</div></details>';
        if(q.explanation)
          s += '<details class="fold"><summary>解説</summary><div class="q-e">' + esc(q.explanation) + '</div></details>';
      }
      return s + '</div>';
    }).join("");

    if(graded){
      h += '<button class="btn primary" data-act="newset">別のセットをつくる</button>';
      h += '<button class="btn ghost" data-act="closeset">閉じる</button>';
    }else{
      h += '<button class="btn ' + (practiceBusy ? '' : 'primary') + '" data-act="grade"'
        + (practiceBusy ? ' disabled' : '') + '>' + (practiceBusy ? '採点中…' : '採点する') + '</button>';
      h += '<button class="btn ghost" data-act="closeset">中断して破棄</button>';
    }
    return h;
  }

  // 出題設定
  const fid = db.settings.practiceFormat || "zento2";
  const subj = db.settings.practiceSubject || "english";
  const auto = db.settings.practiceAuto !== false;
  const topic = auto ? weakestTopic(subj) : (db.settings.practiceTopic || PRACTICE_TOPICS[subj][0][0]);

  let h = '<p class="eyebrow">出題する</p><div class="card">'
    + '<label for="p-fmt">形式</label><select id="p-fmt" data-act="pset">'
    + Object.keys(FORMATS).map(k => '<option value="' + k + '"' + (fid === k ? " selected" : "") + '>' + FORMATS[k].label + '</option>').join("")
    + '</select>'
    + '<p class="item-sub" style="margin:6px 0 0">' + esc(FORMATS[fid].outline) + '</p>'
    + '<label for="p-subj">科目</label><select id="p-subj" data-act="pset">'
    + '<option value="english"' + (subj === "english" ? " selected" : "") + '>英語</option>'
    + '<option value="math"' + (subj === "math" ? " selected" : "") + '>数学</option></select>'
    + '<label>分野</label>'
    + '<div class="row" style="gap:6px;margin-bottom:9px">'
    + '<button class="btn btn-sm ' + (auto ? 'primary' : 'ghost') + '" data-act="pauto" data-v="1" style="flex:1;margin:0">弱点から自動</button>'
    + '<button class="btn btn-sm ' + (auto ? 'ghost' : 'primary') + '" data-act="pauto" data-v="0" style="flex:1;margin:0">自分で選ぶ</button></div>';

  if(auto){
    const r = latestResult(subj);
    h += '<div class="pick-auto">' + topicLabel(subj, topic)
      + (r && r.breakdown && r.breakdown[topic] != null
          ? ' <span class="num">' + Math.round(r.breakdown[topic]*100) + '%</span>' : '')
      + '</div>'
      + '<p class="item-sub" style="margin:5px 0 0">'
      + (r ? '直近の模試でいちばん低い分野です。' : '模試結果がまだないので、先頭の分野から始めます。') + '</p>';
  }else{
    h += '<select id="p-topic" data-act="pset">'
      + PRACTICE_TOPICS[subj].map(t => '<option value="' + t[0] + '"' + (topic === t[0] ? " selected" : "") + '>' + t[1] + '</option>').join("")
      + '</select>';
  }

  h += '<p class="item-sub" style="margin:12px 0 0">' + esc(FORMATS[fid][subj][topic] || "") + '</p>'
    + '<button class="btn ' + (practiceBusy ? '' : 'primary') + '" data-act="gen"' + (practiceBusy ? ' disabled' : '') + '>'
    + (practiceBusy ? '作成中…（30秒ほど）' : PRACTICE_COUNT + '問つくる') + '</button>';
  if(!(db.settings.apiKey || "").trim()){
    h += '<p class="item-sub" style="margin:7px 0 0">使うには設定タブで Claude の APIキーを登録してください。</p>';
  }
  h += '</div>';

  // 履歴
  const hist = db.practiceSets.filter(x => x.result);
  h += '<section style="margin-top:26px"><p class="eyebrow">これまでの演習</p>';
  if(!hist.length){
    h += '<div class="empty"><b>まだ記録がありません</b>解いた結果は分野別に集計され、分析タブのレーダーに重なります。</div>';
  }else{
    h += hist.slice(0,12).map(x =>
      '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + SUBJ[x.subject] + ' ・ ' + topicLabel(x.subject, x.topic)
      + ' <span class="num" style="color:' + (x.result.rate >= .8 ? 'var(--green)' : (x.result.rate >= .5 ? 'var(--amber)' : 'var(--red)')) + '">'
      + Math.round(x.result.rate*100) + '%</span></div>'
      + '<div class="item-sub">' + fmtFull(x.date) + ' ・ ' + FORMATS[x.formatId].label + ' ・ ' + x.questions.length + '問</div>'
      + '</div><button class="x" data-act="delset" data-id="' + x.id + '" aria-label="削除">×</button></div></div>').join("");
  }
  h += '</section>';
  return h;
}

/* ---------- 教材 ---------- */
function viewBooks(){
  let h = '<p class="eyebrow">参考書と単元</p>';
  if(!db.books.length){
    h += '<div class="empty"><b>教材がありません</b>参考書を追加し、単元ごとにページ数と重要度を入れてください。</div>';
  }
  h += db.books.map(b => {
    const units = b.units || [];
    const tot = units.reduce((s,u) => s + (Number(u.totalPages)||0), 0);
    const cur = units.reduce((s,u) => s + Math.min(Number(u.currentPage)||0, Number(u.totalPages)||0), 0);
    const pct = tot ? Math.round(cur / tot * 100) : 0;
    return '<div class="item"><div class="item-head"><div>'
      + '<div class="item-title">' + esc(b.title) + '</div>'
      + '<div class="item-sub">' + SUBJ[b.subject] + ' ・ ' + units.length + '単元 ・ ' + cur + '/' + tot + 'p（' + pct + '%）</div>'
      + '</div><button class="x" data-act="delbook" data-id="' + b.id + '" aria-label="削除">×</button></div>'
      + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
      + units.map(u => {
          const ut = Number(u.totalPages)||0, uc = Math.min(Number(u.currentPage)||0, ut);
          return '<div class="unit-line"><span class="wt">' + "●".repeat(u.weight) + "○".repeat(5-u.weight) + '</span>'
            + '<span class="nm">' + esc(u.name) + '</span>'
            + '<span class="pg">' + uc + '/' + ut + '</span>'
            + '<button class="x" data-act="delunit" data-id="' + b.id + '" data-uid="' + u.id + '" aria-label="削除">×</button></div>';
        }).join("")
      + '<details class="fold"' + (openBook === b.id ? ' open' : '') + '><summary>単元を追加</summary><div class="card" style="margin:8px 0 0;background:var(--board-deep)">'
      + '<label>単元名</label><input class="u-name" data-book="' + b.id + '" placeholder="二次関数">'
      + '<div class="row"><div><label>重要度 1–5</label><input class="u-w" data-book="' + b.id + '" type="number" inputmode="numeric" min="1" max="5" value="3"></div>'
      + '<div><label>総ページ</label><input class="u-tp" data-book="' + b.id + '" type="number" inputmode="numeric" value="40"></div>'
      + '<div><label>済ページ</label><input class="u-cp" data-book="' + b.id + '" type="number" inputmode="numeric" value="0"></div></div>'
      + '<button class="btn ghost" data-act="addunit" data-id="' + b.id + '">この単元を追加</button></div></details>'
      + '</div>';
  }).join("");

  h += '<div class="card" style="margin-top:16px"><p class="eyebrow">参考書を追加</p>'
     + '<label for="b-title">書名</label><input id="b-title" placeholder="システム英単語">'
     + '<label for="b-subj">科目</label><select id="b-subj"><option value="english">英語</option><option value="math">数学</option></select>'
     + '<button class="btn" data-act="addbook">参考書を追加する</button></div>';
  return h;
}

});

app.addEventListener("click", e => {
  const jump = e.target.closest("[data-tab-jump]");
  if(jump){ tab = jump.dataset.tabJump; openBook = null; render(); return; }
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const val = sel => { const el = document.querySelector(sel); return el ? el.value.trim() : ""; };
  const numv = (sel, d) => { const v = Number(val(sel)); return Number.isFinite(v) ? v : d; };

  if(act === "gen"){
    const fid = db.settings.practiceFormat || "zento2";
    const subj = db.settings.practiceSubject || "english";
    const auto = db.settings.practiceAuto !== false;
    const topic = auto ? weakestTopic(subj) : (db.settings.practiceTopic || PRACTICE_TOPICS[subj][0][0]);
    generatePractice(fid, subj, topic);
    return;
  }
  if(act === "pauto"){
    db.settings.practiceAuto = b.dataset.v === "1";
    save(); render(); return;
  }
  if(act === "pick"){
    if(!db.practice) return;
    db.practice.answers[b.dataset.no] = Number(b.dataset.i);
    save(); render(); return;
  }
  if(act === "grade"){ collectWritten(); gradePractice(); return; }
  if(act === "newset" || act === "closeset"){
    if(act === "closeset" && db.practice && db.practice.status !== "graded"
       && !confirm("この問題セットを破棄します。よろしいですか。")) return;
    db.practice = null; save(); render(); return;
  }
  if(act === "delset"){
    db.practiceSets = db.practiceSets.filter(x => x.id !== id);
    save(); render(); return;
  }

  if(act === "advise"){ generateAdvice(); return; }
  if(act === "deladvice"){
    db.weeklyAdvice = db.weeklyAdvice.filter(a => a.id !== id);
    save(); render(); return;
  }
  if(act === "savekey"){
    db.settings.apiKey = val("#s-key");
    db.settings.model = val("#s-model") || "claude-sonnet-5";
    save(); render();
    alert("保存しました。");
    return;
  }
  if(act === "testkey"){
    db.settings.apiKey = val("#s-key");
    db.settings.model = val("#s-model") || "claude-sonnet-5";
    save();
    b.disabled = true; b.textContent = "確認中…";
    callClaude("ひとことで答えてください。", "接続確認です。「OK」とだけ返してください。")
      .then(t => alert("つながりました。\n応答: " + t.slice(0, 40)))
      .catch(e => alert("つながりませんでした。\n\n" + e.message))
      .finally(() => render());
    return;
  }

  if(act === "metric"){
    trendMetric = b.dataset.m;
    render(); return;
  }
  if(act === "addresult"){
    const date = val("#r-date");
    const score = val("#r-score");
    if(!date || score === ""){ alert("受験日と得点を入れてください。"); return; }
    const bd = {};
    document.querySelectorAll(".r-ax").forEach(el => {
      const v = Number(el.value);
      if(el.value !== "" && Number.isFinite(v)) bd[el.dataset.k] = Math.min(1, Math.max(0, v / 100));
    });
    const dev = val("#r-dev");
    db.examResults.push({
      id: uid(), name: val("#r-name") || "模試", date,
      subject: val("#r-subj"), score: Number(score),
      deviation: dev === "" ? null : Number(dev), breakdown: bd
    });
    save(); render(); return;
  }
  if(act === "delresult"){
    db.examResults = db.examResults.filter(r => r.id !== id);
    save(); render(); return;
  }

  if(act === "toggle"){ toggleTask(id); return; }

  if(act === "regen"){
    const n = generatePlan();
    render();
    alert(n ? n + "件のタスクを組み直しました。" : "割り当てる教材がありません。教材タブで単元を登録してください。");
    return;
  }

  if(act === "addgoal"){
    const date = val("#g-date");
    if(!date){ alert("実施日を入れてください。"); return; }
    db.goals.push({
      id: uid(), name: val("#g-name") || "模試", examDate: date,
      subject: val("#g-subj"), targetScore: numv("#g-tgt", 68), currentScore: numv("#g-cur", 60)
    });
    save(); render(); return;
  }
  if(act === "delgoal"){
    db.goals = db.goals.filter(g => g.id !== id);
    save(); render(); return;
  }

  if(act === "addbook"){
    const title = val("#b-title");
    if(!title){ alert("書名を入れてください。"); return; }
    db.books.push({ id: uid(), title, subject: val("#b-subj"), units: [] });
    save(); render(); return;
  }
  if(act === "delbook"){
    if(!confirm("この参考書と単元をすべて削除します。よろしいですか。")) return;
    db.books = db.books.filter(x => x.id !== id);
    db.tasks = db.tasks.filter(t => t.bookId !== id);
    save(); render(); return;
  }

  if(act === "addunit"){
    const g = c => document.querySelector("." + c + '[data-book="' + id + '"]');
    const name = g("u-name").value.trim();
    if(!name){ alert("単元名を入れてください。"); return; }
    const total = Math.max(1, Number(g("u-tp").value) || 1);
    const cur = Math.min(total, Math.max(0, Number(g("u-cp").value) || 0));
    const w = Math.min(5, Math.max(1, Number(g("u-w").value) || 3));
    const book = db.books.find(x => x.id === id);
    book.units = book.units || [];
    book.units.push({ id: uid(), name, weight: w, status: cur > 0 ? "in_progress" : "todo", totalPages: total, currentPage: cur });
    openBook = id;
    save(); render();
    const f = document.querySelector('.u-name[data-book="' + id + '"]');
    if(f) f.focus();
    return;
  }
  if(act === "delunit"){
    const book = db.books.find(x => x.id === id);
    if(book) book.units = (book.units||[]).filter(u => u.id !== b.dataset.uid);
    db.tasks = db.tasks.filter(t => t.unitId !== b.dataset.uid);
    save(); render(); return;
  }

  if(act === "rest"){
    const d = Number(b.dataset.d);
    const r = db.settings.restDays;
    const i = r.indexOf(d);
    if(i >= 0) r.splice(i,1); else r.push(d);
    save(); render(); return;
  }
  if(act === "savecfg"){
    db.settings.weekdayPages = Math.max(0, numv("#s-wd", 12));
    db.settings.holidayPages = Math.max(0, numv("#s-hd", 24));
    db.settings.maxTasksPerDay = Math.min(6, Math.max(1, numv("#s-mt", 3)));
    db.settings.minChunk = Math.min(20, Math.max(1, numv("#s-mc", 3)));
    db.settings.bufferDays = Math.min(60, Math.max(0, numv("#s-bd", 7)));
    save();
    const n = generatePlan();
    tab = "today"; render();
    alert("保存しました。" + (n ? n + "件のタスクを組み直しました。" : ""));
    return;
  }

  if(act === "export"){
    const copy = JSON.parse(JSON.stringify(db));
    copy.settings.apiKey = "";   // 鍵はファイルに残さない
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gyakusan-" + today() + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    return;
  }
  if(act === "import"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const d = JSON.parse(r.result);
          if(!d || typeof d !== "object") throw new Error("形式が違います");
          const keepKey = db.settings.apiKey;
          db = Object.assign(structuredClone(DEFAULTS), d, {
            settings: Object.assign(structuredClone(DEFAULTS.settings), d.settings || {})
          });
          if(!db.settings.apiKey) db.settings.apiKey = keepKey;
          save(); render();
          alert("読み込みました。");
        }catch(err){
          alert("読み込めませんでした。このアプリで書き出したJSONを選んでください。");
        }
      };
      r.readAsText(f);
    };
    inp.click();
    return;
  }
  if(act === "reset"){
    if(!confirm("目標・教材・タスクをすべて消去します。元に戻せません。")) return;
    db = structuredClone(DEFAULTS);
    save(); tab = "today"; render();
    return;
  }
});

/* 記述欄の内容を都度ひろう（再描画で消えないように） */
function collectWritten(){
  if(!db.practice) return;
  document.querySelectorAll(".ansin").forEach(el => {
    db.practice.answers[el.dataset.no] = el.value;
  });
  save();
}
app.addEventListener("input", e => {
  if(e.target.classList && e.target.classList.contains("ansin")){
    if(db.practice) db.practice.answers[e.target.dataset.no] = e.target.value;
  }
});
window.addEventListener("pagehide", collectWritten);

app.addEventListener("change", e => {
  const ps = e.target.closest('[data-act="pset"]');
  if(ps){
    const id = ps.id;
    if(id === "p-fmt") db.settings.practiceFormat = ps.value;
    if(id === "p-subj"){ db.settings.practiceSubject = ps.value; db.settings.practiceTopic = null; }
    if(id === "p-topic") db.settings.practiceTopic = ps.value;
    save(); render(); return;
  }
  const el = e.target.closest('[data-act="rsubj"]');
  if(!el) return;
  resultSubject = el.value;
  render();
  const d = document.querySelector("details.fold");
  if(d) d.open = true;
});

window.addEventListener("resize", () => {
  if(tab === "plan"){ const cv = document.getElementById("meter"); if(cv) drawMeter(cv); }
  if(tab === "analysis"){
    const tr = document.getElementById("trend"); if(tr) drawTrend(tr, trendMetric);
    ["english","math"].forEach(s => {
      const cv = document.getElementById("radar-" + s); if(cv) drawRadar(cv, s);
    });
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW登録に失敗", err));
  });
}
</script>
